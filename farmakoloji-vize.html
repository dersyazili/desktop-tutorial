<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmakoloji Vize Çalışma</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mut:#5c6370;--line:#e3dfd6;--acc:#0f6e6e;--acc2:#e7f3f2;--ok:#1a7f37;--okb:#e6f4ea;--bad:#c62828;--badb:#fdecea;--tip:#fff6dd;--tipl:#e9b949}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2226;--ink:#e8e6e1;--mut:#a3a8b0;--line:#33373d;--acc:#4fb3b0;--acc2:#1d3433;--ok:#5fcf7a;--okb:#16301e;--bad:#ff7b72;--badb:#3a1d1c;--tip:#33290f;--tipl:#a8822a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:650;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:860px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:9px 2px 8px;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600}
nav a span{display:block;font-size:20px;line-height:1.1}
nav a.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.unit{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit}
.unit .no{flex:0 0 38px;height:38px;border-radius:10px;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:700}
.unit h3{margin:0 0 3px;font-size:16px}
.unit p{margin:0;color:var(--mut);font-size:13.5px}
.meta{font-size:12.5px;color:var(--mut);margin-top:4px}
h2{font-size:19px;margin:6px 0 12px}
.sec h3{font-size:16.5px;margin:0 0 8px;color:var(--acc)}
.sec p,.sec li{font-size:15.5px}
.sec ul,.sec ol{padding-left:20px;margin:6px 0}
.sec li{margin:3px 0}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--acc2)}
.tip{background:var(--tip);border-left:4px solid var(--tipl);padding:8px 12px;border-radius:6px;margin:10px 0;font-size:14.5px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.toc a{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--ink);text-decoration:none}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.sec2{background:var(--acc2);color:var(--acc)}
.btn.full{display:block;width:100%;text-align:center;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.qnum{font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.bar{height:5px;background:var(--line);border-radius:3px;margin:6px 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.qtext{font-size:17px;font-weight:600;margin:4px 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 8px;font-size:15.5px;cursor:pointer}
.opt b{flex:0 0 22px;color:var(--mut)}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.bad{border-color:var(--bad);background:var(--badb)}
.exp{border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:15px;background:var(--acc2)}
.exp.ok{background:var(--okb)}.exp.bad{background:var(--badb)}
.tag{display:inline-block;font-size:11.5px;background:var(--acc2);color:var(--acc);border-radius:6px;padding:1px 7px;margin-bottom:6px}
.choice{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.choice label{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;cursor:pointer;background:var(--card)}
.choice input{display:none}
.choice input:checked+span{color:var(--acc);font-weight:700}
.choice label:has(input:checked){border-color:var(--acc);background:var(--acc2)}
.ulist label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.score{font-size:34px;font-weight:800;color:var(--acc);margin:4px 0}
.ures{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.dots button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px}
.dots button.ans{background:var(--acc2);border-color:var(--acc)}
.dots button.cur{outline:2px solid var(--acc)}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
figure{margin:10px 0;text-align:center}figure img{max-width:100%;border-radius:8px;cursor:zoom-in}figcaption{font-size:13px;color:var(--mut)}
@media(min-width:700px){main{padding:20px}.qtext{font-size:18px}}

</style>
</head>

<script>
U.push({"id":"u1","no":1,"title":"Genel Farmakoloji","kisa":"Tanımlar, ilaç kaynakları, isimlendirme, farmasötik şekiller, uygulama yolları, doz, tolerans, bağımlılık, alerji","s":[{"h":"1. Farmakoloji ve bölümleri","b":"\n<p><b>Farmakoloji</b> = Yunanca <i>farmakon</i> (ilaç) + <i>logos</i> (bilim). İlacın canlıya, canlının ilaca ne yaptığını araştırır; tedavi ile biyoloji arasında köprüdür. Ağrısını azaltmak için afyon alan insanlar farkında olmadan farmakolojinin öncüsü olmuştur.</p>\n<table><tr><th>Dal</th><th>İnceler</th></tr>\n<tr><td><b>Farmakodinami</b></td><td>İlacın <b>organizmaya</b> ne yaptığı: etki şekli, doz-etki ilişkisi, etkileşmeler, direnç, bağımlılık, istenmeyen etkiler</td></tr>\n<tr><td><b>Farmakokinetik</b></td><td><b>Organizmanın ilaca</b> ne yaptığı: emilim, dağılım, metabolizma, atılım (idrar, safra, dışkı, süt, tükürük, ter)</td></tr>\n<tr><td><b>Kemoterapi</b></td><td>Parazit, bakteri, mikroorganizma ve <b>tümöral</b> hastalıkların ilaçla tedavisi</td></tr>\n<tr><td><b>Toksikoloji</b></td><td>Zehir (toksikon) bilimi; ilaç ve kimyasalların toksik etkileri</td></tr>\n<tr><td><b>Biyofarmasötik</b></td><td>Farmasötik form + fizikokimyasal özellik ile farmakokinetik/etki ilişkisi</td></tr>\n<tr><td><b>Uygulamalı farmakoloji</b></td><td>Endikasyon, dozaj, kontrendikasyon, etkileşme</td></tr></table>\n<div class=\"tip\">Tuzak: \"Organizmanın ilaca yaptığı\" = <b>farmakokinetik</b>; \"ilacın organizmaya yaptığı\" = <b>farmakodinami</b>.</div>"},{"h":"2. İlaç, drog, seçici ve geçici etki","b":"\n<ul><li><b>İlaç:</b> Fizyolojik sistem ya da patolojik durumu kullananın yararına değiştirmek/araştırmak için uygulanan madde. Tanı, organik fonksiyon düzenleme ve diyet için kullanılanları da kapsar.</li>\n<li><b>İlaç DEĞİLDİR:</b> çevre dezenfeksiyonu maddeleri, diş protezi maddeleri, elektrik, kültür-fizik, röntgen ışınları.</li>\n<li><b>Drog:</b> Her türlü ilaç <b>hammaddesi</b>; çoğu bitkisel, botanik ve eczacılıkla ilişkili.</li>\n<li><b>Seçici etki:</b> Yalnızca hedef doku/hücre/organı etkilemeli. Seçicilik ilaçlarda <b>tam değil, kısmidir</b>.</li>\n<li><b>Geçici etki:</b> İlaç bırakılınca etkinin belli sürede kendiliğinden kaybolması.</li></ul>\n<p><b>İlacın sahip olması gereken özellikler:</b> seçicilik, uygulama bitince etkinin belli sürede kalkması, <b>etkinin doza bağımlı</b> olması.</p>\n<p><b>İlaçların organizmada yaptığı değişimler:</b> beden-zihin fonksiyonlarını etkiler; eksik maddeyi ikame eder; patojenleri yok eder; somatik/psişik olayları etkiler.</p>"},{"h":"3. Tedavi şekilleri","b":"\n<table><tr><th>Tedavi</th><th>Özellik</th></tr>\n<tr><td><b>Radikal</b></td><td>Hastalık etkeni yok edilir, <b>tam iyileşme</b></td></tr>\n<tr><td><b>Palyatif</b></td><td>Neden ortadan kalkmaz; semptom düzelir (ağrı dindirme, kalp atımını yavaşlatma). Şiddet azalır, yaşam uzar, <b>hastalık tedavi olmaz</b></td></tr>\n<tr><td><b>Ampirik</b></td><td>Neden ve ilacın etki şekli bilinmeden <b>gözlem ve denemeyle</b> yapılan tedavi</td></tr></table>"},{"h":"4. İlaçların elde edildiği kaynaklar","b":"\n<p><b>Sentez:</b> İlk sentez ilaçlar genel anesteziklerden <b>azot peroksit ve eter</b>.</p>\n<p><b>Bitkisel kaynaklılar</b> (başlıcaları glikozidler ve alkaloidler):</p>\n<table><tr><th>Grup</th><th>Özellik</th><th>Örnek</th></tr>\n<tr><td>Alkaloitler</td><td>Asitle tuz yapan azotlu bazlar; bitkide <b>%0,1–3</b></td><td>Atropin, kokain, morfin, nikotin, striknin</td></tr>\n<tr><td>Glikozitler</td><td>Sülfidril/hidroksil gruplu bileşik + şeker</td><td>Digitoksin, gitoksin</td></tr>\n<tr><td>Reçineler</td><td>Uçucu yağların yükseltgenmesi; suda erimez, ısıda yumak yapar</td><td>Podofillin, jalapa, esrar</td></tr>\n<tr><td>Saponinler</td><td><b>Alyuvar parçalar</b> (kan zehiri)</td><td>Glisirhizinik asit, senegenol</td></tr>\n<tr><td>Tanenler</td><td>Büzüştürücü; protein, alkaloit, metal çöktürür</td><td>Epikateşin, tannik asit</td></tr>\n<tr><td>Sabit yağlar</td><td>Yağ asidi + gliserin esteri</td><td>Ayçiçeği, badem, mısır yağı; mineral: parafin</td></tr>\n<tr><td>Uçucu yağlar</td><td>Aromatik</td><td>Karanfil, nane, gül yağı</td></tr></table>\n<ul><li><b>Mikroorganizma kaynaklı:</b> antibiyotik (penisilin G, eritromisin, streptomisin), antelmintik (avermektinler), enzim (penisilinaz, streptokinaz, L-asparaginaz).</li>\n<li><b>Hayvansal:</b> hormonlar (oksitosin, insülin), bal mumu, pankreatin, pepsin.</li>\n<li><b>Madensel:</b> iyot, kükürt, alüminyum, demir, amonyum, magnezyum bileşikleri.</li>\n<li><b>DNA rekombinasyonu (gen klonlama):</b> Gen plazmid/virüse eklenip <i>E. coli</i> gibi hızlı çoğalan bakteriye konur. Daha ucuz üretim. Büyüme hormonu, insan interferonları, insülin, bazı aşılar.</li></ul>"},{"h":"5. İsimlendirme, tıbbi ürün, yapılış şekilleri","b":"\n<table><tr><th>Ad</th><th>Açıklama</th><th>Örnek</th></tr>\n<tr><td><b>Genel ad</b></td><td>DSÖ düzenler; bilimsel yayın ve öğretimde</td><td>Penisilin</td></tr>\n<tr><td><b>Ticari ad</b></td><td>Firmaya özel; bir ürünün çok ticari adı olabilir</td><td>Asporan, Asabrin</td></tr>\n<tr><td><b>Kimyasal ad</b></td><td>Kimya komitesi verir; uzun, pratikte kullanılmaz</td><td>Acetylsalicylic acid</td></tr>\n<tr><td><b>Patentli ticari isim (\"R\")</b></td><td>Patentli ilk maddeye verilen ad; adın yanına R</td><td>Terramisin (Pfizer)</td></tr></table>\n<ul><li><b>Patentli tıbbi ürün koruma süresi:</b> AB'de <b>10 yıl</b>, Türkiye'de <b>6 yıl</b>, arı/balık/hayvan ilaçlarında <b>13 yıl</b>.</li>\n<li><b>Jenerik ürün:</b> Aynı etkin madde, nitelik-nicelik, farmasötik şekil ve benzer biyoyararlanım; patent süresi dolunca üretilir.</li>\n<li><b>Majistral ilaç:</b> Doktor her hasta için ayrı belirler, <b>eczanede yapılır</b>.</li>\n<li><b>Ofisinal ilaç:</b> <b>Farmakope</b> formülü baz alınır.</li>\n<li><b>Tıbbi müstahzar:</b> Sabit formatta, özel isimle, Bakanlık ruhsatlı, eczanede satılan.</li></ul>"},{"h":"6. Farmasötik şekiller","b":"\n<p><b>Katı – oral:</b> Tablet (preslenmiş; GİS'de şişip dağılır; çiğneme/köpüren türleri), <b>draje</b> (şeker/çikolata kaplı tablet), <b>pilül</b> (bal/şurupla küre), <b>kapsül</b> (jelatin; barsakta açılan = barsak kaplamalı), <b>kaşe</b> (nişasta, ör. <b>Gripin</b>), toz, paket (tek dozluk kağıt).</p>\n<p><b>Diğer katı:</b> <b>Supozituvar</b> (rektal, oda ısısında katı/beden ısısında eriyen, koni), <b>ovül</b> (vajinal), <b>TTS</b> (transdermal flaster; göğüs/kulak arkası; angina için <b>nitrogliserin</b>).</p>\n<p><b>Sıvı:</b></p><ul>\n<li><b>Çözelti</b>; tanecik gözle/büyüteçle görülüyorsa <b>süspansiyon</b>, molekülden büyük süspansiyondan küçükse <b>kolloid</b>. Örnek: kolera, lugol, fowler çözeltisi.</li>\n<li><b>Enjeksiyonluk solüsyon:</b> izotonik, steril ya da hipertonik. <b>Yağlı olanlar deri altı/İV verilmez.</b> Kolay denatüre olanlar kuru toz halinde.</li>\n<li><b>Süspansiyon:</b> bekletilince katı dibe çöker. <b>Emülsiyon:</b> sıvı içinde sıvı damlacık.</li>\n<li><b>Şurup:</b> <b>%60'tan fazla şeker</b> → mantar/bakteri üremez. <b>Posyon:</b> eser şeker → üreme olabilir, majistral en fazla <b>4–5 günlük</b>.</li>\n<li><b>Eliksir:</b> su + alkol, şekerle tatlandırılmış. <b>Damla:</b> sayarak; göz damlası = <b>kolir</b>.</li>\n<li><b>Lavman:</b> rektal; küçük hacimli = <b>enema</b>. <b>Merhem (pomad):</b> lanolin/vazelin; sert olana <b>pat</b>.</li>\n<li><b>Aerosol:</b> itici gaz (bütan-propan) + etken madde; haşere mücadelesi.</li></ul>"},{"h":"7. Uygulama yerleri – lokal","b":"\n<p>Etki için ilacın etki yerinde ulaşması gereken en düşük yoğunluk: <b>minimum etkin konsantrasyon (MEK)</b>.</p>\n<ul><li><b>Cilt içi:</b> alerji testleri, lokal anestezik; <b>0,1 ml'den fazla verilmez</b>.</li>\n<li><b>İntratekal:</b> <b>L3–L4</b> arası subaraknoid boşluk; verilecek ilaç hacmi kadar BOS alınır. Spinal sinir kökü hastalıkları, lokal anestezi.</li>\n<li><b>İntraplevral, intraperitoneal:</b> iltihapta antibakteriyel/lokal anestezik.</li>\n<li><b>İntrakardiyak:</b> acilde <b>adrenalin</b>. <b>İntraartiküler:</b> antibakteriyel, kortikosteroid.</li>\n<li><b>İntrauterin:</b> sezaryen sonrası myometriuma <b>oksitosin</b> → uterus büzülür, kanama azalır.</li>\n<li><b>İntravajinal:</b> supozituvar, sıvı; spermisid jel/köpük.</li>\n<li><b>Konjonktiva:</b> nazolakrimal kanaldan burun mukozasına geçip sistemik toksisite yapabilir → <b>gözün iç köşesine bastırılır</b>.</li>\n<li><b>Burun içi:</b> lokal anestezik, antibakteriyel, vazokonstriktör; bazı hormonlar sistemik etki için.</li>\n<li><b>Ağız:</b> gargara, pastil.</li></ul>"},{"h":"8. Uygulama yerleri – sistemik","b":"\n<p><b>Enteral</b> (GİS'den emilim): oral, sublingual, rektal.</p>\n<ul><li><b>Oral:</b> en çok tercih edilen yol. Burundan/ağızdan mideye kateterle besin/ilaç = <b>gavaj</b>.</li>\n<li><b>Sublingual:</b> portal dolaşıma girmez → <b>ilk geçiş etkisinden korunur</b>; etki <b>0,5–1 dakikada</b> başlar. Örnek: <b>nitrogliserin</b> (non-iyonize, yağda çözünür).</li>\n<li><b>Rektal:</b> emilenin <b>%50'si karaciğeri bypass eder</b>; emilim eksik/düzensiz olabilir; oral alamayan bebek ve hastalarda tercih.</li></ul>\n<p><b>Parenteral</b> (GİS'den emilemeyen/denatüre olan; ivedi etki):</p>\n<ul><li><b>İV:</b> yalnız <b>suda eriyen</b> ilaçlar; hızlı etki; dokuda nekroz/ağrı yapan maddeler.</li>\n<li><b>İntraarteriyel:</b> KC tümörü, baş-boyun kanseri; radyoopak madde.</li>\n<li><b>Deri altı (SC):</b> tahriş etmeyen ilaçlar; femur/humerus dış yüzü. Tablet deri altına = <b>pelet implantasyonu</b>.</li>\n<li><b>İM:</b> deltoid veya gluteal; şişmanlarda <b>uzun iğne</b>.</li>\n<li><b>Kemik iliği:</b> bebekte venler küçük, yetişkinde venler büzüşmüş ise.</li></ul>\n<p><b>Transdermal:</b> TTS (nitrogliserin). <b>İnhalasyon:</b> genel anestezi; hızlı emilim, <b>KC ilk geçiş etkisi yok</b>, akciğerde lokal etki.</p>"},{"h":"9. Doz ve dozaj","b":"\n<table><tr><th>Kavram</th><th>Tanım</th></tr>\n<tr><td><b>Doz</b></td><td>Bir defada verilen miktar; kurallara uygun uygulanması = <b>dozaj</b></td></tr>\n<tr><td><b>Hücum dozu</b></td><td>Başlangıçta normal dozun <b>1,5–2 katı</b>; toksik-tedavi dozu aralığı geniş ilaçlarda (bazı analjezik, antibiyotik)</td></tr>\n<tr><td><b>Toksisitesi yüksek ilaçlar</b></td><td><b>Digitalikler, psikotrop ilaçlar, kortikosteroidler:</b> küçük dozla başlanır, giderek artırılır; kesilmesi de azaltarak</td></tr>\n<tr><td><b>Sürdürme dozu</b></td><td>Hücum dozundan sonra daha küçük dozlarla devam</td></tr>\n<tr><td><b>Maksimal doz</b></td><td>Toksik ilaçlarda kodekste bir kezde/24 saatte en fazla miktar; eczacı aşan reçeteyi geri çevirebilir</td></tr>\n<tr><td><b>Total doz</b></td><td>Tedavi boyunca tolere edilebilecek toplam miktar</td></tr>\n<tr><td><b>Erişkin dozu</b></td><td><b>50–100 kg, 16–60 yaş</b> erişkinde tek seferlik miktar</td></tr>\n<tr><td><b>Çocuk dozu</b></td><td>Prematüre/yenidoğanda enzim (<b>glükuronidaz</b>) yetersiz; vücut ağırlığı ve bazen yaşa göre (2–5, 6–12 yaş)</td></tr></table>\n<p><b>Doz-yanıt bağıntısını belirleyenler:</b> reseptör, reaktif bölgedeki konsantrasyon, uygulanan doz.</p>"},{"h":"10. Uyunçsuzluk, tolerans, bağımlılık","b":"\n<p><b>Uyunçsuzluk</b> (reçeteye uymama): kültür düzeyi düşük toplumlarda yüksek; <b>yaşlılarda %40–75</b>. Nedenler: fazla doz alma, zamanı unutma (demans, çoklu ilaç), az alma/erken kesme, reçeteyi almama.</p>\n<ul><li><b>Akiz (kazanılmış) tolerans:</b> aynı etki için giderek artan doz gerekir. Mikroorganizmaların antibiyotik direnci de örnek.</li>\n<li><b>Çapraz tolerans:</b> Benzer yapılı ilaçların hepsine; <b>alkolikler SSS depresanlarına</b>.</li>\n<li><b>Taşifilaksi:</b> Tekrarlanan verilişlerden sonra <b>dakikalar içinde</b> gelişen akut tolerans.</li>\n<li><b>Bağımlılık:</b> Psikotrop ilaçlar toleransla birlikte sürekli gereksinim yaratır. Etkenler: kişilik/kalıtım, sosyo-kültürel ortam, ilacın özelliği, miktar, sıklık, yol. Suç işleme oranı artar.</li>\n<li><b>Çapraz bağımlılık:</b> A'ya bağımlının gereksinimi farklı yapılı B ile gideriliyor; <b>morfin bağımlısına metadon</b>.</li>\n<li><b>Tedavi başarısı düşük (%20).</b> Arındırma + psikososyal tedavi. Opioid bağımlılığı: yerine koyma (<b>metadon</b>), antagonist (<b>nalokson, naltrekson</b>).</li></ul>"},{"h":"11. İlaç alerjisi ve anafilaktik şok","b":"\n<p>İlk temastan sonra duyarlılık gelişmesi. Farmakolojik özellikle benzerliği yok; ilacı diğer etkilerden ayıran <b>immünolojik tepki</b> olmasıdır. Küçük moleküllerin proteinle birleşip antijen oluşturması gerekir. Antikorlar <b>1–2 haftada</b> oluşur; sonraki temasta hafif kaşıntıdan ölüme kadar reaksiyon.</p>\n<table><tr><th>Tip</th><th>Başlama</th></tr><tr><td>Tip I</td><td><b>0–30 dakika</b></td></tr><tr><td>Tip II</td><td><b>6 saat</b></td></tr><tr><td>Tip III</td><td><b>36 saatte pik</b></td></tr></table>\n<p><b>Etkileyen faktörler:</b></p><ul>\n<li><b>Doz:</b> şiddet ve sıklık <b>dozla doğrudan ilişkili değil</b>; çok küçük dozda bile olur.</li>\n<li><b>Veriliş yolu:</b> mukoza (kolir, burun damlası) veya inflamasyonlu cilt.</li>\n<li><b>Genetik:</b> toplumun <b>%10–15</b>'inde yatkınlık.</li>\n<li><b>Hastalık:</b> KC/böbrek lezyonları insidansı artırır.</li></ul>\n<p><b>Anafilaktik şok:</b> En tehlikeli alerji sendromu; ilaç (İV'de daha kısa sürede), gıda veya böcek sokmasından dakikalar sonra ağır kardiyovasküler şok. Hafif tabloda ürtiker, eritem, anjiyoödem, bronkospazm, epigastrik ağrı.</p>\n<div class=\"tip\">Kitapta alerji alt başlıkları \"16. İlaç Alerjisi\" altında yanlışlıkla 15.1 / 15.2 diye numaralanmış.</div>"}],"q":[{"q":"İlacın organizmada emilim, dağılım, metabolizma ve atılımını inceleyen farmakoloji dalı hangisidir?","o":["Farmakodinami","Biyofarmasötik","Farmakokinetik","Toksikoloji","Uygulamalı farmakoloji"],"a":2,"e":"Farmakokinetik \"organizmanın ilaca ne yaptığını\" inceler."},{"q":"\"İlacın organizmaya ne yaptığını\" inceleyen; doz-etki ilişkisi, direnç ve bağımlılığı kapsayan dal hangisidir?","o":["Farmakokinetik","Farmakodinami","Kemoterapi","Biyofarmasötik","Toksikoloji"],"a":1,"e":"Farmakodinami ilacın etki şekli ve etkilerini inceler."},{"q":"Farmasötik formun ve ilacın fizikokimyasal özelliklerinin farmakokinetik ve etkiyle ilişkisini inceleyen dal hangisidir?","o":["Farmakodinami","Uygulamalı farmakoloji","Kemoterapi","Toksikoloji","Biyofarmasötik"],"a":4,"e":"Biyofarmasötik tanımı."},{"q":"Aşağıdakilerden hangisi kitaba göre ilaç DEĞİLDİR?","o":["Röntgen ışınları","Tanı amacıyla kullanılan madde","Diyet amacıyla kullanılan madde","Sentez yoluyla elde edilen madde","Hayvansal kaynaklı hormon"],"a":0,"e":"Çevre dezenfeksiyonu maddeleri, diş protezi maddeleri, elektrik, kültür-fizik ve röntgen ışınları ilaç değildir."},{"q":"Tedavide kullanılan her türlü ilaç hammaddesine ne ad verilir?","o":["Müstahzar","Jenerik","Metabolit","Drog","Majistral"],"a":3,"e":"Drog: ilaç hammaddesi, çoğu bitkisel."},{"q":"Hastalığın nedenini ortadan kaldırmadan semptomları düzelten, yaşam süresini uzatan ancak hastalığı iyileştirmeyen tedavi hangisidir?","o":["Radikal tedavi","Ampirik tedavi","Profilaktik tedavi","Palyatif tedavi","Sürdürme tedavisi"],"a":3,"e":"Palyatif tedavi: ağrı dindirme, kalp atımını yavaşlatma gibi."},{"q":"Hastalığın nedeni ve ilacın etki şekli bilinmeden gözlem ve denemelerle yapılan tedavi hangisidir?","o":["Radikal tedavi","Ampirik tedavi","Palyatif tedavi","Hedefe yönelik tedavi","Kombine tedavi"],"a":1,"e":"Ampirik tedavi tanımı."},{"q":"İlk sentez ilaçlar hangileridir?","o":["Penisilin ve streptomisin","Morfin ve kodein","İnsülin ve oksitosin","Aspirin ve parasetamol","Azot peroksit ve eter"],"a":4,"e":"İlk sentez ilaçlar genel anesteziklerden azot peroksit ve eterdir."},{"q":"Bitkilerde %0,1–3 oranında bulunan, asitle tuz oluşturan azotlu bazlar hangileridir?","o":["Alkaloitler","Glikozitler","Tanenler","Saponinler","Reçineler"],"a":0,"e":"Alkaloitler: atropin, kokain, morfin, nikotin, striknin."},{"q":"Alyuvarları parçalaması en belirgin özelliği olan bitkisel madde grubu hangisidir?","o":["Tanenler","Alkaloitler","Saponinler","Glikozitler","Uçucu yağlar"],"a":2,"e":"Saponinler kan zehiri olarak alyuvar zarını parçalar."},{"q":"Digitoksin ve gitoksin hangi bitkisel madde grubuna örnektir?","o":["Alkaloitler","Glikozitler","Reçineler","Tanenler","Saponinler"],"a":1,"e":"Glikozit: sülfidril/hidroksil gruplu bileşik + şeker."},{"q":"Proteinleri, alkaloitleri ve metalleri çöktüren, mukozalarda büzüştürücü etki gösteren grup hangisidir?","o":["Saponinler","Reçineler","Glikozitler","Sabit yağlar","Tanenler"],"a":4,"e":"Tanenler: epikateşin, tannik asit."},{"q":"Aşağıdaki eşleştirmelerden hangisi YANLIŞTIR?","o":["Alkaloit – Atropin","Glikozit – Digitoksin","Saponin – Podofillin","Tanen – Tannik asit","Uçucu yağ – Nane yağı"],"a":2,"e":"Podofillin bir reçinedir (podofillin, jalapa, esrar)."},{"q":"Penisilinaz, streptokinaz ve L-asparaginaz hangi kaynaktan elde edilen maddelerdir?","o":["Mikroorganizma","Hayvansal","Madensel","Bitkisel","Sentetik"],"a":0,"e":"Mikroorganizma kaynaklı enzimlerdir."},{"q":"DNA rekombinasyonu (gen klonlama) tekniğiyle üretilenlerden biri hangisidir?","o":["Digitoksin","Morfin","Pepsin","İnsan interferonları","Eter"],"a":3,"e":"Büyüme hormonu, insan interferonları, insülin ve bazı aşılar bu teknikle üretilir."},{"q":"İlaçların genel isimleriyle ilgili düzenlemeleri hangi kuruluş yapar?","o":["Sağlık Bakanlığı","Kimya komitesi","Avrupa Birliği","Dünya Sağlık Örgütü","İlaç firmaları"],"a":3,"e":"Genel ad DSÖ tarafından düzenlenir; örnek: penisilin."},{"q":"\"Acetylsalicylic acid\" hangi tür isimlendirmeye örnektir?","o":["Kimyasal ad","Genel ad","Ticari ad","Patentli ticari isim","Jenerik ad"],"a":0,"e":"Kimyasal ad uzun ve karmaşıktır, pratikte kullanılmaz."},{"q":"Patentli tıbbi ürünün koruma süresi Türkiye'de kaç yıldır?","o":["10 yıl","6 yıl","13 yıl","5 yıl","20 yıl"],"a":1,"e":"AB'de 10 yıl, Türkiye'de 6 yıl, hayvan ilaçlarında 13 yıl."},{"q":"Arı, balık ve diğer hayvan türlerinde kullanılacak ilaçlarda patent koruma süresi kaç yıldır?","o":["6 yıl","10 yıl","8 yıl","15 yıl","13 yıl"],"a":4,"e":"Kitapta hayvan ilaçları için 13 yıl verilmiştir."},{"q":"Farmasötik şekli ve bileşimi doktor tarafından her hasta için ayrı belirlenip eczanede hazırlanan ilaç hangisidir?","o":["Ofisinal ilaç","Tıbbi müstahzar","Majistral ilaç","Jenerik ilaç","Patentli ilaç"],"a":2,"e":"Majistral ilaç tanımı."},{"q":"Farmakopedeki formüller baz alınarak hazırlanan ilaçlar hangileridir?","o":["Majistral ilaçlar","Ofisinal ilaçlar","Tıbbi müstahzarlar","Jenerik ürünler","Drog"],"a":1,"e":"Ofisinal ilaç: farmakope formülü."},{"q":"Nişastadan yapılan silindirik yassı muhafazalara konan ilaç şekli (ör. Gripin) hangisidir?","o":["Kapsül","Draje","Pilül","Kaşe","Paket"],"a":3,"e":"Kaşe nişastadan yapılır."},{"q":"Oda ısısında katı, beden ısısında eriyen, rektuma uygulanan koni şeklindeki farmasötik form hangisidir?","o":["Ovül","Enema","Pomad","TTS","Supozituvar"],"a":4,"e":"Supozituvar tanımı; vajinal benzeri ovüldür."},{"q":"Şurubun içinde mantar ve bakteri üreyememesinin nedeni nedir?","o":["Alkol içermesi","Steril üretilmesi","%60'tan fazla şeker içermesi","Asidik pH'ı","Koruyucu madde eklenmesi"],"a":2,"e":"Şurup %60'tan fazla şeker içerir."},{"q":"Eser miktarda şeker içerdiği için mantar ve bakteri üreyebilen, majistral olarak en fazla 4–5 günlük yapılan sıvı form hangisidir?","o":["Posyon","Şurup","Eliksir","Emülsiyon","Kolir"],"a":0,"e":"Posyon tanımı."},{"q":"Göze uygulanmaya uygun özel ilaçlara ne ad verilir?","o":["Enema","Pat","Ovül","Posyon","Kolir"],"a":4,"e":"Göz damlasına kolir denir."},{"q":"Cilt içi uygulamada en fazla ne kadar hacim verilmelidir?","o":["0,5 ml","1 ml","0,1 ml","2 ml","5 ml"],"a":2,"e":"Cilt içine 0,1 ml'den fazla uygulanmaz."},{"q":"İntratekal uygulama hangi vertebralar arasından yapılır?","o":["3.–4. lomber","1.–2. lomber","5. lomber – 1. sakral","11.–12. torakal","4.–5. servikal"],"a":0,"e":"L3–L4 arası subaraknoid boşluğa uygulanır."},{"q":"Sezaryen sonrası uterusun hızla büzülmesi için myometriuma oksitosin verilmesi hangi uygulama yoludur?","o":["İntravajinal","İntraperitoneal","İntraarteriyel","İntrauterin","İntramüsküler"],"a":3,"e":"İntrauterin uygulama."},{"q":"Göze damla uygulandıktan sonra sistemik toksisiteyi önlemek için ne yapılmalıdır?","o":["Göz hemen yıkanmalı","Gözün iç köşesine bastırılarak nazolakrimal kanal kapatılmalı","Hasta sırtüstü yatırılmalı","Göz kapağı ovulmalı","Damla ısıtılarak verilmeli"],"a":1,"e":"Göz ilaçları nazolakrimal kanal yoluyla burun mukozasından emilebilir."},{"q":"Burundan veya ağızdan mideye özel kateterle ilaç ya da besin verilmesine ne ad verilir?","o":["Lavman","Gavaj","Enema","İnhalasyon","Perfüzyon"],"a":1,"e":"Gavaj tanımı."},{"q":"Nitrogliserinin sublingual yolla etkili olmasının nedeni aşağıdakilerden hangisidir?","o":["Portal dolaşıma girmeden ilk geçiş etkisinden korunması","Midede asitle aktifleşmesi","Proteinlere yüksek oranda bağlanması","Suda çok iyi çözünmesi","İyonize halde bulunması"],"a":0,"e":"Dil altı venöz drenaj portal dolaşıma uğramaz; nitrogliserin non-iyonize ve yağda çözünür; etki 0,5–1 dk'da başlar."},{"q":"Rektal yolla emilen ilacın yaklaşık ne kadarı karaciğeri bypass eder?","o":["%10","%25","%75","%50","%100"],"a":3,"e":"Rektumdan emilenin %50'si KC'yi bypass eder."},{"q":"İntravenöz yol için aşağıdakilerden hangisi doğrudur?","o":["Yağlı solüsyonlar tercih edilir","Etki en geç başlayan yoldur","Dokuyu tahriş eden ilaçlar verilemez","Bilinçsiz hastada kullanılamaz","Yalnız suda eriyen ilaçlar uygulanabilir"],"a":4,"e":"İV: yalnız suda eriyen ilaçlar; dokuda nekroz yapan maddeler İV verilir."},{"q":"Tablet formundaki ilacın deriye küçük bir ensizyonla deri altına yerleştirilmesine ne ad verilir?","o":["Gavaj","TTS","Pelet implantasyonu","İnfiltrasyon","Perfüzyon"],"a":2,"e":"Pelet implantasyonu."},{"q":"Şişman hastada gluteal bölgeye İM enjeksiyon yapılırken dikkat edilecek nokta nedir?","o":["Kısa iğne kullanılmalı","Deri altına yapılmalı","Uzun iğne kullanılmalı","Deltoid kesinlikle seçilmemeli","İlaç seyreltilmeli"],"a":2,"e":"Deri altı yağ dokusu kalın olduğundan uzun iğne gerekir."},{"q":"Bebeklerde venlerin küçük olması nedeniyle tercih edilebilen parenteral yol hangisidir?","o":["İntraarteriyel","İntratekal","İntrakardiyak","Kemik iliği","İntraperitoneal"],"a":3,"e":"Kemik iliğine uygulama bebeklerde ve venleri büzüşmüş yetişkinlerde."},{"q":"Aşağıdakilerden hangisi inhalasyon yolunun avantajıdır?","o":["Yalnızca suda çözünen ilaçlar için uygun olması","KC ilk geçiş etkisinin olmaması","Etkinin geç başlaması","Emilimin düzensiz olması","Yalnızca lokal etki sağlaması"],"a":1,"e":"Derhal emilim, ilk geçiş etkisi yok, pulmoner hastalıkta lokal etki."},{"q":"Hücum dozu normal dozun kaç katıdır?","o":["3–4 katı","Yarısı","5 katı","10 katı","1,5–2 katı"],"a":4,"e":"Başlangıçta normal dozun 1,5–2 katı verilir."},{"q":"Aşağıdaki ilaçlardan hangisine küçük dozla başlanıp giderek artırılır (hücum dozu uygulanmaz)?","o":["Digitalikler","Bazı analjezikler","Bazı antibiyotikler","Vitaminler","Tuz çözeltileri"],"a":0,"e":"Digitalikler, psikotrop ilaçlar ve kortikosteroidler gibi toksisitesi yüksek ilaçlar küçük dozla başlatılır."},{"q":"Kitaba göre erişkin dozu hangi kişiler için hesaplanır?","o":["40–80 kg, 18–65 yaş","60–90 kg, 20–50 yaş","70 kg, 18–70 yaş","50–70 kg, 12–60 yaş","50–100 kg, 16–60 yaş"],"a":4,"e":"Erişkin dozu 50–100 kg ve 16–60 yaş için verilir. (Bölüm 2'de ise 70 kg kişi için yetişkin dozu tanımlanır.)"},{"q":"Toksik ilaçlarda kodekste bir kezde ve 24 saatte alınabilecek en fazla miktara ne denir?","o":["Maksimal doz","Total doz","Hücum dozu","Sürdürme dozu","Letal doz"],"a":0,"e":"Eczacı maksimal dozu aşan reçeteyi geri çevirebilir."},{"q":"Uyunçsuzluk yaşlı hastalarda hangi oranda görülür?","o":["%5–10","%10–20","%40–75","%80–95","%20–30"],"a":2,"e":"Yaşlılarda %40–75."},{"q":"Bir ilacın tekrarlanan verilişlerinden sonra birkaç dakika gibi kısa sürede gelişen akut toleransa ne ad verilir?","o":["Çapraz tolerans","Taşifilaksi","Akiz tolerans","Çapraz bağımlılık","İdiyosenkrazi"],"a":1,"e":"Taşifilaksi tanımı."},{"q":"Alkoliklerin SSS depresanlarına tolerans göstermesi neye örnektir?","o":["Taşifilaksi","Çapraz bağımlılık","Fizyolojik antagonizma","Çapraz tolerans","Potansiyalizasyon"],"a":3,"e":"Benzer yapılı ilaç grubuna tolerans: çapraz tolerans."},{"q":"Morfin bağımlılarının tedavisinde metadon kullanılması hangi kavrama dayanır?","o":["Taşifilaksi","Çapraz bağımlılık","Kimyasal antagonizma","Akiz tolerans","Sinerjizma"],"a":1,"e":"A maddesine bağımlının gereksinimi farklı yapıdaki B ile gideriliyorsa çapraz bağımlılıktır."},{"q":"Kitaba göre ilaç/madde bağımlılığı tedavisinde başarı oranı yaklaşık kaçtır?","o":["%50","%5","%20","%70","%90"],"a":2,"e":"Başarı oranı düşüktür (%20)."},{"q":"Opioid bağımlılığında antagonist tedavide kullanılan ilaçlar hangileridir?","o":["Metadon ve morfin","Disülfiram ve akamprosat","Atropin ve fizostigmin","Diazepam ve fenobarbital","Nalokson ve naltrekson"],"a":4,"e":"Yerine koyma: metadon; antagonist: nalokson, naltrekson."},{"q":"Tip I alerjik reaksiyon ne kadar sürede başlar?","o":["6 saat","36 saat","7–14 gün","0–30 dakika","24 saat"],"a":3,"e":"Tip I 0–30 dk, Tip II 6 saat, Tip III 36 saatte pik."},{"q":"İlaç alerjisi ile ilgili aşağıdakilerden hangisi YANLIŞTIR?","o":["Reaksiyonun şiddeti verilen dozla doğrudan ilişkilidir","Çok küçük dozlarda da gelişebilir","İmmünolojik bir tepkidir","Toplumun %10–15'inde kalıtsal yatkınlık vardır","KC ve böbrek lezyonları insidansı artırabilir"],"a":0,"e":"Alerji şiddeti ve sıklığı dozla doğrudan ilişkili değildir."},{"q":"İlaç alerjisinde ilk maruziyetten sonra antikorlar ne kadar sürede oluşur?","o":["1–2 hafta","1–2 saat","1–2 gün","1–2 ay","6 ay"],"a":0,"e":"Maruziyetten sonra 1–2 hafta içinde antikor oluşur."},{"q":"Hafif anafilaktik tabloda aşağıdakilerden hangisi beklenmez?","o":["Ürtiker","Bradikardi ve hipertansiyon","Anjiyoödem","Bronkospazm","Epigastrik ağrı"],"a":1,"e":"Hafif tabloda ürtiker, eritem, anjiyoödem, bronkospazm ve epigastrik ağrı gelişir."},{"q":"Kronik açılı glokomlu bir hastaya göz damlası veren hemşire, sistemik yan etkiyi azaltmak için ne yapmalıdır?","o":["Damlayı kornea ortasına damlatmak","Hastayı yüzüstü yatırmak","Damlayı iki kat dozda vermek","Damla sonrası gözün iç köşesine bastırmak","Damlayı ağızdan vermek"],"a":3,"e":"Nazolakrimal kanal uçları kapatılır."},{"q":"Yağlı enjeksiyonluk solüsyonlar hangi yolla verilmez?","o":["İntramüsküler","Lokal","İntraartiküler","Topikal","İntravenöz"],"a":4,"e":"Kitap: yağlı olanlar deri altına ya da intravenöz olarak enjekte edilmez."}]});

</script><script>
U.push({"id":"u2","no":2,"title":"İlaçların Vücuttaki Yazgısı","kisa":"Emilim, ilk geçiş, proteine bağlanma, zar geçiş yolları, dağılım, metabolizma, atılım, etkiyi değiştirenler, etkileşimler","s":[{"h":"1. Emilim (absorpsiyon)","b":"\n<p>İlaç verildiği yerden lenf ve kan dolaşımına karışır. Uygulandığı bölgeden emilme oranına <b>biyoyararlanım</b> denir. Çok hızlı emilim → toksik konsantrasyon riski; çok yavaş → etkili düzeye ulaşamama. <b>Yerel etki istenirken emilim istenmez.</b></p>\n<p>Engeller: deride kalın hücre katmanları; parenteralde kapiller endotel; boşluklarda seröz/müköz epitel.</p>\n<p><b>Sindirim kanalı:</b> Kolay, güvenli, steril gerektirmediği için en sık yol.</p>\n<ul><li><b>Dilaltı:</b> venöz drenaj portal dolaşıma uğramadan v. cava superiora → ilk geçişten korunur. İnce epitel, damardan zengin, <b>nötr pH (6–7,9)</b>, lipoidik. Örnek: nitrogliserin.</li>\n<li><b>Özofagus:</b> ülser yapan ilaçlar <b>doksisiklin, tetrasiklin, potasyum klorür, demir tuzları</b> → <b>bol suyla, dik pozisyonda</b> içilmeli, öncesinde bir yudum su.</li>\n<li><b>Mide:</b> Tablet GİS'i <b>5–6 saatte</b> geçer, bunun <b>0,5–1 saati midede</b>. Aç karna pH <b>≈1,5</b>, tok <b>3,5–4</b>. Zayıf asitler iyonize olmadığından midede emilir: <b>aspirin (pKa 3,5)</b> aç karna %99 non-iyonize.</li>\n<li><b>İnce barsak:</b> oral ilaçların <b>en fazla emildiği yer</b>. 4 faktör: <b>yüzey, kan debisi, safra salgısı, transportörler</b>.</li>\n<li><b>Kolon:</b> daha yavaş/düşük; yavaş çözünen veya kolonda açılan preparatlar.</li>\n<li><b>Rektum:</b> v. hemoroidea media/superior üzerinden yaklaşık <b>yüzde elli</b> hepatik ilk geçiş; daha çok lokal etki.</li></ul>\n<p><b>Solunum yolu:</b> Geniş alveol yüzeyi. Solunan partiküllerin <b>%25'i geri çıkarılır, %50'si üst, %25'i alt</b> solunum yollarında tutulur; partikül çapı önemli.</p>\n<p><b>Deri (epidermal):</b> Emilim mukozalardan düşük/yavaş. Engel: <b>stratum korneum</b>. Yağlı taşıyıcı + ovma emilimi artırır; sıyrık/yanıkta artar.</p>\n<div class=\"tip\">Deri geçirgenlik sırası: <b>skrotum > kulak arkası > koltuk altı > saçlı deri > göğüs > ön kol > bacak</b>. Plaster örnekleri: sigarayı bırakmada nikotin, anginada nitrogliserin.</div>"},{"h":"2. İlk geçiş etkisi ve enterohepatik siklus","b":"\n<ul><li>Barsaktan emilen ilaç <b>vena porta</b> ile KC'ye gelir, bir kısmı metabolize olur = <b>KC ilk geçişi</b>. Ayrıca gastrik (asit hidrolizi) ve intestinal (enzimatik/bakteriyel) ilk geçiş de vardır.</li>\n<li>İlk geçiş <b>sistemik yararlanımı azaltır ama emilim hızını etkilemez</b>.</li>\n<li>İV verilişte her geçişte kanın ancak <b>%20–30</b>'u KC dolaşımına girer.</li>\n<li>Aktif metabolite dönüşme örneği: <b>D vitamini</b> → KC'de 25-hidroksikalsiferol → böbrekte ikinci hidroksilasyonla aktif kalsiferol.</li>\n<li><b>Enterohepatik siklus:</b> Safrayla barsağa atılan ilaç barsaktan tekrar emilip dolaşıma döner → etki süresi uzar.</li>\n<li>Dilaltı ilaçlar gastrointestinal ve hepatik ilk geçişe uğramaz → emilim açısından avantajlı.</li></ul>"},{"h":"3. Plazma proteinlerine bağlanma","b":"\n<p>Protein + serbest ilaç ⇄ ilaç-protein kompleksi. <b>Bağlı ilaç</b> eliminasyondan etkilenmez → <b>depo</b> görevi görür, farmakolojik etki göstermez. Serbest ilaç azaldıkça bağlı ilaç serbestlenir.</p>\n<table><tr><th>Protein</th><th>Özellik</th></tr>\n<tr><td><b>Albumin</b></td><td>En fazla (<b>%50–60</b>); bağlanmada esas rol</td></tr>\n<tr><td><b>α1 asit glikoprotein (orosomukoid)</b></td><td>En küçük; <b>bazik</b> ilaçlar: kinidin, lidokain, propranolol</td></tr>\n<tr><td><b>Globulinler (α, β, γ)</b></td><td>Bağlama kapasitesi; temel fizyolojik roller</td></tr>\n<tr><td><b>Lipoproteinler</b></td><td>Büyük, lipid içerir; <b>klorpromazin, imipramin</b></td></tr></table>\n<p>Kanın şekilli elemanları (özellikle <b>eritrositler</b>) da ilaç bağlar.</p>"},{"h":"4. Emilimi etkileyen ilaç özellikleri ve zar geçişleri","b":"\n<ul><li>Molekül <b>küçüldükçe</b> ve <b>yağda çözünürlük arttıkça</b> emilim hızlanır (lipid/su katsayısı).</li>\n<li>Emülsiyon ve süspansiyonların emilimi çözelti halinden <b>yavaştır</b>.</li>\n<li>Verildiği yerde yoğunluk fazlaysa emilim hızlanır.</li>\n<li><b>Damar daraltanlar emilimi azaltır</b>, damar genişletenler artırır.</li>\n<li>Kalp yetmezliği, hipotansiyon, şok → emilim gecikir. İnhalasyon anestezisi çok hızlı etki eder.</li></ul>\n<table><tr><th>Geçiş</th><th>Özellik</th></tr>\n<tr><td><b>Pasif difüzyon</b></td><td>Yağda çözünen, <b>iyonize olmamış</b>; yoğundan seyreğe; enerji yok</td></tr>\n<tr><td><b>Aktif transport</b></td><td><b>Enerji</b> gerekir, yoğunluk farkına <b>karşı</b>; taşıyıcı protein; doyurulabilir; yarışma; metabolik zehirle engellenir</td></tr>\n<tr><td><b>Kolaylaştırılmış difüzyon</b></td><td>Taşıyıcı var, <b>enerji yok</b>, yoğundan seyreğe</td></tr>\n<tr><td><b>Pinositoz (endositoz)</b></td><td>Büyük molekül zarla çevrilip girer; tersi <b>ekzositoz</b>; enerji gerekir</td></tr>\n<tr><td><b>Reseptör aracılı endositoz</b></td><td>Özgül reseptör (DDL); çukur iç yüzü <b>klatrin</b> kaplı</td></tr>\n<tr><td><b>Transsitoz</b></td><td>Endositoz + ekzositoz; ör. <b>insülin</b></td></tr></table>\n<p><b>Reseptör:</b> İlacı seçici bağlayıp kimyasal uyarıyı biyolojik uyarıya çeviren yapı (enerji dönüştürücü). Hücre zarı, sitoplazma ve çekirdekte bulunur. Uyarı her basamakta genellikle <b>100 kat</b> şiddetlenir.</p>"},{"h":"5. Dağılım","b":"\n<table><tr><th>Kompartman</th><th>Oran</th><th>Hacim (70 kg)</th></tr>\n<tr><td><b>Plazma</b></td><td>Kan hacminin %50'si, vücut ağırlığının <b>%4</b>'ü</td><td><b>3–3,5 L</b></td></tr>\n<tr><td><b>İnterstisyel sıvı</b> (BOS, hücreler arası sıvı)</td><td>Vücut ağırlığının <b>%13</b>'ü</td><td><b>9 L</b></td></tr>\n<tr><td><b>İntraselüler sıvı</b></td><td>Vücut ağırlığının <b>%41</b>'i</td><td><b>29 L</b></td></tr></table>\n<ul><li><b>Sekestrasyon:</b> İlacın dokuya sıkıca bağlanıp depolanması. Örnek: <b>barbitüratlar</b> yağ dokusu ve SSS'de birikir.</li>\n<li><b>Redistribüsyon (yeniden dağılım):</b> Yağda çok eriyen ilaç önce kalp-beyin-böbrek gibi kanlanan organlarda, sonra yağ dokusunda toplanır. <b>Tiyopental</b> ilk dakikada beyinde, <b>3 saatte %70'i yağ dokusunda</b> → anestezi hızlı başlar, hızlı biter.</li>\n<li><b>Plasenta:</b> Yağda eriyen, iyonize olmayan ilaçlar fötusa kolay geçer. Genel anestezik ve opioidler doğumda verilirse bebek <b>solunum depresyonuyla</b> doğabilir.</li></ul>"},{"h":"6. Metabolizma (biyotransformasyon, BT)","b":"\n<ul><li>BT ile ilaç genelde <b>etkisiz/zayıf, suda eriyen, hızla atılan</b> hale gelir. Yağda çözünenler büyük ölçüde metabolize olur; suda çözünenler çoğunlukla değişmeden idrarla atılır.</li>\n<li>Daha etkili/toksik metabolite dönüşüm = <b>biyoetkinleşme</b>. Etkisiz olup vücutta aktifleşen = <b>ön ilaç (inaktif prekürsör)</b>: beta/alfa karoten → A vitamini.</li>\n<li>Başlıca organ <b>karaciğer</b> (sitokrom P450). Ayrıca böbrek, akciğer, GİS mukozası, SSS, cilt, eritrosit, plazma.</li>\n<li><b>Faz I:</b> redüksiyon, oksidasyon, kopma. <b>Faz II:</b> bağlanma = <b>konjugasyon</b>.</li>\n<li><b>Etil alkol:</b> KC'de dehidrojenazlarla H₂O + CO₂. <b>Disülfiram</b> aldehit dehidrojenazı inhibe eder → <b>asetaldehit birikir</b> (asetaldehit sendromu) → alkolden vazgeçirmede kullanılır.</li></ul>"},{"h":"7. Atılım (itrah, eliminasyon)","b":"\n<p>Birincil organ <b>böbrek</b>. Plazma yoğunluğunun yarıya düşmesi için geçen süre = <b>yarılanma ömrü (t½)</b>.</p>\n<ul><li><b>Glomerüler filtrasyon:</b> hızlı <b>pasif difüzyon</b>; yalnız <b>serbest</b> ilaç filtre olur, proteine bağlı olan olmaz. Dakikada <b>130 ml</b>, günde <b>190 L</b>; bunun <b>%99'u geri emilir</b>, idrar ≈ <b>1,5 L</b>.</li>\n<li><b>Tübüler salgılama:</b> <b>aktif transport</b>, proksimal tübül; asidik ve bazik ilaçlar için iki ayrı sistem; aynı yüklü ilaçlar yarışır. Filtrasyondan hızlı.</li>\n<li><b>Tübüler geri emilim:</b> atılımı azaltır, genellikle pasif difüzyon.</li>\n<li><b>Renal klerens:</b> 1 dakikada ilaçtan arınan plazma miktarı.</li>\n<li><b>Safra:</b> aktif transport + pasif difüzyon; enterohepatik dolaşım etkiyi uzatır.</li>\n<li><b>Akciğer:</b> uçucu maddeler, gazlar (azot protoksit) pasif difüzyonla.</li>\n<li><b>Diğer:</b> tükürük (iyodür, amfetamin, eroin), barsak bezleri, <b>süt</b> (alkol yüksek miktarda), ter ve gözyaşı (bromür, iyodür).</li></ul>"},{"h":"8. İlaç etkisini değiştiren unsurlar","b":"\n<ul><li><b>Uygulama yeri:</b> oral, parenterale göre geç ve az emilir.</li>\n<li><b>Uygulama zamanı:</b> enzim sistemlerinin gün içi ritmi.</li>\n<li><b>Beden ağırlığı:</b> yetişkin dozu <b>70 kg</b> içindir. Şişmanlarda yağ dokusu az damarlı → dağılım homojen olmaz.</li>\n<li><b>Yaş:</b> bebek/yenidoğanda atılım sistemi gelişmemiş; yaşlıda azalmış.</li>\n<li><b>Atılım organı hastalığı:</b> BT ve itrah azalır → toksisite, doz ayarı.</li>\n<li><b>Cinsiyet:</b> kadınlar trisiklik antidepresanlara daha duyarlı.</li>\n<li><b>Kalıtım, tolerans</b> (narkotik analjezikler; alkoliklerde çapraz tolerans), diğer ilaçlar.</li>\n<li><b>Gebelik:</b> dağılım hacmi genişler. Teratojenik: benzimidazol antelmintikler (oksibendazol, albendazol), salisilatlar (aspirin), sülfonamidler (sülfadimidin), kortikosteroidler. Barbitürat ve opioidler fetüste solunum baskısı; klenbuterol ve salisilat gebeliği uzatır.</li></ul>"},{"h":"9. İlaç etkileşimleri","b":"\n<p><b>Farmakodinamik</b> etkileşim etki yerinde olur:</p>\n<table><tr><th>Tür</th><th>Tanım / örnek</th></tr>\n<tr><td><b>Kimyasal antagonizma</b></td><td>İlaçlar kimyasal reaksiyonla etkisizleşir; antidot/panzehir. <b>Dimerkaprol</b>: cıva, arsenik</td></tr>\n<tr><td><b>Fizyolojik antagonizma</b></td><td>Farklı mekanizma/reseptörle zıt etki: narkotik solunum depresyonu ↔ <b>kafein</b></td></tr>\n<tr><td><b>Farmakolojik antagonizma</b></td><td>Aynı reseptörde: <b>atropin ↔ asetilkolin</b></td></tr>\n<tr><td><b>Sumasyon (additif)</b></td><td>Etkiler cebirsel toplam: parasetamol + aspirin</td></tr>\n<tr><td><b>Potansiyalizasyon</b></td><td>Toplamdan fazla: <b>antikolinesterazlar ACh etkisini artırır</b></td></tr></table>\n<div class=\"tip\">Kitapta sumasyon örneği karışık yazılmış: \"0,5 g parasetamol + 0,5 g aspirin eşit şiddette etki\" ve \"0,25 + 0,25 g birlikte aynı derecede etki\" denmiş. Anlam: yarım dozların toplamı tam dozla aynı etkiyi verir, yan etki azalır.</div>\n<p><b>Farmakokinetik</b> etkileşim emilim, dağılım, BT ve atılımda olur. Antikolinerjikler barsak hareketini azaltıp diğer ilaçların emilimini artırır. <b>Ampisilin ve tetrasiklin doğum kontrol ilaçlarının etkisini azaltır</b> → istenmeyen gebelik.</p>\n<p><b>Farmasötik etkileşim (geçimsizlik):</b> vücut dışında; iki sıvı ilaç karışınca renk değişimi/çökelti. Aynı enjektöre çekilmemeli.</p>"},{"h":"10. Enzim inhibisyonu, taşıt sistemleri, lab testleri","b":"\n<table><tr><th>Enzim</th><th>İnhibitör → sonuç</th></tr>\n<tr><td>Asetilkolinesteraz</td><td>Fizostigmin, organik fosforlular → ACh birikir → parasempatomimetik etki</td></tr>\n<tr><td>ACE</td><td>Kaptopril, enalapril → anjiyotensin II oluşmaz → kan basıncı düşer</td></tr>\n<tr><td>Prostaglandin sentetaz (COX)</td><td>İndometasin, aspirin → ağrı kesici, ateş düşürücü, yangı giderici</td></tr>\n<tr><td>Transpeptidaz</td><td>Beta-laktamlar → peptidoglikan, hücre duvarı oluşmaz</td></tr></table>\n<ul><li><b>Kolin taşıtı:</b> hemikolinium kolin geri alımını engeller → ACh sentezi azalır.</li>\n<li><b>Na,K-ATPaz (amin pompası):</b> kokain engeller → NA sinapsta uzun kalır → dolaylı sempatomimetik.</li>\n<li><b>Mg-ATPaz (vezikül):</b> rezerpin engeller → NA MAO ile yıkılır → sempatik etki azalır.</li>\n<li><b>İyon kanalları:</b> serbest veya voltaj-bağımlı; ilaçlar doğrudan ya da G-proteini aracılığıyla etkiler.</li>\n<li><b>Lab testleri:</b> ilaç ölçüme katılabilir, tepkimeyi veya renk şiddetini değiştirebilir. Alkalen fosfataz, MAO inhibitörleri, fenotiyazinler kolesterol değerini değiştirir.</li></ul>"}],"q":[{"q":"İlacın uygulandığı bölgeden emilme oranına ne ad verilir?","o":["Klerens","Yarılanma ömrü","Dağılım hacmi","Redistribüsyon","Biyoyararlanım"],"a":4,"e":"Biyoyararlanım tanımı."},{"q":"Oral yolla alınan ilaçların en fazla emildiği bölge neresidir?","o":["Mide","İnce barsak","Kolon","Özofagus","Rektum"],"a":1,"e":"İnce barsakta yüzey, kan debisi, safra ve transportörler emilimi kolaylaştırır."},{"q":"Özofagus ülserine yol açtığı bildirilen ilaçlar arasında aşağıdakilerden hangisi yer almaz?","o":["Doksisiklin","Tetrasiklin","Nitrogliserin","Potasyum klorür","Demir tuzları"],"a":2,"e":"Nitrogliserin dilaltı kullanılır; ülser yapanlar doksisiklin, tetrasiklin, KCl, demir tuzları."},{"q":"Özofagus ülseri riski taşıyan bir tableti alan hastaya hemşirenin önerisi ne olmalıdır?","o":["Bol suyla ve dik pozisyonda yutması","Yatarak ve az suyla yutması","Tableti çiğneyip yutmadan tükürmesi","Aç karna su içmeden alması","Süt ile alması"],"a":0,"e":"Bol su, dik pozisyon, öncesinde bir yudum su."},{"q":"Oral alınan bir tablet mide-barsak yolunu yaklaşık ne kadar sürede geçer?","o":["1–2 saat","12 saat","24 saat","5–6 saat","30 dakika"],"a":3,"e":"5–6 saat; bunun 0,5–1 saati midededir."},{"q":"Midenin aç karna pH değeri yaklaşık kaçtır?","o":["3,5–4","7","1,5","6–7,9","8,5"],"a":2,"e":"Aç karna 1,5, tok karna 3,5–4."},{"q":"Aspirinin aç karna mideden iyi emilmesinin nedeni nedir?","o":["Zayıf baz olması","Zayıf asit olduğu için asidik ortamda iyonize olmaması","Suda çok iyi çözünmesi","Proteinlere bağlanmaması","Aktif transportla taşınması"],"a":1,"e":"pKa 3,5; pH 1,5'te %99 non-iyonize ve yağda çözünür."},{"q":"Dilaltı mukozanın pH değeri kitapta kaç olarak verilmiştir?","o":["1,5","3,5–4","8–9","5","6–7,9"],"a":4,"e":"Nötr pH (6–7,9)."},{"q":"Rektal yolla verilen ilaçların karaciğerden ilk geçişi için kitaptaki bilgi hangisidir?","o":["Hiç ilk geçişe uğramaz","Tamamı ilk geçişe uğrar","%10'u ilk geçişe uğrar","Yaklaşık yarısı hepatik ilk geçişe uğrar","Yalnızca bebeklerde ilk geçiş olur"],"a":3,"e":"v. hemoroidea media ve superior yoluyla yaklaşık %50 hepatik ilk geçiş."},{"q":"Solunan partiküllerin ne kadarı alt solunum yollarına taşınır?","o":["%25","%50","%75","%10","%5"],"a":0,"e":"%25 geri çıkarılır, %50 üst, %25 alt solunum yollarında."},{"q":"Deriden ilaç emilimini engelleyen temel tabaka hangisidir?","o":["Dermis","Hipodermis","Bazal tabaka","Stratum korneum","Kıl folikülü"],"a":3,"e":"Stratum korneum ilacın sistemik dolaşıma geçişini engeller."},{"q":"Deri geçirgenliği en yüksek bölge hangisidir?","o":["Bacak","Ön kol","Skrotum","Göğüs","Saçlı deri"],"a":2,"e":"Skrotum > kulak arkası > koltuk altı > saçlı deri > göğüs > ön kol > bacak."},{"q":"Aşağıdaki deri bölgelerinden hangisinin geçirgenliği en düşüktür?","o":["Koltuk altı","Kulak arkası","Saçlı deri","Skrotum","Bacak"],"a":4,"e":"Sıralamanın sonunda bacak vardır."},{"q":"İlk geçiş etkisi için aşağıdakilerden hangisi doğrudur?","o":["Sistemik yararlanımı azaltır, emilim hızını etkilemez","Emilim hızını artırır","Yalnızca dilaltı uygulamada görülür","İlacın atılımını hızlandırır","Plazma proteinlerine bağlanmayı artırır"],"a":0,"e":"İlk geçiş sistemik ilaç yararlanımını azaltır fakat absorpsiyon hızını etkilemez."},{"q":"Safra ile barsağa atılan ilacın barsaktan tekrar emilerek dolaşıma dönmesine ne ad verilir?","o":["İlk geçiş etkisi","Enterohepatik siklus","Redistribüsyon","Sekestrasyon","Transsitoz"],"a":1,"e":"Enterohepatik siklus etki süresini uzatır."},{"q":"D vitamininin aktif kalsiferole dönüşümünde sırasıyla hangi organlar rol oynar?","o":["Önce karaciğer, sonra böbrek","Önce böbrek, sonra karaciğer","Önce deri, sonra akciğer","Önce barsak, sonra dalak","Yalnızca karaciğer"],"a":0,"e":"KC'de 25-hidroksikalsiferol, böbrekte ikinci hidroksilasyon."},{"q":"İntravenöz verilişte her geçişte kanın ne kadarı karaciğer dolaşımına girer?","o":["%50","%20–30","%80","%5","%99"],"a":1,"e":"Kitapta %20–30."},{"q":"Plazma proteinlerine bağlı ilaç için aşağıdakilerden hangisi doğrudur?","o":["Glomerüllerden filtre edilir","Hızla metabolize olur","En aktif ilaç formudur","Depo görevi görür, farmakolojik etki göstermez","Hücre içine kolayca girer"],"a":3,"e":"Bağlı ilaç eliminasyondan etkilenmez, depodur."},{"q":"Plazma proteinlerinin en büyük fraksiyonunu oluşturan ve ilaç bağlanmasında esas rolü oynayan protein hangisidir?","o":["α1 asit glikoprotein","Gama globulin","Lipoprotein","Fibrinojen","Albumin"],"a":4,"e":"Albumin %50–60."},{"q":"Kinidin, lidokain ve propranolol gibi bazik ilaçlar hangi proteine bağlanır?","o":["Albumin","Lipoproteinler","α1 asit glikoprotein (orosomukoid)","Transferrin","Hemoglobin"],"a":2,"e":"α1 asit glikoprotein en küçük plazma proteinidir."},{"q":"Klorpromazin ve imipramin hangi plazma proteinine bağlanır?","o":["Albumin","α1 asit glikoprotein","Globulin","Lipoproteinler","Eritrosit zarı"],"a":3,"e":"Lipoproteinler."},{"q":"Enerji gerektiren, yoğunluk farkına karşı çalışan, doyurulabilen geçiş mekanizması hangisidir?","o":["Pasif difüzyon","Kolaylaştırılmış difüzyon","Glomerüler filtrasyon","Basit geçiş","Aktif transport"],"a":4,"e":"Aktif transport özellikleri."},{"q":"Taşıyıcı kullanan ancak enerji gerektirmeyen, yoğundan seyreğe olan geçiş hangisidir?","o":["Aktif transport","Kolaylaştırılmış difüzyon","Pinositoz","Ekzositoz","Reseptör aracılı endositoz"],"a":1,"e":"Kolaylaştırılmış difüzyon."},{"q":"Pasif difüzyonla zar geçişi için ilacın hangi özelliği taşıması gerekir?","o":["Suda çözünür ve iyonize olması","Büyük molekül ağırlıklı olması","Yağda çözünür ve iyonize olmamış olması","Proteine bağlı olması","Taşıyıcıya bağlanması"],"a":2,"e":"Pasif difüzyon: yağda kolay çözünme, non-iyonize."},{"q":"Reseptör aracılı endositozda çukurların iç yüzünü kaplayan protein hangisidir?","o":["Klatrin","Albumin","Aktin","Keratin","Kolajen"],"a":0,"e":"Klatrin isimli elektron yoğun protein."},{"q":"İnsülin gibi peptid hormonların reseptörlerle zarı geçmesi; endositoza ekzositozun eşlik ettiği olay hangisidir?","o":["Pinositoz","Fagositoz","Pasif difüzyon","Transsitoz","Filtrasyon"],"a":3,"e":"Transsitoz."},{"q":"Kitaba göre reseptörlerde uyarı her basamakta genellikle kaç kat şiddetlenir?","o":["100 kat","10 kat","2 kat","1000 kat","5 kat"],"a":0,"e":"Uyarı her basamakta genellikle 100 kat artırılır."},{"q":"70 kg erişkinde plazma hacmi yaklaşık ne kadardır?","o":["9 L","29 L","3–3,5 L","15 L","1 L"],"a":2,"e":"Plazma vücut ağırlığının %4'ü, 3–3,5 L."},{"q":"İntraselüler sıvı kompartmanı vücut ağırlığının ne kadarını oluşturur?","o":["%13","%41","%4","%60","%20"],"a":1,"e":"%41, 29 L."},{"q":"Beyin omurilik sıvısını da içeren, vücut ağırlığının %13'ünü oluşturan kompartman hangisidir?","o":["Plazma","İntraselüler sıvı","Lenf","Transselüler sıvı","İnterstisyel sıvı"],"a":4,"e":"İnterstisyel sıvı 9 L."},{"q":"İlaçların dokuya sıkıca bağlanıp depolanmasına ne ad verilir?","o":["Redistribüsyon","Konjugasyon","Sekestrasyon","Biyoetkinleşme","Taşifilaksi"],"a":2,"e":"Sekestrasyon; ör. barbitüratlar yağ dokusunda."},{"q":"Tiyopental anestezisinin hızlı başlayıp hızlı bitmesinin nedeni nedir?","o":["Redistribüsyon","Enterohepatik siklus","Hızlı böbrek atılımı","Proteine yüksek bağlanma","İlk geçiş etkisi"],"a":0,"e":"Önce beyinde toplanır, 3 saatte %70'i yağ dokusuna geçer."},{"q":"Doğum eyleminde gebeye opioid analjezik verilmesinin bebekte yapabileceği en önemli sorun nedir?","o":["Hipertansiyon","Solunum depresyonu","Taşikardi","Hiperglisemi","Ateş"],"a":1,"e":"Lipofilik SSS depresanları plasentayı aşar; bebek solunum depresyonuyla doğabilir."},{"q":"Etkisiz olup vücutta etkili hale gelen moleküle ne ad verilir?","o":["Metabolit","Antidot","Jenerik","Hapten","Ön ilaç (inaktif prekürsör)"],"a":4,"e":"Örnek: karotenler → A vitamini."},{"q":"Biyotransformasyonun faz II reaksiyonlarına ne ad verilir?","o":["Oksidasyon","Redüksiyon","Hidroliz","Konjugasyon","Kopma"],"a":3,"e":"Faz II: ilaç veya metabolitin bir maddeye bağlanması = konjugasyon."},{"q":"Disülfiramın alkol bağımlılığında kullanılma mekanizması nedir?","o":["Alkolün emilimini engellemesi","Aldehit dehidrojenazı inhibe edip asetaldehit biriktirmesi","Alkol dehidrojenazı uyarması","Alkolün böbrekten atılımını artırması","Beyinde opioid reseptörünü bloke etmesi"],"a":1,"e":"Asetaldehit toksik; asetaldehit sendromu oluşur."},{"q":"İlaçların atılımında birincil organ hangisidir?","o":["Karaciğer","Akciğer","Barsak","Böbrek","Deri"],"a":3,"e":"Birincil organ böbreklerdir."},{"q":"Glomerüler filtrasyon için aşağıdakilerden hangisi YANLIŞTIR?","o":["Proteine bağlı ilaçlar filtre edilir","Pasif difüzyondur","Dakikada yaklaşık 130 ml filtre olur","Günde yaklaşık 190 L filtre olur","Filtre olan sıvının %99'u geri emilir"],"a":0,"e":"Proteine bağlı ilaç molekülleri glomerüler filtrasyona tabi olmaz."},{"q":"Proksimal tübülde gerçekleşen, aktif transportla olan atılım mekanizması hangisidir?","o":["Glomerüler filtrasyon","Tübüler geri emilim","Tübüler salgılama","Pasif difüzyon","Enterohepatik dolaşım"],"a":2,"e":"Tübüler salgılama aktif transporttur."},{"q":"Bir dakikada ilaçtan arınan plazma miktarına ne denir?","o":["Yarılanma ömrü","Biyoyararlanım","Dağılım hacmi","Glomerüler filtrasyon hızı","Renal klerens"],"a":4,"e":"Renal klerens."},{"q":"Plazmadaki ilaç yoğunluğunun yarıya inmesi için geçen süreye ne ad verilir?","o":["Klerens","Yarılanma ömrü (t½)","Latent dönem","Etki süresi","Emilim süresi"],"a":1,"e":"Yarılanma ömrü."},{"q":"Genel anestezide kullanılan azot protoksit esas olarak hangi yolla atılır?","o":["Böbrek","Safra","Akciğer","Ter","Süt"],"a":2,"e":"Uçucu maddeler ve gazlar akciğerlerden pasif difüzyonla atılır."},{"q":"Tükürük bezleri yoluyla atıldığı belirtilen maddeler hangileridir?","o":["İyodür, amfetamin, eroin","Bromür, iyodür","Penisilin, aspirin","Alkol, nikotin","Digoksin, morfin"],"a":0,"e":"Ter ve gözyaşı: bromür ve iyodür; tükürük: iyodür, amfetamin, eroin."},{"q":"Kitaba göre ilaçların yetişkin dozu kaç kg'lık bir insan için hesaplanmıştır? (Bölüm 2)","o":["50 kg","60 kg","80 kg","100 kg","70 kg"],"a":4,"e":"Bölüm 2: yetişkin dozu 70 kg insana uygulanacak miktardır."},{"q":"Trisiklik antidepresanlara daha duyarlı olan grup hangisidir?","o":["Erkekler","Yaşlı erkekler","Sporcular","Kadınlar","Çocuklar"],"a":3,"e":"Kitap: dişiler trisiklik antidepresanlara daha duyarlıdır."},{"q":"Gebelikte teratojenik etki gösterdiği belirtilen ilaç grubu hangisidir?","o":["Penisilinler","Benzimidazol antelmintikler","Demir preparatları","Folik asit","B vitaminleri"],"a":1,"e":"Benzimidazoller (oksibendazol, albendazol), salisilatlar, sülfonamidler (sülfadimidin), kortikosteroidler."},{"q":"Cıva ve arsenik zehirlenmesinde dimerkaprol kullanılması hangi etkileşime örnektir?","o":["Fizyolojik antagonizma","Farmakolojik antagonizma","Kimyasal antagonizma","Potansiyalizasyon","Sumasyon"],"a":2,"e":"Kimyasal reaksiyonla suda eriyen yapı oluşturup atılımını sağlar."},{"q":"Narkotik analjeziklerin solunum depresyonunun kafeinle giderilmesi hangi etkileşimdir?","o":["Fizyolojik antagonizma","Kimyasal antagonizma","Farmakolojik antagonizma","Sumasyon","Geçimsizlik"],"a":0,"e":"Farklı mekanizmayla zıt yönde etki."},{"q":"Atropin ile asetilkolin arasındaki etkileşim hangi tür antagonizmadır?","o":["Fizyolojik antagonizma","Kimyasal antagonizma","Potansiyalizasyon","Farmakolojik antagonizma","Farmasötik etkileşim"],"a":3,"e":"Aynı reseptöre etki eden iki ilaç arasındaki antagonizma."},{"q":"Antikolinesterazların asetilkolin etkisini artırması hangi etkileşim türüdür?","o":["Sumasyon","Antagonizma","Geçimsizlik","Tolerans","Potansiyalizasyon"],"a":4,"e":"Etki toplamdan fazladır."},{"q":"Ampisilin veya tetrasiklin kullanan bir kadının doğum kontrol hapı kullanması ile ilgili hangi uyarı yapılmalıdır?","o":["Doğum kontrol hapının etkisi artar","Antibiyotiğin etkisi kaybolur","Hiçbir etkileşim yoktur","Doğum kontrol hapının etkisi azalabilir, istenmeyen gebelik olabilir","Kanama riski artar"],"a":3,"e":"Farmakokinetik etkileşim örneği."},{"q":"İki sıvı ilacın aynı enjektörde karıştırılınca çökelti oluşturması hangi etkileşimdir?","o":["Farmakodinamik etkileşim","Farmakokinetik etkileşim","Farmasötik etkileşim (geçimsizlik)","Fizyolojik antagonizma","Potansiyalizasyon"],"a":2,"e":"Vücut dışında olan etkileşim = geçimsizlik."},{"q":"Kaptopril ve enalapril hangi enzimi inhibe eder?","o":["Asetilkolinesteraz","Siklooksijenaz","Transpeptidaz","Monoamin oksidaz","Anjiyotensin dönüştürücü enzim"],"a":4,"e":"ACE inhibisyonu ile anjiyotensin II oluşumu engellenir."},{"q":"Kokainin sempatomimetik etkisi hangi mekanizmayla oluşur?","o":["Mg-ATPaz pompasını engellemesi","Na,K-ATPaz amin pompasını engelleyerek NA'nın sinapsta uzun kalmasını sağlaması","Kolin geri alımını engellemesi","MAO'yu uyarması","ACh salınımını artırması"],"a":1,"e":"Kokain amin pompasını engeller; dolaylı sempatomimetik."},{"q":"Rezerpinin sempatik etkiyi azaltma mekanizması nedir?","o":["Veziküllerdeki Mg-ATPaz pompasını engelleyip NA'nın MAO ile yıkılmasına yol açması","NA geri alımını engellemesi","Beta reseptörlerini uyarması","Kolin taşıtını engellemesi","ACE inhibisyonu"],"a":0,"e":"NA korumasız kalır, MAO ile etkisizleşir."},{"q":"Hemikolinium hangi taşıtı engeller?","o":["Kolin taşıtı","Amin pompası (Na,K-ATPaz)","Mg-ATPaz","Kalsiyum kanalı","Glukoz taşıyıcısı"],"a":0,"e":"Kolin geri alımı engellenir, ACh sentezi azalır."}]});

</script><script>
U.push({"id":"u3","no":3,"title":"İlaç Toksikasyonu","kisa":"Toksisite türleri, ilaç-ilaç ve besin-ilaç etkileşmeleri, alerji mekanizması, genetik toksisite, kümülasyon, tolerans, taşifilaksi","s":[{"h":"1. Giriş ve toksisite türleri","b":"\n<p>İlaç ile zehir arasındaki ayrım <b>dozdur</b>; bütün ilaçların toksik dozu vardır.</p>\n<table><tr><th>Tür</th><th>Özellik</th></tr>\n<tr><td><b>Fonksiyonel etki</b></td><td>Farmakolojik etkiyle ilgili, <b>dönüşümlü</b>; ilaç bırakılınca kaybolur. Antihistaminikle ciddi sedasyon</td></tr>\n<tr><td><b>Biyokimyasal toksisite</b></td><td>Kimyasal yöntemlerle saptanır; asit-baz dengesi ve enzim sistemlerinde; dönüşümlü</td></tr>\n<tr><td><b>Yapısal toksisite</b></td><td>Doku/hücre/organ yapısı değişir. <b>Kloroform anestezisinde KC yağlanması</b></td></tr></table>\n<p>Tedavi dozunda oluşan, istenmeyen ama öngörülen etkiler = <b>yan etki</b>; çoğu doz-cevap ilişkilidir.</p>"},{"h":"2. İlaçlar arası etkileşmeler","b":"\n<p><b>İn vitro etkileşme:</b> Uygulamadan önce bir ilaç diğerini değiştirir → biyoyararlılık değişir. <b>İV aminoasit çözeltilerine hiçbir ilaç eklenmemelidir</b> (aside dayanıksız ilaçları denatüre eder, penisilinle alerjik konjugat yapar).</p>\n<p>Üç şekilde etkileşirler: bağımsız etki; <b>sinerjik etki</b> (additif / sinerjizma / potansiyalizasyon); <b>antagonizma</b> (barbitürat depresyonunu amfetamin, muskarinin kolinerjik etkisini <b>atropin</b> kaldırır).</p>\n<p><b>Barsakta:</b> salisilik asit gibi asit ilacın emilimi alkali ilaçla azalır. <b>Metoklopramid</b> mide boşalmasını uyarır → parasetamol ve alkolün emilimini hızlandırır.</p>"},{"h":"3. Enzim indüksiyonu ve inhibisyonu","b":"\n<ul><li><b>İndüksiyon:</b> Pestisitler, alkol, sigara ve birçok ilaç enzim indükleyicidir → diğer ilacın metabolizması hızlanır, <b>etkinlik düşer</b>.\n<ul><li>Sigaranın etkisi <b>3,4-benzopiren</b>den; propoksifen ve benzodiazepinlerin etkisini azaltır.</li>\n<li>Alkoliklerde <b>fenitoin</b> kan düzeyi daha hızlı düşer → antikonvülzan etki süresi kısalır.</li></ul></li>\n<li><b>İnhibisyon:</b> Bir ilaç diğerinin BT'sini yavaşlatır → tehlike. Örnek: <b>ouabain</b> toksisitesinin katekolamin salıverilmesiyle artması.</li></ul>"},{"h":"4. Plazma, reseptör ve atılımda etkileşmeler","b":"\n<ul><li><b>Varfarin:</b> %98'i albumine bağlı, %2'si serbest. Klofibrat/fenilbutazon albumin için yarışınca serbest kısım <b>%4</b>'e çıkar → aktif düzey <b>iki katına</b> → öldürücü kanama.</li>\n<li><b>Yarışmalı antagonizma:</b> aynı reseptör; histamin ↔ antihistaminik.</li>\n<li><b>Fizyolojik antagonizma:</b> guanetidinin hipotansif etkisini trisiklik antidepresanlar (imipramin) bozar → yüksek kan basıncı.</li>\n<li><b>Potansiyalizasyon:</b> kalp glikozitlerinin etkisi <b>tiazid diüretiklerle</b> artar → digitalis zehirlenmesi.</li>\n<li><b>Atılımda:</b> Zayıf bazlar (morfin, antihistaminik) <b>düşük idrar pH</b>'sında hızlı atılır. Zayıf asitler (streptomisin, salisilik asit) <b>yüksek pH</b>'da hızlı atılır.</li>\n<li>Asidik ilaçlar aktif sekresyon için yarışır: penisilinin yarı ömrünü <b>probenesid</b>, aspirin, fenilbutazon uzatır.</li></ul>"},{"h":"5. Besin-ilaç etkileşmeleri","b":"\n<table><tr><th>İlaç</th><th>Etkileşen besin</th></tr>\n<tr><td>Aminofilin</td><td>Vit. B kompleksi</td></tr>\n<tr><td>Antikoagülanlar</td><td>Balık/balık yağı, Vit. C ve K, şarap</td></tr>\n<tr><td>Katekolaminler</td><td>Riboflavin, Vit. B kompleksi</td></tr>\n<tr><td>Klortetrasiklin</td><td>Süt ve süt ürünleri</td></tr>\n<tr><td>Tetrasiklinler</td><td>Vit. B kompleksi, süt ve süt ürünleri</td></tr>\n<tr><td>Kloramfenikol</td><td>Vit. B kompleksi, riboflavin</td></tr>\n<tr><td>Eritromisin (oral)</td><td>Limon, portakal gibi asitli içecekler</td></tr>\n<tr><td>Griseofulvin</td><td>Yağlı besinler</td></tr>\n<tr><td>L-dopa</td><td>Bakla, Vit. B kompleksi</td></tr>\n<tr><td>MAOİ'ler</td><td>Alkol, maya, yoğurt, çay, süt ürünleri, kola</td></tr>\n<tr><td>Reserpin</td><td>Vit. B kompleksi</td></tr></table>"},{"h":"6. Kimyasalların beklenen ve beklenmeyen etkileri","b":"\n<ul><li><b>Ksenobiyotikler:</b> su, hava, besin kirleticileri, endüstriyel ve ev kimyasalları. Normal toksik etki doz-cevap ilişkisi gösterir. Alkol depresyonunun barbitüratla potansiyalize olması bu gruptadır.</li>\n<li><b>Beklenmeyen etkiler:</b> bireysel duyarlılığa bağlı; <b>immün sistem</b> rol oynar.</li>\n<li><b>Hipersensitivite:</b> Az kişide; beklenen etki ama <b>normal dozdan küçük dozda</b>. Astımlıların ozonun bronkokonstriktör etkisine duyarlılığı.</li>\n<li><b>Alerji:</b> İmmünolojik. Proteinle birleşip antijen oluşturan kimyasal = <b>hapten</b>. İlk temasta hasar yok ama duyarlılık oluşur; ikinci temasta antijen-antikor reaksiyonu hücre hasarı yapar.</li>\n<li>Penisilinin alerjik özelliği <b>penisilinik asit</b>e bağlıdır → penisilin bir <b>\"prohapten\"</b>dir. Penisiloil-protein konjugatı kuvvetli antijendir.</li>\n<li><b>Çapraz alerji:</b> aktif grubu aynı, yapısı farklı maddeler arasında.</li></ul>"},{"h":"7. Alerjik reaksiyon tabloları","b":"\n<table><tr><th>Tablo</th><th>Neden olanlar</th></tr>\n<tr><td>Kontakt dermatit</td><td>Lokal anestezikler, penisilin</td></tr>\n<tr><td>Kurdeşen</td><td>Polen ekstraktı, penisilin, salisilatlar</td></tr>\n<tr><td>Egzantem</td><td>Arsenikliler, sülfonamidler, barbitüratlar</td></tr>\n<tr><td>Deride pul pul dökülme</td><td>Barbitüratlar, arsenikliler</td></tr>\n<tr><td>Bül</td><td>İyodürler, arsenikliler</td></tr>\n<tr><td>Multiform eritem</td><td>Sülfonamidler, salisilatlar</td></tr>\n<tr><td>Ciltte kızartı</td><td>Barbitüratlar</td></tr>\n<tr><td>Granülositopeni</td><td>Arsenik, fenilbutazon</td></tr>\n<tr><td>Trombositopeni</td><td>Kinin, arsenikliler, sülfonamidler</td></tr>\n<tr><td>Aplastik anemi</td><td>Fenilbutazon, <b>kloramfenikol</b>, sülfonamidler</td></tr>\n<tr><td>Serum hastalığı</td><td>Serumlar, streptomisin, penisilin, sülfonamidler</td></tr>\n<tr><td>Anafilaktik şok</td><td>Lokal anestezikler, polen, penisilin, serumlar, aşılar</td></tr>\n<tr><td>Astım</td><td>Salisilatlar, polen, serumlar</td></tr>\n<tr><td>Organ hasarı (periarterit, hepatit)</td><td>Altın tuzları, serumlar, sülfonamidler</td></tr></table>\n<p><b>Alerjik reaksiyon çeşitleri:</b> Anafilaktik (ürtiker, astım, besin alerjisi); sitotoksik/sitolitik (hemoliz, lökosit lizisi); <b>Arthus</b> (SC enjeksiyondan sonra lokal ödem/nekroz, serum hastalığı); <b>gecikmiş (tüberkülin) tip</b>: modifiye hücrelere bağlı, <b>dolaşımda antikor gerekmez</b>.</p>\n<p><b>Alerjinin toksisiteden farkı:</b> uzun süre tolere edildikten sonra duyarlılık; ilk maruziyette görülmez (antikor için <b>7–14 gün</b>); aynı madde farklı kişide farklı tablo; kalıtsal yatkınlık = <b>atopi</b>; <b>eozinofil</b> artışı tanıya yardım eder.</p>\n<p><b>Fotosensitivite:</b> <i>Fototoksik</i> tipte madde ışığı emip hücre hasarı yapar: sülfonamidler, kömür katranı türevleri (piridin, antrasen). <i>Fotoalerjik</i> tip hapten mekanizmalıdır: tiyazidler, klorpropamid, prometazin.</p>"},{"h":"8. Genetik nedenlere bağlı toksisite","b":"\n<p><b>İdiyosenkrazi:</b> Bireyin kimyasala diğerlerinden farklı yanıt vermesi; yüksek doza direnç veya düşük doza duyarlılık.</p>\n<p>İnsanda 23 çift kromozom vardır: 22 çift otozomal, 1 çift cinsiyet kromozomu (kadın XX, erkek XY). Aynı alel çifti = <b>homozigot</b> (AA baskın, aa çekinik); farklı = <b>heterozigot</b> (Aa).</p>\n<ul><li><b>Süksinilkolin duyarlılığı:</b> Kas gevşetici normalde KC ve plazmadaki <b>psödokolinesteraz</b> ile dakikalar içinde yıkılır. Defektte kas felci uzar. Toplumda <b>%2</b>; <b>otozomal çekinik</b>.</li>\n<li><b>Kalıtsal methemoglobinemi:</b> Sağlıklıda Hb'nin <b>%1</b>'i MetHb. Önemli enzim <b>NADPH-MetHb redüktaz</b>; eksikliği otozomal çekinik; doğuştan siyanoz. Sodyum nitrit sonrası normal kişide MetHb <b>6 saatte</b> normale iner, defektlide yüksek kalır.</li>\n<li><b>İlaca duyarlı hemoglobin:</b> sülfonamidler hemolitik anemi yapar.</li>\n<li><b>Primakin ve favizm duyarlılığı:</b> Sağlıklıda <b>30 mg/gün</b> sorunsuz. Siyah erkeklerin <b>%5–10</b>'unda akut hemolitik anemi, hemoglobinüri, sarılık. <b>X kromozomuna bağlı</b>.</li>\n<li><b>Hepatik porfiria:</b> Barbitürat, sülfonamid, hekzaklorobenzen ile tetiklenir. İdrarda <b>PBG ve ALA</b>; nevrit, karın ağrısı, ışığa duyarlılık. <b>ALA-sentetaz</b>ın anormal uyarılması.</li>\n<li><b>Rezistans:</b> Bazı tavşanlarda yüksek <b>atropinaz</b> atropinden korur.</li></ul>"},{"h":"9. Sürekli alımla toksikasyon, tolerans, taşifilaksi","b":"\n<ul><li>Atılımı yavaş bir kimyasal sık alınırsa birikir (<b>kümülasyon</b>). Yağda çözünenler yağ dokusunda zararsız depolanır, yağ eriyince serbestlenir: <b>DDT</b>. <b>Digitoksin</b> plazma proteinine kuvvetli bağlanır, yavaş atılır.</li>\n<li><b>Tolerans:</b> Morfinin normal dozu <b>10–15 mg</b>; sürekli kullanımda <b>20–40 katı</b> gerekebilir. Arsenik toleransı barsak emiliminin azalmasıyla açıklanır. Alkoliklerde alkolün atılımı hızlanır.</li>\n<li><b>Çapraz tolerans:</b> morfin kullananda <b>metadon ve meperidine</b> de tolerans gelişir.</li>\n<li><b>Taşifilaksi:</b> Barut fabrikalarındaki nitrogliserin işçilerinde baş ağrısı ve bulantıya birkaç günde alışılır. Hafta sonu kaybolur, pazartesi tekrar başlar: <b>\"pazartesi sendromu\"</b>. Sodyum nitrit hariç nitrat ve nitritler arasında çapraz tolerans vardır.</li></ul>"}],"q":[{"q":"Kitaba göre ilaç ile zehir arasındaki ayrımı belirleyen temel unsur nedir?","o":["Doz","Kaynak","Uygulama yolu","Kimyasal yapı","Fiyat"],"a":0,"e":"İlaçla zehir arasındaki ayrım alınan dozla belirlenir."},{"q":"Antihistaminik kullanırken görülen ve ilaç bırakılınca kaybolan ciddi sedasyon hangi toksisite türüdür?","o":["Yapısal toksisite","Biyokimyasal toksisite","Fonksiyonel etki","İdiyosenkrazi","Kümülasyon"],"a":2,"e":"Fonksiyonel etki dönüşümlüdür."},{"q":"Kloroform anestezisi sonrası karaciğer yağlanması hangi toksisiteye örnektir?","o":["Fonksiyonel etki","Biyokimyasal toksisite","Taşifilaksi","Hipersensitivite","Yapısal toksisite"],"a":4,"e":"Doku/organ yapısında değişiklik olur."},{"q":"İntravenöz infüzyonda kullanılan aminoasit çözeltileri için doğru ifade hangisidir?","o":["Antibiyotik eklenebilir","Hiçbir ilaç eklenmemelidir","Yalnızca penisilin eklenebilir","Her ilaç eklenebilir","Vitaminler eklenmelidir"],"a":1,"e":"Aside dayanıksız ilaçları denatüre eder, penisilinle alerjik konjugat oluşturabilir."},{"q":"Muskarinin kolinerjik etkisinin atropinle ortadan kaldırılması hangi etkileşimdir?","o":["Sinerjizma","Sumasyon","Potansiyalizasyon","Antagonizma","İndüksiyon"],"a":3,"e":"Bir ilacın etkisinin diğerince yok edilmesi."},{"q":"Mide boşalmasını uyararak parasetamol ve alkolün emilimini hızlandıran ilaç hangisidir?","o":["Metoklopramid","Atropin","Morfin","Antiasit","Fenitoin"],"a":0,"e":"Barsaktaki etkileşmeler örneği."},{"q":"Sigaranın enzim indükleyici etkisi yapısındaki hangi maddeden kaynaklanır?","o":["Nikotin","3,4-benzopiren","Karbon monoksit","Katran","Asetaldehit"],"a":1,"e":"Mikrozomal enzim etkinleştiricisi 3,4-benzopiren."},{"q":"Enzim indüksiyonunun diğer ilaç üzerindeki genel etkisi nedir?","o":["Metabolizmayı yavaşlatıp etkinliği artırır","Emilimi artırır","Proteine bağlanmayı artırır","Metabolizmayı hızlandırıp etkinliği düşürür","Atılımı durdurur"],"a":3,"e":"Metabolizma hızı artar, etkinlik düşer."},{"q":"Alkoliklerde hangi antikonvülzan ilacın kan konsantrasyonu daha hızlı düşer?","o":["Diazepam","Valproat","Fenitoin","Karbamazepin","Fenobarbital"],"a":2,"e":"Alkol KC mikrozomal enzimlerini uyarır."},{"q":"Varfarin ile ilgili kitaptaki bilgilere göre aşağıdakilerden hangisi doğrudur?","o":["%50'si albumine bağlıdır","Proteinlere hiç bağlanmaz","Serbest kısmın artması etkisini azaltır","Fenilbutazon varfarin etkisini azaltır","%98'i albumine bağlıdır, serbest kısım %2'den %4'e çıkarsa aktif düzey iki katına çıkar"],"a":4,"e":"Klofibrat ve fenilbutazon varfarinin etkisini potansiyalize eder; öldürücü kanama riski."},{"q":"Kalp glikozitlerinin etkisini artırarak digitalis zehirlenmesine yol açabilen ilaç grubu hangisidir?","o":["Antihistaminikler","Penisilinler","Antiasitler","Beta-2 agonistler","Tiazid diüretikler"],"a":4,"e":"Tiazidler kalp glikozitlerini potansiyalize eder."},{"q":"Guanetidin ile hipertansiyon tedavisi gören hastaya imipramin verilirse ne olur?","o":["Kan basıncı daha çok düşer","Kan basıncı yükselir","Bradikardi gelişir","Hipoglisemi gelişir","Etkileşim olmaz"],"a":1,"e":"Trisiklik antidepresanlar guanetidinin adrenerjik sinir ucunda birikmesini önler; fizyolojik antagonizma."},{"q":"Morfin gibi zayıf bazların atılımı hangi koşulda hızlanır?","o":["Yüksek idrar pH'sında","Nötr idrar pH'sında","Düşük idrar pH'sında","Sıvı kısıtlamasında","Yüksek proteinli diyette"],"a":2,"e":"Zayıf bazlar düşük, zayıf asitler yüksek idrar pH'sında hızlı atılır."},{"q":"Salisilik asit gibi zayıf asitlerin atılımı hangi durumda hızlanır?","o":["Yüksek idrar pH'sında","Düşük idrar pH'sında","Asidik diyetle","Probenesid verilince","Böbrek yetmezliğinde"],"a":0,"e":"Zayıf asitler alkali idrarda iyonize olup hızlı atılır."},{"q":"Penisilinin plazma yarı ömrünü aktif sekresyonda yarışarak uzatan ilaçlardan biri hangisidir?","o":["Metoklopramid","Atropin","Fenitoin","Probenesid","Vitamin C"],"a":3,"e":"Probenesid, aspirin ve fenilbutazon."},{"q":"Aşağıdaki besin-ilaç eşleştirmelerinden hangisi YANLIŞTIR?","o":["Tetrasiklin – Süt ürünleri","Griseofulvin – Bakla","MAOİ – Yoğurt, çay, kola","Eritromisin (oral) – Asitli içecekler","L-dopa – Bakla"],"a":1,"e":"Griseofulvin yağlı besinlerle etkileşir."},{"q":"MAO inhibitörü kullanan hastaya hangi besinlerden kaçınması söylenmelidir?","o":["Yalnızca kırmızı et","Yeşil sebzeler","Yağlı besinler","Alkol, maya, yoğurt, çay, süt ürünleri, kola","Asitli meyve suları"],"a":3,"e":"MAOİ'lerle etkileşen besinler."},{"q":"Antikoagülan kullanan hastada etkileşim yapabilecek besinler hangileridir?","o":["Balık, balık yağı, Vit. C ve K, şarap","Süt ve süt ürünleri","Bakla","Yağlı besinler","Limon, portakal"],"a":0,"e":"Kitaptaki listede antikoagülanlar bu besinlerle eşleşir."},{"q":"Su, hava ve besin kirleticileri gibi dış kaynaklı kimyasallara ne ad verilir?","o":["Hapten","Antidot","Metabolit","Prohapten","Ksenobiyotik"],"a":4,"e":"Ksenobiyotik tanımı."},{"q":"Kimyasalın beklenen etkisinin normal dozdan daha küçük dozda ortaya çıkmasına ne ad verilir?","o":["Tolerans","Taşifilaksi","Hipersensitivite","İdiyosenkrazi","Kümülasyon"],"a":2,"e":"Örnek: astımlıların ozona duyarlılığı."},{"q":"Proteinle birleşerek antijen oluşturan küçük moleküllü kimyasala ne ad verilir?","o":["Antikor","Ksenobiyotik","Metabolit","Atopi","Hapten"],"a":4,"e":"Hapten tanımı."},{"q":"Penisilinin \"prohapten\" olarak adlandırılmasının nedeni nedir?","o":["Alerjik özelliğinin metaboliti penisilinik aside bağlı olması","Proteinlere bağlanmaması","Antikor oluşturmaması","Tek başına antijen olması","Hiç alerji yapmaması"],"a":0,"e":"İn vivo metabolik aktivasyonla hapten özelliği kazanır."},{"q":"Aplastik anemiye neden olduğu belirtilen ilaçlar arasında hangisi yer alır?","o":["Penisilin","Lokal anestezik","İyodür","Kloramfenikol","Polen ekstraktı"],"a":3,"e":"Fenilbutazon, kloramfenikol ve sülfonamidler."},{"q":"Dolaşımda antikor bulunmasını gerektirmeyen alerjik reaksiyon tipi hangisidir?","o":["Anafilaktik tip","Sitotoksik tip","Gecikmiş (tüberkülin) tip","Arthus reaksiyonu","Serum hastalığı"],"a":2,"e":"Modifiye hücrelere bağlıdır."},{"q":"Antijenin deri altına enjeksiyonundan sonra lokal ödem veya nekroz oluşan reaksiyon hangisidir?","o":["Anafilaksi","Arthus reaksiyonu","Tüberkülin tipi","Sitolitik reaksiyon","Fototoksik reaksiyon"],"a":1,"e":"Arthus reaksiyonu."},{"q":"Bazı kişilerin kalıtsal nedenle alerjik komplikasyonlara yatkın olmasına ne ad verilir?","o":["İdiyosenkrazi","Taşifilaksi","Atopi","Hipersensitivite","Favizm"],"a":2,"e":"Atopi tanımı."},{"q":"Alerji tanısında yardımcı olan hücre artışı hangisidir?","o":["Nötrofil","Monosit","Trombosit","Eritrosit","Eozinofil"],"a":4,"e":"Alerjide eozinofil lökositler artar."},{"q":"Alerji ile toksisite arasındaki farkla ilgili hangisi YANLIŞTIR?","o":["Antikor oluşumu için 7–14 gün gerekir","Alerji ilk maruziyette ortaya çıkar","Genelde küçük dozda oluşabilir","Aynı madde farklı kişilerde farklı tablolar yapabilir","Eozinofil artışı görülür"],"a":1,"e":"Alerji ilk maruziyette görülmez."},{"q":"Fototoksik reaksiyona neden olan maddeler arasında hangisi yer alır?","o":["Sülfonamidler","Penisilin","Morfin","Digoksin","İnsülin"],"a":0,"e":"Sülfonamidler, kömür katranı türevleri (piridin, antrasen)."},{"q":"Bireyin kimyasala diğer bireylerden farklı yanıt vermesine ne ad verilir?","o":["Atopi","Tolerans","Hipersensitivite","İdiyosenkrazi","Taşifilaksi"],"a":3,"e":"Kalıtsal anormal yanıt."},{"q":"Süksinilkolin uygulanan bazı hastalarda kas felcinin uzun sürmesinin nedeni nedir?","o":["Asetilkolinesteraz fazlalığı","Böbrek yetmezliği","Psödokolinesteraz enziminin genetik defekti","Karaciğer enzim indüksiyonu","MAO eksikliği"],"a":2,"e":"Toplumda %2, otozomal çekinik."},{"q":"Süksinilkolin duyarlılığı geni toplumda hangi oranda görülür?","o":["%10","%25","%0,1","%50","%2"],"a":4,"e":"Kitapta %2."},{"q":"Sağlıklı kişilerde hemoglobinin ne kadarı methemoglobin formundadır?","o":["%1","%5","%10","%25","%0"],"a":0,"e":"Sağlıklı kişide Hb'nin çok azı (%1) MetHb'dir."},{"q":"Kalıtsal methemoglobinemide eksik olan önemli enzim hangisidir?","o":["Glukoz-6-fosfataz","NADPH-MetHb redüktaz","Psödokolinesteraz","ALA-sentetaz","Atropinaz"],"a":1,"e":"Dördüncü ve en önemli indirgeyici sistem NADPH-MetHb redüktazdır."},{"q":"Primakine duyarlılık hangi kalıtım şekliyle aktarılır?","o":["Otozomal çekinik","Otozomal baskın","Y kromozomuna bağlı","X kromozomuna bağlı","Mitokondriyal"],"a":3,"e":"Primakin ve favizm duyarlılığı cinsiyete bağlıdır."},{"q":"Kitaba göre normal dozda primakine duyarlılık gösteren siyah erkek oranı nedir?","o":["%5–10","%1–2","%20–30","%50","%0,5"],"a":0,"e":"Akut hemolitik anemi gelişir."},{"q":"Primakin duyarlılığında beklenmeyen bulgu hangisidir?","o":["Hemoliz","Hemoglobinüri","İdrar renginde koyulaşma","Sarılık","Polisitemi"],"a":4,"e":"Hemoliz, Hb düşüşü, hemoglobinüri ve sarılık beklenir."},{"q":"Hepatik porfiriada idrarla atılan maddeler hangileridir?","o":["Bilirubin ve ürobilinojen","Glukoz ve keton","Porfobilinojen ve aminolevülinik asit","Hemoglobin ve miyoglobin","Protein ve albumin"],"a":2,"e":"PBG ve ALA atılır."},{"q":"Akut porfiriayı tetikleyebilen ilaç grubu hangisidir?","o":["Penisilinler","Barbitüratlar","Aminoglikozidler","Antiasitler","Beta blokerler"],"a":1,"e":"Sülfonamidler ve barbitüratlar."},{"q":"Bazı tavşanları atropinin zararlı etkilerinden koruyan enzim hangisidir?","o":["Psödokolinesteraz","MAO","COMT","Atropinaz","Glükuronidaz"],"a":3,"e":"Genetik rezistans örneği."},{"q":"Yağ dokusunda depolanıp yağ dokusu eridiğinde serbestlenerek toksik etki yapan klasik örnek hangisidir?","o":["Penisilin","Aspirin","Lityum","DDT","Parasetamol"],"a":3,"e":"Kümülasyon örneği DDT."},{"q":"Kitaba göre morfinin normal dozu ve sürekli kullanımda ulaşılabilecek gereksinim nedir?","o":["10–15 mg; normal dozun 20–40 katı","1–2 mg; 2 katı","50 mg; 5 katı","100 mg; 10 katı","5 mg; 100 katı"],"a":0,"e":"Morfin toleransı örneği."},{"q":"Morfin kullanan kişide metadon ve meperidine de tolerans gelişmesi neye örnektir?","o":["Taşifilaksi","Çapraz tolerans","Çapraz alerji","İdiyosenkrazi","Fizyolojik bağımlılık"],"a":1,"e":"Benzer yapılı kimyasallarda çapraz tolerans."},{"q":"Nitrogliserin fabrikası işçilerinde hafta sonu kaybolup pazartesi tekrar başlayan belirtiler nasıl adlandırılır?","o":["Gri sendrom","Kernikterus","Favizm","Asetaldehit sendromu","Pazartesi sendromu"],"a":4,"e":"Taşifilaksi örneğidir."},{"q":"Taşifilaksi örneğinde hangi madde ile diğer nitrat-nitritler arasında çapraz tolerans gelişmez?","o":["Nitrogliserin","Amil nitrit","Sodyum nitrit","İzosorbid","Nitroprussid"],"a":2,"e":"Kitap: sodyum nitrit haricindeki nitrat ve nitritler arasında çapraz tolerans gelişir."},{"q":"Plazma proteinlerine kuvvetli bağlanıp yavaş elimine olduğu için toksisite riski taşıyan ilaç hangisidir?","o":["Penisilin G","Lidokain","Aspirin","Gentamisin","Digitoksin"],"a":4,"e":"Digitoksin; tedavi dozuna dikkat edilmezse ciddi toksisite."}]});
