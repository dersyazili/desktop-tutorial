<script>
U.push({"id":"u7","no":7,"title":"Antiseptik ve Dezenfektanlar","kisa":"Antiseptik-dezenfektan ayrımı, ideal özellikler, alkol, aldehit, halojenler, oksitleyiciler, ağır metaller, yüzey aktif maddeler, fenoller, boyalar, barsak ve üriner antiseptikler","s":[{"h":"1. Tanımlar ve ideal özellikler","b":"\n<ul><li><b>Antiseptik:</b> <b>Canlı doku</b> (cilt, mukoza) yüzeyindeki mikroorganizmaları (bakteri, mantar, virüs, protozoa) emilmeden parçalayan madde.</li>\n<li><b>Dezenfektan:</b> Cerrahi alet, sonda, kanül, cam gibi <b>cansız materyali</b> arındırmak için kullanılan madde.</li>\n<li>Antiseptikte aranan en önemli özellik: iritasyon ve alerji yapmaması, emilmemesi ya da emilirse toksik olmaması.</li></ul>\n<p><b>Üç grup:</b> dış kullanımlı antiseptikler, barsak antiseptikleri, üriner sistem antiseptikleri.</p>\n<p><b>Kullanım yerleri:</b> deri hastalıkları; sıyrık, yara, kesikte enfeksiyonu önleme; ameliyat bölgesi derisinin arındırılması; vajina, burun, ağız gibi mukozalı boşluklar. GİS'in iltihaplı olgularında oral kullanılan kemoterapötiklere <b>barsak antiseptiği</b>, idrar yolu olgularında kullanılanlara <b>idrar yolu antiseptiği</b> denir.</p>\n<p><b>İdeal antiseptik/dezenfektan:</b> mikrop öldürücü, geniş spektrumlu ve hızlı etkili olmalı. Ortamdaki mikroorganizma fazlalığı etkisini azaltmamalı. Kokusu hoş, boyamayan, ucuz olmalı. Düşük sıcaklıkta etkisi azalmamalı. Yakıcı, irritan ve alerjen olmamalı. <b>Yara iyileşmesini geciktirmemeli.</b> Dokuya nüfuz etmeli ama sistemik toksik olmamalı. Eşyayı bozmamalı, dayanıklı ve uzun etkili olmalı, çatlaklara nüfuz etmeli.</p>"},{"h":"2. Alkoller, aldehitler, asitler","b":"\n<ul><li><b>Alkol:</b> proteinlerin yapısını bozar. En çok <b>izopropil alkol ve etil alkol</b>. Etil alkol <b>%40–70</b>'te bakterisid. <b>Yüksek yoğunlukta</b> bakteri yüzey proteinlerini hızla çöktürdüğü için içeri geçemez. İzopropil alkol vazodilatasyonla kanamayı artırabilir. Hekzomedin gibi solüsyonların hazırlanmasında da kullanılır. <b>Virüslere etkisi yoktur.</b></li>\n<li><b>Formaldehit (formol):</b> tüm mikroorganizmalara güçlü etkili. Canlı dokuda şiddetli iritasyon yaptığı için <b>yalnız dezenfektan</b>. <b>%2–8</b> solüsyonu cerrahi malzeme sterilizasyonunda; ticari formol <b>%34–38</b>.</li>\n<li><b>Glutaraldehit:</b> dezenfektan olarak <b>%2</b>.</li>\n<li><b>Asitler</b> (genellikle gıda koruma): asetik asit <b>%0,25–1</b>; benzoik asit <b>%0,1</b>; <b>borik asit</b> organizmada biriktiği için özellikle çocuklarda tehlikeli, tedavide terk edildi; laktik asit <b>%1–2</b> cilt ve genital mukoza temizliğinde.</li></ul>"},{"h":"3. Halojenler ve oksitleyiciler","b":"\n<p><b>Klor:</b> Suyun dezenfeksiyonunda klor gazı kullanılır; suyla <b>hipoklorik asit</b> oluşur ve etki buna dayanır. Hipoklorik asit dayanıksız olduğundan tıpta sodyum tuzu kullanılır: <b>sodyum hipoklorit (NaClO) taze hazırlanmalı</b>; deride irritasyon yapar.</p>\n<table><tr><th>NaClO solüsyonu</th><th>Konsantrasyon</th></tr>\n<tr><td>Javel suyu</td><td>%12</td></tr><tr><td>Labarraque solüsyonu</td><td>%2</td></tr>\n<tr><td>Dakin solüsyonu</td><td>%1,5</td></tr><tr><td>Modifiye Dakin</td><td>%0,5</td></tr></table>\n<p>Yaralarda binde 1,5–2 klor olacak şekilde seyreltilir. <b>Klorlu kireç</b>: koku giderici ve dezenfektan. <b>Kloramin</b> (sodyum tosilkloramid): içme suyu dezenfeksiyonu.</p>\n<p><b>İyot:</b> En çok kullanılan jermisittir. Tentürdiyot ve lugol. Türk Farmakopesi formülü: <b>sodyum iyodür 2,5 g + iyot 2 g + %50 alkol ile 100 ml</b>. Deride hızlı etki. <b>Suyu dezenfekte etmek için litreye 3–4 damla.</b> Yakıcı olduğu için <b>mukozaya uygulanmaz</b>. Alkoldeki %1'lik solüsyonu yüzeyel mantarda kullanılır. Yavaş iyot salan bileşikler = <b>iyodoforlar</b> (povidon iyot).</p>\n<p><b>Hidrojen peroksit (oksijenli su):</b> yara temizliği ve ağız lavajı. <b>%3</b>'lük solüsyon yarada <b>katalaz</b> enzimiyle su ve oksijene ayrılıp <b>köpürür</b>.</p>\n<p><b>Potasyum permanganat (KMnO₄):</b> fungisid ve bakterisid; gram (–)'e etkisi gram (+)'den fazla. <b>1:10.000</b> akıntılı deri lezyonları ve vajinal antisepsi; venomları oksitlediği için <b>akrep ve yılan sokmasında</b> yaraya kesi yapılıp kristal uygulanır; alet dezenfeksiyonu (1:10.000 ve 1:5.000).</p>"},{"h":"4. Diğer dış antiseptikler","b":"\n<ul><li><b>Klorheksidin:</b> cilt, yara ve mukoza temizliğinde çok kullanılır; toksisitesi azdır (sinir dokusu hariç).</li>\n<li><b>Kükürt:</b> sodyum tiyosülfat zayıf antiseptiktir; uyuz ve mantarda. <b>İhtamol (ichtyol)</b>: kükürtlü antiseptik pomat; %10'luk merhem.</li>\n<li><b>Benzalkonyum klorür (katyonik deterjan):</b> mukoza, deri, mesane, vajina, konjonktiva; alet dezenfeksiyonunda <b>sodyum nitrit eklenirse aletler paslanmaz</b>; deodorantlara katılır.</li>\n<li><b>Cıva:</b> bakteriyostatik ve fungistatik; emilirse çok toksik. Nitromersol, timerosal, fenilmerkürik asit.</li>\n<li><b>Gümüş nitrat:</b> eskiden yenidoğanda <b>gonokok oftalmisine</b> karşı <b>%0,1</b>; yanıkta <b>%0,5</b>; göz damlası olarak <b>%1</b> (oldukça irritan). <b>Gümüş sülfadiazin:</b> yanıkta yara sepsisini önleme.</li>\n<li><b>Kuaterner amonyum bileşikleri:</b> katyonik yüzey aktif; düşük konsantrasyonda bakteri, mantar, virüse etkili; spermisid. Setrimonyum, setilpiridinyum, domifen, benzalkonyum. <b>Etkileri sabunla azalır, alkolle artar.</b> Sabun anyonik yüzey aktif maddedir, kiri ve bakteriyi uzaklaştırır.</li>\n<li><b>Hekzaklorofen (fenol):</b> ameliyat öncesi el yıkama, deodorant; gram (+)'e çok etkili. <b>%1'de bakteriyostatik</b>, üstünde bakterisid. <b>Bebeklerde deriden kolay emilir → sistemik toksisite, nörotoksisite.</b></li>\n<li><b>Krezoller:</b> %50 karışımı = <b>lizol</b> (dezenfektan).</li>\n<li><b>Akridin boyaları (sarı):</b> <b>rivanol</b> (etoksiaminoakridin) en sık; %0,01–0,02. Kristal viyole, metilen mavisi, eozin dermatolojide.</li>\n<li><b>Göz antiseptikleri:</b> <b>gümüş nitrat %1</b> (yenidoğanda doğum kanalından bulaşan konjonktiviti önler), çinko sülfat (ağrı yapar), inorganik cıva tuzları %1, metilen mavisi, borik asit (zayıf, birçok göz damlasında), kuaterner amonyum.</li>\n<li><b>Diğer:</b> triklokarban (sabun, tıraş köpüğü), heksamidin (gram (+) ve kandida), <b>torolidin</b> (periton yıkama, %0,05–2,5).</li></ul>"},{"h":"5. Barsak antiseptikleri","b":"\n<p>Oral alınıp emilmeyen sülfonamid, aminoglikozid, polimiksinler; ayrıca 5-nitroimidazoller, hidroksikinolinler, nitrofuran türevleri.</p>\n<ul><li><b>5-Nitroimidazoller</b> (metronidazol, ornidazol, tinidazol): trikomonas, amipli dizanteri, anaerob gram (–). Erkek ürogenital ve kadın <i>T. vaginalis</i> enfeksiyonu; <b>amipli dizanteride metronidazol ilk tercih</b>; giardiyaz; ameliyat sonrası anaerob enfeksiyonlar. Klindamisin, rifampisin, tetrasiklin, nalidiksik asitle sinerji.</li>\n<li>Yan etki: sindirim bozukluğu, bitkinlik, <b>idrarın boyanması</b>, periferik nöropati, döküntü, baş dönmesi (ornidazol). KE: <b>gebelik, emzirme</b>, anemi, duyarlılık. <b>K vitamini ve alkolle birlikte alınmaz.</b></li>\n<li><b>Hidroksikinolinler:</b> dizanteri ve <b>turist diyaresi</b>; kliokinol (Entero-vioform), iyodokinol.</li>\n<li><b>Nitrofuran türevleri:</b> emilmez; trikomonas ve gram (–). Furazolidon, nifuroksazid, nifurzid.</li></ul>"},{"h":"6. Üriner antiseptikler","b":"\n<p>Üriner enfeksiyondan sorumlu gram (–) bakterilere etkili, idrarda aktif bulunan sentetik maddeler.</p>\n<ul><li><b>Nalidiksik asit (Naligram):</b> DNA sentezini inhibe ederek bakterisid; akut piyelonefrit, gram (–) septisemi. Yan etki: GİS, cilt, <b>konvülsiyon</b>, baş dönmesi, KC bozukluğu. Etkisi <b>nitrofurantoinle antagonize</b> olur; K antivitaminlerinin etkisini artırır. KE: <b>3 yaşından küçük</b>, gebe, KC hastası.</li>\n<li><b>Oksolinik asit:</b> nalidiksik asitten <b>4 kat güçlü</b>; SSS toksisitesi fazla. <b>Pipemidik asit</b> buna benzer.</li>\n<li><b>Nitrofurantoin:</b> gram (–) ve (+). Yan etki: bulantı, kusma, sarılık, polinevrit, <b>hemolitik anemi</b>. KE: <b>ağır böbrek yetmezliği</b>. Nifuratel, nifurfolin, nifurtoinol trikomonas ve mantara da etkilidir.</li>\n<li><b>Nitroksolin:</b> 8-hidroksikinolin türevi; <b>akut miyelooptikonevrit</b> nedeniyle kullanımı sınırlı. Metenamin ve fenazopiridin az kullanılır.</li></ul>"}],"q":[{"q":"Canlı doku yüzeyindeki mikroorganizmaları emilmeden parçalayan maddelere ne ad verilir?","o":["Dezenfektan","Antibiyotik","Sterilizan","Kemoterapötik","Antiseptik"],"a":4,"e":"Antiseptik canlı dokuya uygulanır."},{"q":"Cerrahi alet, sonda ve kanül gibi cansız materyali mikroorganizmalardan arındırmak için kullanılan maddeye ne ad verilir?","o":["Antiseptik","Dezenfektan","Antibiyotik","Barsak antiseptiği","Üriner antiseptik"],"a":1,"e":"Dezenfektan."},{"q":"İdeal bir antiseptiğin özellikleri arasında hangisi yer almaz?","o":["Yara iyileşmesini hızlandırmak için doku onarımını geciktirmesi","Mikrop öldürücü olması","Allerjen olmaması","Düşük sıcaklıkta etkisinin azalmaması","Eşyanın yapısını bozmaması"],"a":0,"e":"Doku onarımını, dolayısıyla yara iyileşmesini geciktirmemelidir."},{"q":"Etil alkolün bakterisid etkili olduğu konsantrasyon aralığı hangisidir?","o":["%10–20","%90–100","%40–70","%1–5","%25–30"],"a":2,"e":"%40–70."},{"q":"Yüksek yoğunluktaki alkolün etkisinin azalmasının nedeni nedir?","o":["Buharlaşmaması","Suda çözünmemesi","Virüslere etkisinin artması","Bakteri yüzey proteinlerini hızla çöktürdüğü için bakteriye geçememesi","Ciltten emilmesi"],"a":3,"e":"Yüksek yoğunlukta proteinleri hızla çöktürür."},{"q":"Alkolün etkisiz olduğu mikroorganizma grubu hangisidir?","o":["Gram (+) bakteriler","Gram (–) bakteriler","Mantarlar","Virüsler","Protozoa"],"a":3,"e":"Kitap: alkolün virüsler üzerine etkisi yoktur."},{"q":"Uygulandığı yerde vazodilatasyonla kanamayı artırabilen alkol hangisidir?","o":["İzopropil alkol","Etil alkol","Metil alkol","Benzil alkol","Gliserin"],"a":0,"e":"İzopropil alkol."},{"q":"Canlı dokuda şiddetli iritasyon yaptığı için yalnızca dezenfektan olarak kullanılan madde hangisidir?","o":["Etil alkol","Formaldehit","Klorheksidin","Hidrojen peroksit","Rivanol"],"a":1,"e":"Formaldehit (formol)."},{"q":"Cerrahi malzemelerin sterilizasyonunda kullanılan formaldehit solüsyonunun konsantrasyonu nedir?","o":["%34–38","%0,1","%50","%70","%2–8"],"a":4,"e":"Ticari formol ise %34–38."},{"q":"Glutaraldehitin dezenfektan olarak kullanılan konsantrasyonu nedir?","o":["%10","%0,5","%2","%40","%70"],"a":2,"e":"%2'lik solüsyon."},{"q":"Organizmada biriktiği için özellikle çocuklarda tehlikeli olan ve tedavide kullanımı terk edilen asit hangisidir?","o":["Laktik asit","Asetik asit","Benzoik asit","Salisilik asit","Borik asit"],"a":4,"e":"Borik asit."},{"q":"Klorun mikrop öldürücü etkisi hangi bileşiğin oluşumuna dayanır?","o":["Hipoklorik asit","Hidroklorik asit","Klorür iyonu","Kloramin","Klorat"],"a":0,"e":"Klor gazı suyla hipoklorik asit oluşturur."},{"q":"Sodyum hipoklorit solüsyonlarıyla ilgili doğru ifade hangisidir?","o":["Yıllarca bozulmadan saklanır","Deride hiç irritasyon yapmaz","Taze hazırlanmalıdır","Göz damlası olarak kullanılır","Ağızdan alınır"],"a":2,"e":"NaClO solüsyonu taze yapılmalıdır."},{"q":"Dakin solüsyonunun konsantrasyonu nedir?","o":["%12","%1,5","%2","%0,5","%5"],"a":1,"e":"Javel %12, Labarraque %2, Dakin %1,5, modifiye Dakin %0,5."},{"q":"Javel suyunun sodyum hipoklorit konsantrasyonu nedir?","o":["%2","%1,5","%0,5","%12","%25"],"a":3,"e":"Javel suyu %12."},{"q":"İçme sularının dezenfeksiyonunda kullanılan klor bileşiği hangisidir?","o":["Kloramin (sodyum tosilkloramid)","Klorheksidin","Kloroform","Kloramfenikol","Klorpromazin"],"a":0,"e":"Kloramin."},{"q":"En çok kullanılan jermisit olarak tanımlanan antiseptik hangisidir?","o":["Alkol","Formaldehit","Gümüş nitrat","İyot ve iyotlu bileşikler","Klorheksidin"],"a":3,"e":"Kitap: en çok uygulanılan jermisittir."},{"q":"İyot ile suyun dezenfeksiyonu için litreye kaç damla eklenir?","o":["10–15 damla","1 damla","3–4 damla","20 damla","50 damla"],"a":2,"e":"Bir litreye 3–4 damla."},{"q":"Tentürdiyotun mukozalara uygulanmamasının nedeni nedir?","o":["Etkisinin yavaş olması","Renksiz olması","Virüslere etkisiz olması","Hızla buharlaşması","Yakıcı etkisi"],"a":4,"e":"Yakıcı etkisi nedeniyle."},{"q":"Organik maddelerle karıştırılarak yavaş iyot salan bileşiklere ne ad verilir?","o":["Lugol","İyodofor","Tentürdiyot","Kloramin","Hekzomedin"],"a":1,"e":"Povidon iyot gibi."},{"q":"%3'lük hidrojen peroksitin yarada köpürmesine neden olan enzim hangisidir?","o":["Peroksidaz","Amilaz","Lipaz","Katalaz","Kolinesteraz"],"a":3,"e":"Parçalanmış hücrelerden çıkan katalaz su ve oksijene ayırır."},{"q":"Venomları oksitleyerek parçaladığı için akrep ve yılan sokmalarında uygulanabilen antiseptik hangisidir?","o":["Hidrojen peroksit","Potasyum permanganat","Alkol","Gümüş nitrat","Klorheksidin"],"a":1,"e":"KMnO4 kristalleri yaraya uygulanır."},{"q":"Potasyum permanganatın akıntılı deri lezyonları ve vajinal antisepside kullanılan seyreltisi hangisidir?","o":["1:10.000","1:10","1:100","1:1.000.000","1:2"],"a":0,"e":"1:10.000."},{"q":"Benzalkonyum klorür ile alet dezenfeksiyonunda aletlerin paslanmaması için ne eklenir?","o":["Sodyum klorür","Alkol","Sodyum nitrit","Sabun","Borik asit"],"a":2,"e":"Kitapta sodyum nitrit (NaNO2)."},{"q":"Kuaterner amonyum bileşiklerinin etkisini azaltan madde hangisidir?","o":["Alkol","Su","Isı","Asit","Sabun"],"a":4,"e":"Etkileri sabunla antagonize olur, alkolle artar."},{"q":"Yenidoğanın gözüne doğum kanalından bulaşan konjonktiviti önlemek için kullanılan antiseptik hangisidir?","o":["Rivanol","Hidrojen peroksit","Formaldehit","Gümüş nitrat %1","Povidon iyot %10"],"a":3,"e":"Gümüş nitrat %1 damla."},{"q":"Yanıklarda yara sepsisini önlemek için yerel olarak uygulanan gümüş bileşiği hangisidir?","o":["Gümüş klorür","Gümüş oksit","Gümüş iyodür","Kolloidal gümüş","Gümüş sülfadiazin"],"a":4,"e":"Gümüş sülfadiazin."},{"q":"Bebeklerde deriden kolay emilerek sistemik toksisite ve nörotoksisite yapabilen antiseptik hangisidir?","o":["Hekzaklorofen","Klorheksidin","Etil alkol","Benzalkonyum","Rivanol"],"a":0,"e":"Hekzaklorofen."},{"q":"Hekzaklorofen %1 yoğunlukta nasıl etki eder?","o":["Bakterisid","Bakteriyostatik","Virusid","Sporisid","Etkisiz"],"a":1,"e":"%1'de bakteriyostatik, daha yüksekte bakterisid."},{"q":"Krezollerin %50'lik karışımına ne ad verilir?","o":["Rivanol","Lugol","Lizol","Javel","Hekzomedin"],"a":2,"e":"Lizol dezenfektan olarak kullanılır."},{"q":"Sarı renkli, tedavide sık kullanılan akridin boyası antiseptik hangisidir?","o":["Metilen mavisi","Kristal viyole","Rivanol","Eozin","Fuksin"],"a":2,"e":"Etoksiaminoakridin (rivanol)."},{"q":"Toksisitesi az olan (sinir dokusu hariç), cilt, yara ve mukoza temizliğinde çok kullanılan antiseptik hangisidir?","o":["Formaldehit","Cıva","Borik asit","Klorheksidin","Fenol"],"a":3,"e":"Klorheksidin."},{"q":"Periton boşluğunun yıkanmasında kullanılan antiseptik hangisidir?","o":["Formaldehit","Lizol","Javel suyu","Gümüş nitrat","Torolidin"],"a":4,"e":"Torolidin %0,05–2,5."},{"q":"Amipli dizanteride günümüzde ilk tercih ilaç hangisidir?","o":["Metronidazol","Nitrofurantoin","Nalidiksik asit","Kliokinol","Neomisin"],"a":0,"e":"Barsak ya da doku amibiyazisinde metronidazol ilk tercih."},{"q":"5-Nitroimidazol barsak antiseptikleriyle ilgili hangisi YANLIŞTIR?","o":["İdrarı boyayabilir","Gebelik ve emzirmede güvenle kullanılır","Alkolle birlikte alınmamalıdır","Periferik nöropati yapabilir","Trikomonas enfeksiyonlarında kullanılır"],"a":1,"e":"Gebelik ve emzirmede kontrendikedir."},{"q":"Turist diyaresinde kullanılan barsak antiseptiği grubu hangisidir?","o":["Nitrofurantoin","Hidroksikinolinler (kliokinol)","Nalidiksik asit","Metenamin","Fenazopiridin"],"a":1,"e":"Kliokinol (Entero-vioform), iyodokinol."},{"q":"Nalidiksik asidin kontrendike olduğu yaş grubu hangisidir?","o":["65 yaş üstü","12–18 yaş","3 yaşından küçük çocuklar","Yetişkin erkekler","Menopoz sonrası kadınlar"],"a":2,"e":"3 yaşından küçük çocuklar, gebeler ve KC hastaları."},{"q":"Nalidiksik asidin etkisini antagonize eden ilaç hangisidir?","o":["Nitrofurantoin","K antivitaminleri","Oksolinik asit","Metronidazol","Penisilin"],"a":0,"e":"Nitrofurantoin; nalidiksik asit K antivitaminlerinin etkisini artırır."},{"q":"Nalidiksik asitten yaklaşık 4 kat daha güçlü olan ancak SSS toksisitesi fazla olan üriner antiseptik hangisidir?","o":["Pipemidik asit","Nitrofurantoin","Metenamin","Oksolinik asit","Nitroksolin"],"a":3,"e":"Oksolinik asit."},{"q":"Hemolitik anemi ve polinevrit yapabilen, ağır böbrek yetmezliğinde kontrendike olan üriner antiseptik hangisidir?","o":["Nalidiksik asit","Metenamin","Fenazopiridin","Oksolinik asit","Nitrofurantoin"],"a":4,"e":"Nitrofurantoin."},{"q":"Akut miyelooptikonevrit yan etkisi nedeniyle kullanımı sınırlı olan üriner antiseptik hangisidir?","o":["Nitrofurantoin","Nalidiksik asit","Pipemidik asit","Metenamin","Nitroksolin"],"a":4,"e":"8-hidroksikinolin türevi nitroksolin."},{"q":"Cıva bileşikleriyle ilgili doğru ifade hangisidir?","o":["Virüslere en etkili antiseptiktir","Bakteriyostatik ve fungistatiktir, emilirse toksik etkisi fazladır","Hiç toksik değildir","Yalnızca içme suyunda kullanılır","Sporisid etkilidir"],"a":1,"e":"Nitromersol, timerosal, fenilmerkürik asit."},{"q":"Kükürt içeren antiseptik pomat hangisidir?","o":["Rivanol","Lugol","Lizol","İhtamol (ichtyol)","Hekzomedin"],"a":3,"e":"İhtamol; %10'luk merhem."}]});

</script><script>
U.push({"id":"u8","no":8,"title":"Antineoplastik (Antikanser) İlaçlar","kisa":"Genel özellikler, hemşirelik önlemleri, etkinliği etkileyen faktörler, yan etkiler, tedavi modelleri, 6 ilaç grubu","s":[{"h":"1. Genel özellikler","b":"\n<p><b>Kanser:</b> Hücrelerin kontrolsüz üremesi ve kan-lenf yoluyla <b>metastaz</b> yapması. Antikanser ilaçlar hücre bölünmesini engeller. Malign ve normal hücre arasında nitel fark az olduğundan <b>seçicilikleri düşüktür</b>; normal hızlı çoğalan hücreleri de öldürürler.</p>\n<p><b>En çok zarar gören hücreler:</b> <b>kemik iliği, gonadlar, GİS, kıl folikülü</b>. KC, böbrek gibi yavaş üreyen hücreleri de etkileyebilirler.</p>\n<ul><li><b>Döneme-spesifik ilaçlar:</b> hücre çoğalmasıyla ilgili dinamik olaylarda etkili.</li>\n<li><b>Döneme-spesifik olmayanlar:</b> hücre bölünmede de istirahatte de etkili.</li>\n<li>Yaygın olmayan tümör → cerrahi (komşu lenf düğümleriyle) + radyoterapi. <b>Yaygın tümörde tek çare kemoterapi.</b></li></ul>"},{"h":"2. Kemoterapi alan hastada hemşirelik önlemleri","b":"\n<p>İmmün yetmezliğe bağlı enfeksiyon riski çok yüksektir; <b>nozokomiyal enfeksiyona</b> karşı hijyen ve asepsi şarttır.</p>\n<ul><li>Hematolojik parametreler (<b>lökopeni, trombopeni</b>) ve süperenfeksiyon olasılığı izlenir.</li>\n<li>Hastayla temasta <b>maske</b> takılır, steril enjektörler <b>eldivenle</b> tutulur.</li>\n<li>İlaç hazırlanırken <b>protokoldeki doza</b> uyulur; hekim-hemşire iletişimi titizlikle sürdürülür.</li>\n<li><b>Ekstravazasyon</b> riskine karşı enjeksiyon bölgesi iyi seçilir; ekstravazasyonda <b>enjeksiyon hemen durdurulur</b>.</li>\n<li>Rahat yatak pozisyonu, düzenli yemek aralıkları, <b>antiemetik</b>; <b>alopesiyi</b> azaltmak/geciktirmek için başa <b>serinletici başlık</b>.</li>\n<li>Hastaya moral verilir, hastalık ve tedavi hakkında bilgilendirilir; aile ve hekimle iletişimine yardım edilir.</li></ul>"},{"h":"3. Etkinliği etkileyen faktörler","b":"\n<p><b>Tümörle ilgili:</b></p><ul>\n<li>Tümörün yok olması için <b>tüm malign hücreler öldürülmeli</b>; tek hücre kalsa bile tümör yeniden oluşur.</li>\n<li>İlacın döneme spesifik olup olmaması etkinliği kısıtlar.</li>\n<li><b>Hızlı üreyen tümör hücreleri ilaçlara daha duyarlıdır</b>; tümör büyüdükçe duyarlılık azalır.</li></ul>\n<p><b>İlaçla ilgili:</b> Çoğu ilaç SSS'ye giremediğinden <b>beyin tümörü ve metastazına etkisizdir</b>. Etki yeri çoğunlukla hücre içidir; zar geçirgen değilse etki azalır: <b>metotreksat osteojenik sarkom hücresine zor geçtiği için azami dozda verilir</b>. Etkinliği kısıtlayan önemli etken <b>toksisitedir</b>. Tümör hücresinin direnç kazanması tedavi ediciliği azaltır.</p>\n<p><b>Hastayla ilgili:</b> Günlük işlerini sürdürebilen hastada etkili. İmmünitesi normal olan daha iyi yanıt verir. Radyoterapi + kemoterapi immün sistemi bozup etkinliği azaltır. Cinsiyet, yaş, organ durumu, ırk ve eşlik eden hastalık etkiler.</p>"},{"h":"4. Yan etkiler","b":"\n<ul><li><b>Kemik iliği baskılanması:</b> eritrosit, lökosit ve trombosit öncüllerine toksik → <b>kan sayımı izlenir</b>; dönüşümsüz olursa ölüm nedeni olabilir.</li>\n<li><b>Hızlı üreyen normal hücreler:</b> GİS epitelinde <b>stomatit, enterit, ülser</b>; kıl folikülünde <b>saç dökülmesi</b>; gonadlarda spermatogenez/oogenez bozukluğu ve <b>kısırlık</b>.</li>\n<li><b>Lenfotoksik etki ve immünosüpresyon:</b> hümoral ve hücresel bağışıklık baskılanır.</li>\n<li><b>Teratojenik etki:</b> düşük ve anomalili doğum.</li>\n<li><b>Mutajenik ve karsinojenik etki</b>.</li>\n<li>Kusma, bulantı; İV verilişte <b>doku içine sızma → nekroz</b>.</li></ul>"},{"h":"5. Tedavi modelleri","b":"\n<table><tr><th>Model</th><th>Özellik</th></tr>\n<tr><td>Cerrahi girişim</td><td>Sınırlı tümörler</td></tr>\n<tr><td>Radyasyon</td><td><b>Baş ve burun tümörlerinde</b> ameliyattan daha uygun</td></tr>\n<tr><td>Bağışıklık sistemini uyarma</td><td>1 g dokuda kanser hücresi <b>10–100 binden fazlaysa</b> yarar sağlamaz; monoklonal antikor, lenfokinler</td></tr>\n<tr><td><b>Kriyoşirürji</b></td><td>Sıvı azotla soğutulmuş cerrahi milde hücreler dondurulur; klasik cerrahiden <b>daha az metastaz</b></td></tr>\n<tr><td><b>Kemoterapi</b></td><td>Yaygın kanserler için uygun; cerrahi ve ışınla büyük kısım alındıktan sonra <b>mikrometastazları</b> önlemek için ideal</td></tr></table>\n<p>Antikanser ilaçlar etki şekillerine göre <b>6 grupta</b> toplanır: alkilleyiciler, antimetabolitler, antibiyotikler, mitoz inhibitörleri, hormonlar ve antagonistleri, diğerleri.</p>"},{"h":"6. Alkilleyici ilaçlar","b":"\n<p>DNA çift zincirine <b>kovalent bağla</b> bağlanıp alkiller; enzim ve proteinleri de alkiller. <b>Döneme özgü değildir.</b> <b>7 alt grup</b> vardır:</p>\n<table><tr><th>Alt grup</th><th>İlaçlar ve kullanım</th><th>Yan etki</th></tr>\n<tr><td>Azotlu hardallar</td><td>Klormetin, melfalan, klorambusil; meme, over, Hodgkin (prednizon, vinka, prokarbazinle)</td><td>—</td></tr>\n<tr><td><b>Oksazoforinler</b></td><td><b>Siklofosfamid</b>, ifosfamid, mafosfamid. Siklofosfamid lenfomalarda (oral <b>50 mg/gün</b>), <b>meme ve over kanserinde öncelikli</b></td><td>Kemik iliği inhibisyonu, alopesi, <b>hemorajik sistit</b>, kardiyak bozukluk. <b>Canlı aşı yapılmaz</b>; böbrek yetmezliğinde KE</td></tr>\n<tr><td>Etileniminler</td><td><b>Altretamin</b> (akciğer, over, meme, küçük hücreli akciğer); tiotepa azaldı</td><td>Bulantı, santral depresyon, polinevrit</td></tr>\n<tr><td>Alkil sülfonatlar</td><td><b>Busulfan</b>: kronik miyelositer lösemi</td><td>Trombositopeni, anemi; uzun kullanımda <b>pulmoner fibroz</b>; amenore, azospermi</td></tr>\n<tr><td>Triazenler</td><td><b>Dakarbazin</b>: Hodgkin, malign melanom; prokarbazin benzer</td><td>Dakarbazin <b>şiddetli bulantı-kusma</b>; prokarbazin nörotoksik</td></tr>\n<tr><td>Nitrozoüreler</td><td>Karmustin, lomustin, semustin, streptozosin; lenfoma, miyelom, melanom, kolorektal</td><td>Lökopeni, KC bozukluğu, öksürük; streptozosin böbrek bozukluğu, <b>hipoglisemi</b></td></tr>\n<tr><td>Organoplatinler</td><td><b>Sisplatin, karboplatin</b>; testis ve over tümörü (+ siklofosfamid)</td><td><b>Böbrek lezyonu</b>, GİS ve hematolojik bozukluk</td></tr></table>"},{"h":"7. Antimetabolitler ve antibiyotikler","b":"\n<p><b>Antimetabolitler:</b> Doğal metabolitlerin analoğu; enzimi dönüşümsüz engeller; <b>döneme-spesifik</b>; çoğalma aktivitesi yüksek tümörlerde etkili.</p>\n<ul><li><b>Metotreksat:</b> <b>dihidrofolat redüktazı</b> bloke ederek folik asit inhibisyonu. Hodgkin dışı lenfoma, baş-boyun kanseri; yüksek dozda osteosarkom, bronş kanseri. <b>Doz sınırlayıcı yan etki lökopeni ve trombositopeni</b>; stomatit, diyare, alopesi.</li>\n<li><b>6-Merkaptopürin ve 6-tiyoguanin:</b> pürin antagonisti; <b>miyelositer lösemide öncelikli</b>.</li>\n<li><b>5-Fluorourasil ve sitarabin:</b> antipirimidin; over, meme, GİS, cilt kanseri. Yan etki: stomatit, alopesi, kemik iliği depresyonu.</li></ul>\n<p><b>Antitümör antibiyotikler:</b></p><ul>\n<li><b>Doksorubisin:</b> DNA zincirleri arasına girer (interkalasyon); geniş spektrum: akut lösemi, lenfoma, meme, testis, over, bronş.</li>\n<li><b>Daunorubisin:</b> akut lösemiler.</li>\n<li><b>Aktinomisin-D:</b> <b>pediyatrik ve embriyoner tümörlerde öncelikli</b>.</li>\n<li><b>Bleomisin:</b> oral emilim az → parenteral; sisplatinle testis, baş-boyun, serviks, cilt kanseri.</li>\n<li>Yan etkiler: <b>kemik iliği depresyonu</b>, bulantı, alopesi, <b>kardiyak ileti ve ritim bozukluğu</b>, KC bozukluğu.</li></ul>"},{"h":"8. Mitoz inhibitörleri, hormonlar ve diğerleri","b":"\n<p><b>Vinka alkaloidleri</b> (vinkristin, vinblastin, vindesin): mitotik iğcikleri etkileyip bölünmeyi <b>metafazda</b> durdurur. Akut lenfoblastik lösemi, Hodgkin, Hodgkin dışı lenfoma. Yan etki: <b>nörotoksisite</b>, kemik iliği depresyonu, ortostatik hipotansiyon, <b>kabızlık</b>, uykusuzluk.</p>\n<p><b>Hormonlar ve antagonistleri:</b></p><ul>\n<li><b>Prednizon:</b> kanserde en çok kullanılan glukokortikoid; ALL, lenfoma, meme, adrenal korteks tümörü, multipl miyelom; protein sentezini inhibe eder; yüksek doz → yan etki artar.</li>\n<li><b>Östrojen türevleri:</b> meme ve prostat; <b>estramustin</b> metastatik prostat. <b>Dietilstilbestrol</b> prostat; <b>estradiol valerat</b> meme.</li>\n<li><b>Medroksiprogesteron</b>, hidroksiprogesteron kaproat: antiöstrojenik → <b>endometriyum kanseri</b>.</li>\n<li><b>Flutamid, nilutamid:</b> testosteron reseptör blokajı → metastatik prostat; yan etki <b>sıcak basması, libido azalması, impotans</b>.</li>\n<li><b>Buserelin, löprolid:</b> gonadotropin inhibitörü; prostat ve meme; yan etki sıcak basması.</li></ul>\n<p><b>Diğerleri:</b> <b>hidroksiüre</b> (kronik miyelositer lösemi; hiperpigmentasyon, hiperkeratoz); <b>podofilotoksinler</b> (etoposid, teniposid; testis embriyoner karsinomu, pediyatrik tümörler, Hodgkin); <b>asparaginaz</b> (enzim; ALL ve lenfoma; KC bozukluğu, hipofibrinojenemi, <b>akut pankreatit</b>); <b>heksametil melamin</b> (over karsinomu).</p>"}],"q":[{"q":"Antineoplastik ilaçlardan en çok zarar gören hücreler arasında hangisi yer almaz?","o":["Kemik iliği","Gonadlar","GİS epiteli","Kıl folikülü","Nöronlar"],"a":4,"e":"En çok zarar görenler kemik iliği, gonadlar, GİS ve kıl folikülü."},{"q":"Antikanser ilaçların seçiciliğinin düşük olmasının nedeni nedir?","o":["İlaçların suda çözünmemesi","Malign hücre ile normal hücre arasında nitel farkın az olması","Ağızdan alınmaları","Proteinlere bağlanmamaları","Kısa yarı ömürleri"],"a":1,"e":"Kalitatif fark azdır."},{"q":"Hücre bölünme ya da istirahat döneminde olsun her zaman etkili olan antikanser ilaçlara ne ad verilir?","o":["Döneme-spesifik olmayan ilaçlar","Döneme-spesifik ilaçlar","Antimetabolitler","Mitoz inhibitörleri","Hormonlar"],"a":0,"e":"Örneğin alkilleyiciler."},{"q":"Tümör çok yaygınsa tek tedavi seçeneği hangisidir?","o":["Cerrahi","Radyoterapi","Antikanser kemoterapi","Kriyoşirürji","Bağışıklık uyarımı"],"a":2,"e":"Fazla yaygın tümörde tek çare kemoterapidir."},{"q":"Kemoterapi alan hastada aşağıdaki hemşirelik uygulamalarından hangisi YANLIŞTIR?","o":["Hastayla temasta maske takılır","Lökopeni ve trombopeni izlenir","Alopesiyi geciktirmek için serinletici başlık takılır","Ekstravazasyon gelişirse infüzyon hızı artırılarak ilaç tamamlanır","Antiemetik verilir"],"a":3,"e":"Ekstravazasyonda enjeksiyon hemen durdurulur."},{"q":"Kemoterapi alan hastada alopesiyi azaltmak veya geciktirmek için önerilen uygulama hangisidir?","o":["Saçların her gün yıkanması","Isıtıcı başlık kullanılması","Saç boyası kullanılması","Başa serinletici başlık takılması","Saçların sıkıca bağlanması"],"a":3,"e":"Kitaptaki önlem."},{"q":"Kemoterapi alan hastalarda enfeksiyon riskinin yüksek olmasının nedeni nedir?","o":["Polisitemi","Hipertansiyon","Hiperglisemi","Dehidratasyon","İmmün yetmezlik gelişmesi"],"a":4,"e":"İmmün yetmezliğe bağlı; nozokomiyal enfeksiyona karşı önlem gerekir."},{"q":"Antineoplastik ilaçların çoğunun beyin tümörüne etkisiz olmasının nedeni nedir?","o":["Beyinde hızla metabolize olmaları","Beyin hücrelerinin hızlı bölünmesi","SSS'ye girememeleri","Kan akımının fazla olması","Beyinde reseptör olmaması"],"a":2,"e":"Çoğu SSS'ye giremez."},{"q":"Osteojenik sarkom hücrelerine geçişi güç olduğu için azami dozda uygulanan ilaç hangisidir?","o":["Vinkristin","Metotreksat","Siklofosfamid","Bleomisin","Prednizon"],"a":1,"e":"Metotreksat."},{"q":"Tümör hücrelerinin ilaçlara duyarlılığıyla ilgili doğru ifade hangisidir?","o":["Hızlı üreyen tümör hücreleri daha duyarlıdır","Yavaş üreyen hücreler daha duyarlıdır","Tümör büyüdükçe duyarlılık artar","Üreme hızı duyarlılığı etkilemez","Tek hücre kalması sorun değildir"],"a":0,"e":"Hızlı üreyenler daha duyarlı; tümör büyüdükçe duyarlılık azalır."},{"q":"Antineoplastik tedavi etkinliğinin artırılmasını kısıtlayan en önemli etken hangisidir?","o":["Fiyat","Uygulama yolu","Tat","Toksisite","Raf ömrü"],"a":3,"e":"Kitap: önemli etken toksisitedir."},{"q":"Kemoterapiye daha iyi yanıt veren hasta hangisidir?","o":["Yatağa bağımlı hasta","İmmün yetmezlikli hasta","Günlük işlerini sürdürebilen, immünitesi normal hasta","Aynı anda radyoterapi alan hasta","Çoklu organ yetmezliği olan hasta"],"a":2,"e":"Hasta ile ilgili unsurlar."},{"q":"Antineoplastik ilaçların GİS epitelini tahrip etmesiyle görülen yan etki hangisidir?","o":["Stomatit, enterit ve ülser","Hipertansiyon","Hiperglisemi","Ototoksisite","Katarakt"],"a":0,"e":"Hızlı üreyen normal hücrelerin engellenmesi."},{"q":"Antikanser ilaçların İV uygulanışında doku içine sızması neye yol açabilir?","o":["Hipertrofi","Kalsifikasyon","Fibroz","Hiperpigmentasyon","Nekroz"],"a":4,"e":"Doku içine sızma nekroza neden olabilir."},{"q":"Baş ve burun tümörlerinde ameliyattan daha uygun olduğu belirtilen tedavi modeli hangisidir?","o":["Kriyoşirürji","Radyasyon","Bağışıklık uyarımı","Hormon tedavisi","Cerrahi"],"a":1,"e":"Radyasyon sağaltımı."},{"q":"Sıvı azotla soğutulmuş cerrahi mil ile hücrelerin dondurulduğu ve klasik cerrahiden daha az metastaza neden olan yöntem hangisidir?","o":["Radyoterapi","Elektrokoter","Lazer","Kriyoşirürji","Brakiterapi"],"a":3,"e":"Kriyoşirürji."},{"q":"Bağışıklık sistemini uyarma tedavisi hangi durumda fayda sağlamaz?","o":["Tümör çok küçükse","Hasta gençse","1 g dokuda kanser hücresi 10–100 binden fazlaysa","Monoklonal antikor kullanılırsa","Tümör sınırlıysa"],"a":2,"e":"Kitaptaki sınır."},{"q":"Cerrahi ve ışınla tümörün büyük kısmı alındıktan sonra kemoterapinin amacı nedir?","o":["Mikrometastazların önüne geçmek","Ağrıyı azaltmak","Tümörü büyütmek","Bağışıklığı baskılamak","Kan hücrelerini artırmak"],"a":0,"e":"Kemoterapi mikrometastazlar için ideal yöntemdir."},{"q":"Kitaba göre antikanser ilaçlar etki şekillerine göre kaç grupta toplanır?","o":["3","4","7","10","6"],"a":4,"e":"6 grup; alkilleyiciler kendi içinde 7 alt gruptur."},{"q":"DNA çift zincirine kovalent bağla bağlanarak etki eden antikanser grubu hangisidir?","o":["Antimetabolitler","Alkilleyici ilaçlar","Vinka alkaloidleri","Hormonlar","Asparaginaz"],"a":1,"e":"Alkilleyiciler."},{"q":"Hemorajik sistit yan etkisiyle bilinen, meme ve over kanserinde öncelikli alkilleyici ilaç hangisidir?","o":["Busulfan","Dakarbazin","Karmustin","Melfalan","Siklofosfamid"],"a":4,"e":"Siklofosfamid (oksazoforin)."},{"q":"Siklofosfamid alan hastaya yapılmaması gereken uygulama hangisidir?","o":["Antiemetik","Bol sıvı","Kan sayımı","Canlı aşı","Ağız bakımı"],"a":3,"e":"Siklofosfamid verilen hastalara canlı aşı uygulanmamalıdır."},{"q":"Kronik miyelositer lösemide kullanılan, uzun süreli kullanımda pulmoner fibroz yapabilen alkil sülfonat hangisidir?","o":["Siklofosfamid","Busulfan","Sisplatin","Dakarbazin","Altretamin"],"a":1,"e":"Busulfan."},{"q":"Şiddetli bulantı ve kusmaya neden olduğu belirtilen, Hodgkin ve malign melanomda kullanılan triazen hangisidir?","o":["Busulfan","Melfalan","Dakarbazin","Klorambusil","Lomustin"],"a":2,"e":"Dakarbazin."},{"q":"Hipoglisemi yapabilen nitrozoüre hangisidir?","o":["Streptozosin","Karmustin","Lomustin","Semustin","Busulfan"],"a":0,"e":"Streptozosin böbrek bozukluğu, hipoglisemi ve anemi yapabilir."},{"q":"Başlıca yan etkisi böbrek lezyonu olan, testis ve over tümörlerinde kullanılan organoplatin hangisidir?","o":["Vinkristin","Metotreksat","Doksorubisin","Prednizon","Sisplatin"],"a":4,"e":"Sisplatin ve karboplatin."},{"q":"Metotreksatın etki mekanizması nedir?","o":["DNA'yı alkilleme","Dihidrofolat redüktazı bloke ederek folik asit inhibisyonu","Mitotik iğcikleri bozma","Testosteron reseptörünü bloke etme","Topoizomeraz aktivasyonu"],"a":1,"e":"Dihidrofolat redüktaz blokajı."},{"q":"Metotreksatın doz sınırlayıcı başlıca yan etkisi hangisidir?","o":["Hemorajik sistit","Pulmoner fibroz","Lökopeni ve trombositopeni","Sıcak basması","Kardiyak aritmi"],"a":2,"e":"Doz sınırlayıcı: lökopeni ve trombositopeni."},{"q":"Miyelositer lösemi tedavisinde öncelikli olan pürin antagonistleri hangileridir?","o":["5-Fluorourasil ve sitarabin","Vinkristin ve vinblastin","Flutamid ve nilutamid","6-Merkaptopürin ve 6-tiyoguanin","Sisplatin ve karboplatin"],"a":3,"e":"Pü ","o":["Buserelin ve löprolid","Flutamid ve nilutamid","Estradiol valerat","Medroksiprogesteron","Prednizon"],"a":1,"e":"Flutamid ve nilutamid."},{"q":"Flutamid ve nilutamidin en önemli yan etkileri hangileridir?","o":["Pulmoner fibroz","Hemorajik sistit","Nörotoksisite","Sıcak basması, libido azalması, impotans","Gri sendrom"],"a":3,"e":"Kitaptaki yan etkiler."},{"q":"Antiöstrojenik etkileri nedeniyle endometriyum kanserinde etkili bulunan ilaçlar hangileridir?","o":["Progesteron türevleri (medroksiprogesteron)","Östrojen türevleri","Flutamid","Buserelin","Asparaginaz"],"a":0,"e":"Medroksiprogesteron asetat ve hidroksiprogesteron kaproat."},{"q":"Akut lenfoblastik lösemide kullanılan, akut pankreatit ve hipofibrinojenemi yapabilen enzim yapılı antikanser ilaç hangisidir?","o":["Hidroksiüre","Etoposid","Busulfan","Asparaginaz","Doksorubisin"],"a":3,"e":"Asparaginaz."},{"q":"Kronik tedavide hiperpigmentasyon ve hiperkeratoz yapabilen, kronik miyelositer lösemide etkili ilaç hangisidir?","o":["Asparaginaz","Teniposid","Heksametil melamin","Melfalan","Hidroksiüre"],"a":4,"e":"Hidroksiüre."},{"q":"Etoposid ve teniposid hangi grubun yarı sentetik türevleridir?","o":["Vinka alkaloidleri","Antrasiklinler","Podofilotoksinler","Nitrozoüreler","Organoplatinler"],"a":2,"e":"Podofilotoksinler."},{"q":"Antineoplastik ilaçların gonadlara etkisi sonucu ne gelişebilir?","o":["Hipertiroidi","Kısırlık","Diyabet","Obezite","Osteoporoz"],"a":1,"e":"Spermatogenez ve oogenez bozulur, kısırlık gelişebilir."}]});

</script><script>
U.push({"id":"u9","no":9,"title":"Otonom Sinir Sistemi İlaçları","kisa":"Nöromediyatörler, sempatik-parasempatik sistem, adrenerjik ve kolinerjik reseptörler, sempatomimetik, sempatolitik, parasempatomimetik, parasempatolitik ve gangliyon ilaçları","s":[{"h":"1. Sinirsel iletim ve kavramlar","b":"\n<p>Vücudu kontrol eden iki ana sistem sinir sistemi ve hormonal sistemdir. Sinir lifinde iletim elektriksel, sinir hücreleri arasında kimyasaldır.</p>\n<ul><li><b>Nöromediyatör (NM, transmiter):</b> Sinapsta salınıp karşı hücrenin reseptörüne etki eden madde: <b>NA, ACh, serotonin (5-HT), dopamin, histamin, GABA, glutamik asit, glisin, endorfinler</b>.</li>\n<li><b>Nöromodülatör:</b> Sinapstaki iletimi ayarlar. Omuriliğin arka boynuzunda ağrı iletiminde <b>P maddesi</b> rol alır; <b>enkefalinerjik</b> ara nöronlar P maddesi salınımını azaltıp ağrı algısını önler.</li>\n<li><b>Nörohormonlar:</b> Hipotalamustan ön hipofize gelen hipofizotropik hormonlar ile arka hipofizden salınan <b>oksitosin ve ADH</b>.</li></ul>\n<p><b>Otonom (vejetatif) sinir sistemi (OSS):</b> İstem dışı çalışan kalp, iç organlar, salgı bezleri ve damarları yönetir; <b>bilinç kontrolünde değildir</b>. OSS lifleri SSS'den çıktıktan sonra <b>gangliyonda</b> kesintiye uğrar: SSS–gangliyon arası <b>pregangliyoner</b>, gangliyon–organ arası <b>postgangliyoner</b> lif. Somatik motor sinirler kesintisiz olarak çizgili kasa gider; <b>somatik sistem bilinç kontrolündedir</b>. OSS'nin bütünleştirildiği merkez <b>hipotalamus</b>tur.</p>"},{"h":"2. Sempatik ve parasempatik sistem","b":"\n<table><tr><th></th><th>Sempatik</th><th>Parasempatik</th></tr>\n<tr><td>Çıkış yeri</td><td>Omuriliğin <b>torakal ve lomber</b> segmentleri</td><td><b>Beyin sapı (kraniyal) ve sakral</b> segmentler</td></tr>\n<tr><td>Gangliyon</td><td>Paravertebral zincir</td><td>Terminal gangliyonlar</td></tr>\n<tr><td>Görev</td><td><b>Stres yanıtı</b>, uyanıklık; taşikardi, kan basıncı artışı</td><td>Enerji üretimi ve korunması; normal koşulda baskın</td></tr>\n<tr><td>Pregangliyoner NM</td><td>ACh</td><td>ACh</td></tr>\n<tr><td>Postgangliyoner NM</td><td><b>NA</b> (adrenerjik)</td><td><b>ACh</b> (kolinerjik)</td></tr></table>\n<p>Böbrek üstü bezi medullası sempatik sistemle ilişkilidir; kana <b>adrenalin ve NA</b> salar. <b>Kan damarları yalnız sempatik kontrol altındadır.</b></p>\n<p><b>Reseptörler:</b> adrenerjik <b>alfa ve beta</b>; kolinerjik <b>muskarinik ve nikotinik</b> (efektör hücredekiler genellikle muskarinik).</p>\n<table><tr><th>Organ</th><th>Sempatik</th><th>Parasempatik</th></tr>\n<tr><td>Kalp</td><td>Kasılma gücü ve atış sayısı ↑</td><td>Atış sayısı ↓ (kasılma gücüne etkisi az)</td></tr>\n<tr><td>Damarlar</td><td>α: ven, arter, arteriyol kasılır; β: iskelet kası arterleri genişler</td><td>—</td></tr>\n<tr><td>Sindirim</td><td>Faaliyet ↓</td><td>Faaliyet, salgı, hareket ↑</td></tr>\n<tr><td>Göz</td><td>Pupilla <b>büyür</b> (midriyazis)</td><td>Pupilla <b>küçülür</b> (miyozis)</td></tr>\n<tr><td>Bronş</td><td><b>Gevşer</b></td><td><b>Kasılır</b></td></tr>\n<tr><td>Mesane</td><td>—</td><td>Kasılma ↑ → işeme</td></tr></table>"},{"h":"3. Sempatomimetik (adrenerjik) ilaçlar – katekolaminler","b":"\n<p>Sempatik sistemi taklit ederler. Örnek: adrenalin, dopamin, amfetamin, efedrin, ksilazin, salbutamol. <b>Katekolaminler:</b> NA, adrenalin, dopamin, izoprenalin; <b>izoprenalin dışındakiler vücutta sentezlenir</b>.</p>\n<div class=\"tip\">Kitap hatası: Adrenalin, NA, izoprenalin, dopamin ve dobutamin \"2.1. Katekolamin Olmayan Sempatomimetik İlaçlar\" başlığı altında yazılmış. Bunlar katekolaminlerdir; efedrin ve salbutamol ise gerçekten katekolamin olmayan gruptadır.</div>\n<p><b>Adrenalin:</b> Böbrek üstü medullasından salınır; α ve β'ya etki eder. <b>Düşük yoğunlukta β</b> (damar genişler, kan basıncı düşer), <b>yüksek yoğunlukta α</b> (damar daralır) etkisi baskındır. Kalbin kasılma gücü ve hızı artar → kan basıncı yükselir → refleks bradikardi. Mesane ve sindirim kaslarını gevşetir, sfinkterleri kasar, <b>bronşları gevşetir</b>, uterus kasılmasını azaltır, O₂ ihtiyacını, glukoz ve laktat üretimini artırır.</p>\n<ul><li><b>Endikasyon:</b> <b>anafilaktik şok</b>, astım ve amfizem (aerosol), nazal konjesyon, kronik açılı glokom, burun kanaması, <b>lokal anesteziklere katılarak emilimi azaltma</b>, kardiyak arrestte İV/intrakardiyak.</li>\n<li><b>Yan etki:</b> asabiyet, tremor, çarpıntı, baş ağrısı; yüksek dozda <b>beyin kanaması</b>.</li>\n<li><b>Uygulanmaz/KE:</b> hipertansiyon, hipertiroidi, koroner yetmezlik, ritim bozukluğu, yeni MI, <b>halotan ve siklopropan anestezisi</b>.</li></ul>\n<p><b>Noradrenalin:</b> Sempatik postgangliyoner uçlardan salınır; kalpte β1 ve damarda α reseptörleri uyarır. <b>Kan basıncını artırıcı etkisi adrenalinden 1,5 kat fazladır</b>; refleks olarak kalp hızı azalır. Endikasyon: anestezide hipotansiyon, şokta <b>izotonik glukoz içinde İV perfüzyon</b>. Yan etki: konvülsiyon, beyin kanaması, aritmi; <b>ekstravazasyonda cilt nekrozu</b>.</p>\n<p><b>İzoprenalin:</b> β etkili; damar genişler, kan basıncı düşer, kalp hızı-debisi-kasılması artar, bronş gevşer. Kardiyak şokta İV; astımda bronş genişletici (bu etkiye tolerans gelişir); <b>kalp bloğunda</b>.</p>\n<p><b>Dopamin:</b> Sinir uçlarında ve SSS'de NM; α, β1 ve santral dopamin reseptörleri. <b>Düşük dozda böbrek ve iç organ damarlarını genişletir</b>, yüksek dozda daraltır. İV: septik, hipovolemik, kardiyojenik şok; refrakter kalp yetmezliği; açık kalp ameliyatı sonrası düşük debi. Yan etki: taşikardi, ekstrasistol, AF, anjina.</p>\n<p><b>Dobutamin:</b> β1 etkili; kalp hızı ve kasılma gücünü artırır; <b>konjestif kalp yetmezliği</b>. AF yapabilir. <b>KE: MI ve aort stenozu.</b></p>"},{"h":"4. Katekolamin olmayan sempatomimetikler ve kullanım alanları","b":"\n<ul><li><b>Efedrin:</b> postgangliyoner uçtan <b>NA salınımı</b> yaptırır. Bronş genişletici, burun tıkanıklığı, gece işemesi, uyanıklık, spinal anestezi, midriyatik; SSS uyarıcısı olduğu için <b>doping</b>. Hipertiroidi ve kalp hastalığında dikkat. Burun damlasında etki bitince <b>rebound burun tıkanıklığı</b>.</li>\n<li><b>β agonistler:</b> bronkospazm ve astım; orsiprenalin (Alupent), terbutalin (Bricanyl). <b>Ritodrin erken doğumu durdurur</b> (uterus β2). Nilidrin (Dilatol) damar genişletici.</li>\n<li><b>Salbutamol (Ventolin):</b> bronş <b>β2</b> reseptörlerini seçici uyarır. Astım, <b>KOAH</b>, bronkospazm. KE: aritmi, taşikardi, beta bloker kullanımı, akut MI.</li></ul>\n<table><tr><th>Kullanım</th><th>İlaç</th></tr>\n<tr><td>Kan basıncı düşmesi</td><td>Efedrin, fenilefrin, NA, adrenalin</td></tr>\n<tr><td>Kanama durdurma (topikal, burun, diş çekimi, ameliyat)</td><td>Adrenalin</td></tr>\n<tr><td>Nezlede burun şişliği</td><td>Alifatik aminler</td></tr>\n<tr><td>Lokal anestezik süresini uzatma</td><td>Adrenalin eklenmesi</td></tr>\n<tr><td>Çevre damar hastalığı</td><td>Bametan</td></tr>\n<tr><td>Refleks vagal tonusu artırma (sinüs/atriyum taşikardisi)</td><td>Metoksamin, fenilefrin</td></tr>\n<tr><td>Erken doğumu önleme</td><td><b>Ritodrin</b></td></tr>\n<tr><td>Göz muayenesi (midriyazis), geniş açılı glokom</td><td>Efedrin, adrenalin, amfetamin</td></tr>\n<tr><td>Narkolepsi</td><td>Amfetamin, pemolin</td></tr>\n<tr><td>Kardiyojenik şok</td><td>NA</td></tr>\n<tr><td>Hipovolemik şok (sıvıya rağmen hipotansiyon)</td><td>Adrenalin, dobutamin</td></tr>\n<tr><td>Septik şok</td><td><b>Dopamin</b></td></tr>\n<tr><td><b>Anafilaktik şok</b></td><td><b>Adrenalin (hayat kurtarıcı)</b></td></tr>\n<tr><td>Kalp durması</td><td>Masaj sonrası İV adrenalin; olmazsa intrakardiyak adrenalin/NA</td></tr>\n<tr><td>Kalp bloğu</td><td>İzoprenalin</td></tr>\n<tr><td>MI'ya bağlı ve dirençli kalp yetmezliği</td><td>Dopamin, dobutamin</td></tr></table>\n<div class=\"tip\">Kitapta \"kan basıncının yükselmesi\" başlığında α-metildopa ve klonidin geçiyor; bunlar kan basıncını düşürmek için (antihipertansif) kullanılır.</div>"},{"h":"5. Sempatolitik (adrenerjik blokör) ilaçlar","b":"\n<p><b>α-Blokörler:</b> damar düz kasını gevşetip kan basıncını düşürür. Yan etki: <b>ortostatik hipotansiyon</b>, refleks taşikardi, tuz-su tutulumuna bağlı tolerans. Fentolamin (Regitin), fenoksibenzamin (Dibenzyline), <b>prazosin</b> (antihipertansif).</p>\n<p><b>Ergot alkaloidleri:</b> α'da parsiyel agonist, doğrudan damar büzücü. <b>Ergotamin tartrat</b> migren tedavisi; <b>metiserjid</b> migren profilaksisi; <b>ergonovin maleat</b> güçlü oksitosik etki, doğum sonu kanamayı durdurur. Yan etki: kusma, ekstremite uçlarında <b>gangren</b>.</p>\n<p><b>β-Blokörler:</b> Kalbin kasılma gücü, hızı, O₂ kullanımı ve kan basıncı azalır; <b>bronş düz kasları kasılır</b>.</p>\n<ul><li><b>Endikasyon:</b> hipertansiyon, angina, aritmi, MI, anksiyete, hipertiroidi, migren profilaksisi, göz tansiyonu.</li>\n<li><b>Yan etki:</b> kalp yetmezliği riski; <b>ani kesilmemeli</b> (aritmi, angina, MI); <b>astımda bronkospazm</b>; insülinin hipoglisemik etkisini artırır → diyabetlide <b>hipoglisemi</b>; ilaç ateşi; depresyon, yorgunluk, cinsel işlev bozukluğu; Raynaud.</li></ul>\n<p><b>Adrenerjik nöron blokörleri:</b> sinir ucundaki faaliyeti önler; hipertansiyonda.</p>"},{"h":"6. Parasempatomimetikler ve antikolinesterazlar","b":"\n<p><b>Etkiler:</b> Kalp hızı ve kasılması azalır, damar genişler, kan basıncı düşer. Sindirim salgı ve hareketleri artar. Üreter, uterus, bronş ve mesane düz kası kasılır. Tükürük, gözyaşı, ter artar. <b>Miyozis</b> olur.</p>\n<ul><li><b>Endikasyon:</b> GİS ve mesane atonisi, <b>glokom</b>, kas gevşetici etkisini sonlandırma, antikolinerjik/trisiklik/atropin zehirlenmesi, <b>miyastenia gravis</b>.</li>\n<li><b>Yan etki:</b> GİS bozukluğu, terleme, burun akıntısı, görme bozukluğu, nefes darlığı.</li>\n<li><b>KE:</b> peptik ülser, üriner/GİS mekanik tıkanıklık, <b>bronşiyal astım</b>, hipertiroidi, koroner hastalık.</li></ul>\n<p><b>Antikolinesterazlar:</b> ACh yıkımını engelleyip etkisini artırır. <b>Neostigmin</b> (Prostigmine), <b>fizostigmin</b>, <b>edrofonyum</b> (Tensilon), <b>piridostigmin</b> (Mestinon).</p>\n<div class=\"tip\"><b>Organofosfatlı insektisit zehirlenmesi:</b> parasempatik etkiler artar: GİS belirtileri, bronş-tükürük-burun salgısı artışı, miyozis, bronkospazm, <b>bradikardi</b>, hipotansiyon, kas seyirmesi, konvülsiyon. Tedavi: <b>atropin</b> + kolinesterazı reaktive eden <b>pralidoksim, obidoksim</b>.</div>"},{"h":"7. Parasempatolitikler (antikolinerjikler)","b":"\n<p>Muskarinik ACh reseptörlerini yarışmalı olarak kapatırlar: <b>atropin, skopolamin, pirenzepin</b>.</p>\n<p><b>Etkiler:</b> taşikardi; üreter, mesane ve GİS düz kaslarında gevşeme (<b>spazmolitik</b>); <b>midriyazis</b>; gözyaşı, tükürük, ter, sindirim ve solunum salgısında azalma; bronkodilatasyon.</p>\n<ul><li><b>Endikasyon:</b> göz muayenesinde midriyazis, <b>anestezi öncesi solunum salgısını azaltma</b>, MI sonrası aritmi, taşıt tutması, peptik ülser, karın krampı ve diyare, <b>enürezis nokturna</b>, kolinerjik ve mantar zehirlenmesi.</li>\n<li><b>Yan etki ve uyarı:</b> taşikardi, ışığa hassasiyet, midriyazis, <b>ağız kuruluğu</b>, vücut ısısında artış ve deride kızarıklık. <b>Prostat büyümesi ve glokomda kullanılmaz.</b></li></ul>\n<p><b>Atropin:</b> Kardiyak debi ve kalp hızını artırır, A-V iletiyi hızlandırır, barsak hareketini yavaşlatır, mesaneyi gevşetir, bronkodilatasyon, midriyazis ve <b>akomodasyon felci (siklopleji)</b> yapar.</p>\n<ul><li><b>Endikasyon:</b> asistol; <b>semptomatik sinüs bradikardisi</b> (erişkinde istirahatte <b>&lt;60/dk</b>); <b>organofosfat zehirlenmesi</b>; barsak ve pilor spazmı; peptik ülser; astım; gripte burun salgısını azaltma; <b>cerrahide vagusun kalbi durdurma etkisini önleme</b>; morfinin kusturucu etkisini azaltma; Parkinson.</li>\n<li><b>KE:</b> taşiaritmi, kalp yetmezliği, akut MI, <b>dar açılı glokom</b>, tirotoksikoz, tıkayıcı GİS ve üriner hastalık.</li>\n<li><b>Atropin zehirlenmesinin spesifik antidotu fizostigmindir.</b></li></ul>\n<p><b>Skopolamin (Antinozan):</b> taşıt tutmasında.</p>"},{"h":"8. Otonom gangliyonlara etkili ilaçlar","b":"\n<ul><li><b>Nikotin:</b> SSS'yi uyarır: düşük dozda titreme, yüksek dozda konvülsiyon. Solunumu önce uyarır, yüksek dozda baskılar. Taşikardi, kan basıncı artışı, barsak hareketinde artış; salgıları önce artırır sonra azaltır. Deri, ağız mukozası ve solunum yolundan emilir; KC, akciğer ve böbrekte yıkılır. <b>Plasenta ve süte yüksek oranda geçer.</b> <b>Tedavide kullanılmaz.</b> Kronik zarar: kanser, solunum ve kalp-damar hastalıkları. İnsektisid etkisi vardır.</li>\n<li><b>Trimetafan kamsilat ve heksametonyum:</b> otonom <b>gangliyonları bloke eder</b>. Hipertansif kriz, <b>kontrollü hipotansiyon</b>, ameliyatta kanama kontrolü, konjestif kalp yetmezliğinde akciğer ödemini azaltma.</li></ul>\n<div class=\"tip\">Bölüm 6 (MSS ilaçları) dosyada yalnızca giriş sayfasıyla var; programa alınmadı.</div>"}],"q":[{"q":"Aşağıdakilerden hangisi nöromediyatör değildir?","o":["Noradrenalin","Oksitosin","Asetilkolin","Dopamin","GABA"],"a":1,"e":"Oksitosin ve ADH arka hipofizden salınan nörohormonlardır."},{"q":"Arka hipofizden salıverilen nörohormonlar hangileridir?","o":["Oksitosin ve ADH","ACTH ve TSH","Prolaktin ve GH","LH ve FSH","Adrenalin ve NA"],"a":0,"e":"Hipotalamustan arka hipofize gelen sinir uçlarından salınır."},{"q":"Omuriliğin arka boynuzunda ağrılı uyarının iletiminde rol oynayan madde hangisidir?","o":["GABA","Glisin","P maddesi","Dopamin","Histamin"],"a":2,"e":"Enkefalinerjik ara nöronlar P maddesi salınımını azaltır."},{"q":"Otonom sinir sisteminin bütünleştirildiği merkez neresidir?","o":["Beyincik","Talamus","Korteks","Omurilik","Hipotalamus"],"a":4,"e":"Hipotalamus."},{"q":"SSS ile gangliyon arasındaki otonom sinir lifine ne ad verilir?","o":["Postgangliyoner lif","Somatik lif","Afferent lif","Pregangliyoner lif","Motor lif"],"a":3,"e":"Gangliyonla organ arası postgangliyoner liftir."},{"q":"Sempatik sinir sistemi omuriliğin hangi segmentlerinden çıkar?","o":["Kraniyal ve sakral","Torakal ve lomber","Servikal","Yalnız sakral","Yalnız kraniyal"],"a":1,"e":"Parasempatik: kraniyal ve sakral."},{"q":"Sempatik postgangliyoner sinir ucundan salınan nörotransmiter hangisidir?","o":["Asetilkolin","Dopamin","Noradrenalin","Serotonin","Histamin"],"a":2,"e":"Pregangliyonerlerde ve parasempatik postgangliyonerde ACh."},{"q":"Parasempatik postgangliyoner sinir ucundan salınan nörotransmiter hangisidir?","o":["Noradrenalin","Adrenalin","Dopamin","Asetilkolin","GABA"],"a":3,"e":"Kolinerjik sistem."},{"q":"Yalnızca sempatik sistemin kontrolünde olan yapı hangisidir?","o":["Kan damarları","Kalp","Göz bebeği","Mesane","Solunum yolu"],"a":0,"e":"Kan damarları sempatik yapının kontrolündedir."},{"q":"Sempatik uyarımın göze etkisi nedir?","o":["Göz bebeğini küçültür","Gözyaşını artırır","Akomodasyonu artırır","Etkisi yoktur","Göz bebeğini büyütür (midriyazis)"],"a":4,"e":"Parasempatik ise küçültür."},{"q":"Parasempatik uyarımın solunum sistemine etkisi nedir?","o":["Bronş düz kaslarını kasar","Bronşları gevşetir","Solunumu durdurur","Etkisi yoktur","Salgıyı azaltır"],"a":0,"e":"Sempatik gevşetir, parasempatik kasar."},{"q":"Adrenerjik reseptörler hangi alt gruplara ayrılır?","o":["Muskarinik ve nikotinik","D1 ve D2","H1 ve H2","Alfa ve beta","Mu ve kappa"],"a":3,"e":"Kolinerjikler muskarinik ve nikotinik."},{"q":"Katekolaminlerden hangisi vücutta sentezlenmez?","o":["Noradrenalin","İzoprenalin","Adrenalin","Dopamin","Hepsi sentezlenir"],"a":1,"e":"İzoprenalin dışındakiler bedende sentezlenir."},{"q":"Adrenalinin düşük ve yüksek dozdaki etkileri için doğru ifade hangisidir?","o":["Düşük dozda alfa, yüksek dozda beta baskındır","Her dozda yalnız alfa etkilidir","Düşük dozda beta, yüksek dozda alfa etkisi baskındır","Her dozda yalnız beta etkilidir","Dozla etkisi değişmez"],"a":2,"e":"Eser dozda damar genişler, yüksek dozda daralır."},{"q":"Anafilaktik şokta hayat kurtarıcı ilaç hangisidir?","o":["Dopamin","Atropin","Noradrenalin","Dobutamin","Adrenalin"],"a":4,"e":"Damarları daraltır, solunum yollarını genişletir."},{"q":"Lokal anestezik preparatlarına adrenalin eklenmesinin amacı nedir?","o":["Emilimi azaltıp anestezi süresini uzatmak","Ağrıyı artırmak","Kanamayı artırmak","Alerjiyi önlemek","İlacın tadını düzeltmek"],"a":0,"e":"Damar daraltıcı etkiyle emilim ve BT yavaşlar."},{"q":"Adrenalin kullanımında kontrendike olan durum hangisidir?","o":["Anafilaktik şok","Kardiyak arrest","Halotan anestezisi","Astım krizi","Burun kanaması"],"a":2,"e":"Halotan ve siklopropan ile birlikte verilmez; hipertansiyon, hipertiroidi ve koroner yetmezlikte de verilmez."},{"q":"Noradrenalinin kan basıncını artırıcı etkisi adrenaline göre nasıldır?","o":["Yarısı kadardır","Eşittir","10 kat fazladır","1,5 kat fazladır","Hiç etkisi yoktur"],"a":3,"e":"Kitap: NA'nın kan basıncını artırıcı etkisi adrenalinden 1,5 kez fazladır."},{"q":"Noradrenalin İV perfüzyonla verilirken ekstravazasyon gelişirse ne olabilir?","o":["Hipoglisemi","Bradikardi","Ödem çözülmesi","Hiçbir şey olmaz","Cilt nekrozu"],"a":4,"e":"Damar dışına kaçırılması cilt nekrozu yapar."},{"q":"Şokta noradrenalin hangi solüsyon içinde verilir?","o":["Sodyum bikarbonat","İzotonik glukoz","Laktatlı Ringer","Mannitol","Distile su"],"a":1,"e":"İzotonik glukoz solüsyonu içinde İV perfüzyon."},{"q":"Düşük dozda böbrek ve iç organ damarlarını genişleten, septik şokta kullanılan katekolamin hangisidir?","o":["Noradrenalin","İzoprenalin","Efedrin","Dopamin","Fenilefrin"],"a":3,"e":"Dopamin."},{"q":"Konjestif kalp yetmezliğinde kullanılan, MI ve aort stenozunda kontrendike olan β1 agonist hangisidir?","o":["Dobutamin","Salbutamol","Ritodrin","Efedrin","Terbutalin"],"a":0,"e":"Dobutamin."},{"q":"Kalp bloğunda kullanılan sempatomimetik ilaç hangisidir?","o":["Ergotamin","Prazosin","Ritodrin","Bametan","İzoprenalin"],"a":4,"e":"Kalp bloğunda izoprenalin (izoproterenol)."},{"q":"Postgangliyoner liflerden NA salınımına neden olan, doping amacıyla da kötüye kullanılan ilaç hangisidir?","o":["Salbutamol","Dobutamin","Efedrin","Ritodrin","Atropin"],"a":2,"e":"Efedrin."},{"q":"Burun damlası olarak kullanılan efedrinin etkisi bittikten sonra görülen sorun nedir?","o":["Burun kanaması","Burun tıkanıklığının yeniden ortaya çıkması","Koku kaybı","Burun akıntısının durması","Sinüzit"],"a":1,"e":"Rebound tıkanıklık."},{"q":"Uterustaki β2 reseptörlere etki ederek erken doğumu durduran ilaç hangisidir?","o":["Ritodrin","Ergonovin","Oksitosin","Efedrin","Fentolamin"],"a":0,"e":"Ritodrin."},{"q":"Salbutamolün (Ventolin) etki mekanizması nedir?","o":["Muskarinik reseptörleri bloke etmek","Alfa reseptörleri uyarmak","Bronşlardaki β2 reseptörlerini seçici uyarmak","Fosfodiesterazı inhibe etmek","Histamin reseptörlerini bloke etmek"],"a":2,"e":"β2 seçici agonist."},{"q":"Salbutamolün kontrendikasyonları arasında hangisi yer alır?","o":["Astım","KOAH","Bronkospazm","Beta bloker kullanımı","Alerjik rinit"],"a":3,"e":"Kardiyak aritmi, taşikardi, beta bloker kullanımı, AMI."},{"q":"Çevre damarlarının dolaşım bozukluğunda kullanılan sempatomimetik hangisidir?","o":["Ritodrin","Bametan","Ergotamin","Fentolamin","Klonidin"],"a":1,"e":"Bametan."},{"q":"Narkolepsi tedavisinde kullanılan ilaçlar hangileridir?","o":["Atropin, skopolamin","Propranolol, atenolol","Neostigmin, fizostigmin","Prazosin, fentolamin","Amfetamin, pemolin"],"a":4,"e":"Amfetamin ve pemolin."},{"q":"α-adrenerjik blokörlerin en önemli yan etkisi hangisidir?","o":["Bradikardi","Bronkospazm","Hipoglisemi","Ortostatik hipotansiyon","Miyozis"],"a":3,"e":"Ortostatik hipotansiyon ve refleks taşikardi."},{"q":"Migren tedavisinde kullanılan ergot alkaloidi hangisidir?","o":["Ergonovin maleat","Ergotamin tartrat","Prazosin","Fentolamin","Metoprolol"],"a":1,"e":"Metiserjid ise migren profilaksisinde."},{"q":"Doğum sonrası kanamayı durdurmak amacıyla kullanılan, güçlü oksitosik etkili ergot alkaloidi hangisidir?","o":["Ergotamin tartrat","Metiserjid","Bametan","Ritodrin","Ergonovin maleat"],"a":4,"e":"Ergonovin maleat."},{"q":"Ergot alkaloidlerinin güçlü damar daraltıcı <tr><td>Kolin geri alımı blokajı</td><td>Hemikolinium</td></tr></table>`},
{h:'Kitaptaki tutarsızlıklar ve dikkat noktaları',b:`<ul>
<li><b>TB tedavi süresi:</b> girişte "en az 9 ay", hemen ardından "toplam 6 ay, inatçı olguda 9 ay".</li>
<li><b>Pirazinamid</b> minör ilaç sayıldığı halde standart üçlüde yer alıyor.</li>
<li><b>Metronidazol:</b> bakteriyostatik listesinde var, ama kendi bölümünde "hızlı bakteri öldürücü" deniyor.</li>
<li><b>Mikonazol</b> (antifungal) bakteriyostatik listesinde geçiyor; <b>amfoterisin B</b> bakterisid listesinde "fungisid" notuyla geçiyor.</li>
<li><b>Sikloserin:</b> bir yerde "artık kullanılmıyor", TB bölümünde "dirençli olguda kullanılır".</li>
<li><b>Tetrasiklin:</b> "30S ve 50S alt birimine bağlanır" yazıyor.</li>
<li><b>Katekolaminler</b> (adrenalin, NA, izoprenalin, dopamin, dobutamin) "Katekolamin Olmayan" başlığı altında yazılmış.</li>
<li>"Kan basıncının yükselmesi" başlığında α-metildopa ve klonidin geçiyor; bunlar antihipertansiftir.</li>
<li><b>Parasetamol + aspirin sumasyon</b> örneği karışık yazılmış.</li>
<li><b>Erişkin dozu:</b> Bölüm 1'de 50–100 kg / 16–60 yaş, Bölüm 2'de 70 kg.</li>
<li><b>Rifampisin</b> hem 16. bölümde hem TB bölümünde aynı bilgilerle tekrar ediyor.</li>
<li>Penisilin G ve V aynı grupta "aside duyarlı" diye verilmiş.</li>
<li>Numaralama hataları: "16. İlaç Alerjisi" altında 15.1–15.2; antiamibiklerde "2.6 Klorokin fosfat"; enzim başlıklarında 7.2 ve zar geçişinde 1.4.4 yok.</li></ul>`},
{h:'Dosyada olmayan sayfalar',b:`<ul>
<li>Kitap sayfaları <b>47, 66, 81, 145–147 ve 167</b> dosyada yok. Bölüm sonlarına denk geldikleri için büyük olasılıkla kaynakça ya da boş sayfalardır; konu akışında kopukluk yok.</li>
<li><b>Bölüm 6 – MSS ilaçları</b> yalnızca giriş sayfasıyla (s. 168) var; bu bölümden soru hazırlanmadı.</li>
<li>PDF'te resim, şema veya tablo görseli yok; tüm bilgiler metinden alındı.</li></ul>`}
];

</script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const V=$('#view');
const L='ABCDE';
const KEY='farma_vize_yanlis_v1';
const ALL=[];U.forEach(u=>u.q.forEach((q,i)=>ALL.push({u,i,id:u.id+'-'+i,q})));
const byId={};ALL.forEach(x=>byId[x.id]=x);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// Yanlışlarım (localStorage, hata olursa bellekte tutulur)
let memW=[];
function getW(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[];}catch(e){return memW;}}
function setW(a){memW=a;try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
function markW(id,ok){let w=getW().filter(x=>byId[x]);if(ok)w=w.filter(x=>x!==id);else if(!w.includes(id))w.push(id);setW(w);}
function setNav(k){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));}
function title(t){$('#title').textContent=t;}

function home(){
  setNav('konu');title('Farmakoloji Vize');
  const w=getW().length;
  V.innerHTML=`<div class="card"><b>${U.length} ünite · ${ALL.length} soru.</b><div class="meta">Kaynak: Farmakoloji 2. Cilt, Bölüm 1–5 (s. 27–166). Şıklar her açılışta karışır.${w?` Yanlışlarım listesinde <b>${w}</b> soru var.`:''}</div></div>`+
  U.map(u=>`<a class="card unit" href="#u-${u.id}"><div class="no">${u.no}</div><div><h3>${esc(u.title)}</h3><p>${esc(u.kisa)}</p><div class="meta">${u.s.length} bölüm · ${u.q.length} soru</div></div></a>`).join('');
}
function unit(id){
  const u=U.find(x=>x.id===id);if(!u)return home();
  setNav('konu');title('Ünite '+u.no);
  V.innerHTML=`<h2>${u.no}. ${esc(u.title)}</h2>
  <div class="toc">${u.s.map((s,i)=>`<a href="#" data-j="s${i}">${esc(s.h)}</a>`).join('')}</div>
  ${u.s.map((s,i)=>`<div class="card sec" id="s${i}"><h3>${esc(s.h)}</h3>${s.b}</div>`).join('')}
  <div class="card"><b>Bu ünitenin soruları (${u.q.length})</b><div class="row" style="margin-top:8px"><a class="btn" href="#t-${u.id}">Anında geri bildirimle çöz</a><a class="btn sec2" href="#te-${u.id}">Sınav modunda çöz</a></div></div>`;
  V.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.j).scrollIntoView({behavior:'smooth',block:'start'});});
  scrollTo(0,0);
}
function tekrar(){
  setNav('tekrar');title('Hızlı tekrar');
  V.innerHTML=`<h2>Hızlı tekrar</h2><div class="toc">${TEKRAR.map((t,i)=>`<a href="#" data-j="t${i}">${esc(t.h)}</a>`).join('')}</div>`+TEKRAR.map((t,i)=>`<div class="card sec" id="t${i}"><h3>${esc(t.h)}</h3>${t.b}</div>`).join('');
  V.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.j).scrollIntoView({behavior:'smooth'});});
  scrollTo(0,0);
}
function denemeSetup(){
  setNav('deneme');title('Deneme sınavı');
  V.innerHTML=`<h2>Deneme sınavı</h2><div class="card">
  <b>Soru sayısı</b><div class="choice" id="cnt">${[20,40,60,100,'Tümü'].map((n,i)=>`<label><input type="radio" name="n" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}</div>
  <b>Mod</b><div class="choice"><label><input type="radio" name="m" value="exam" checked><span>Sınav modu (sonda sonuç)</span></label><label><input type="radio" name="m" value="instant"><span>Anında geri bildirim</span></label></div>
  <b>Üniteler</b><div class="ulist">${U.map(u=>`<label><input type="checkbox" value="${u.id}" checked> <span>${u.no}. ${esc(u.title)} <span class="meta">(${u.q.length})</span></span></label>`).join('')}</div>
  <button class="btn full" id="go">Başlat</button><div class="meta">Sorular ünitelerin soru sayısına göre ağırlıklı ve rastgele seçilir.</div></div>`;
  $('#go').onclick=()=>{
    const ids=[...V.querySelectorAll('.ulist input:checked')].map(x=>x.value);
    if(!ids.length){$('#go').textContent='En az bir ünite seçin';return;}
    const nv=V.querySelector('input[name=n]:checked').value,mode=V.querySelector('input[name=m]:checked').value;
    const us=U.filter(u=>ids.includes(u.id));const tot=us.reduce((s,u)=>s+u.q.length,0);
    const N=nv==='Tümü'?tot:Math.min(+nv,tot);
    let quota=us.map(u=>({u,k:Math.floor(N*u.q.length/tot),r:(N*u.q.length/tot)%1}));
    let rest=N-quota.reduce((s,x)=>s+x.k,0);
    quota.slice().sort((a,b)=>b.r-a.r).slice(0,rest).forEach(x=>x.k++);
    let list=[];quota.forEach(x=>{list=list.concat(shuf(x.u.q.map((q,i)=>byId[x.u.id+'-'+i])).slice(0,x.k));});
    quiz(shuf(list),mode,'Deneme ('+N+' soru)');
  };
}
function yanlis(){
  setNav('yanlis');title('Yanlışlarım');
  const w=getW().filter(x=>byId[x]);
  if(!w.length){V.innerHTML=`<h2>Yanlışlarım</h2><div class="card empty">Henüz yanlış soru yok. Yanlış cevapladığın sorular buraya eklenir; doğru cevaplayınca listeden çıkar.</div>`;return;}
  const g={};w.forEach(id=>{const x=byId[id];(g[x.u.id]=g[x.u.id]||[]).push(x);});
  V.innerHTML=`<h2>Yanlışlarım (${w.length})</h2><div class="card"><button class="btn full" id="gw">Hepsini tekrar çöz</button><button class="btn sec2 full" id="cw">Listeyi temizle</button></div>`+
  Object.keys(g).map(k=>{const u=U.find(x=>x.id===k);return `<div class="card"><b>${u.no}. ${esc(u.title)}</b> <span class="meta">(${g[k].length})</span><ul>${g[k].map(x=>`<li style="font-size:14px">${esc(x.q.q)}</li>`).join('')}</ul></div>`;}).join('');
  $('#gw').onclick=()=>quiz(shuf(w.map(id=>byId[id])),'instant','Yanlışlarım');
  $('#cw').onclick=function(){if(this.dataset.c){setW([]);yanlis();}else{this.dataset.c=1;this.textContent='Emin misin? Silmek için tekrar dokun';}};
}
// Soru motoru
function quiz(list,mode,name){
  title(name);
  const S=list.map(x=>({x,perm:shuf([0,1,2,3,4]),pick:null,done:false}));
  let cur=0;
  function draw(){
    const s=S[cur],q=s.x.q;
    const ansd=S.filter(z=>z.pick!==null).length;
    let h=`<div class="qnum"><span>Soru ${cur+1} / ${S.length}</span><span>${mode==='exam'?ansd+' cevaplandı':S.filter(z=>z.done&&z.pick===z.x.q.a).length+' doğru'}</span></div><div class="bar"><i style="width:${(cur+1)/S.length*100}%"></i></div>
    <div class="card"><span class="tag">Ünite ${s.x.u.no}</span><div class="qtext">${esc(q.q)}</div>`;
    s.perm.forEach((oi,k)=>{
      let c='';
      if(mode==='instant'&&s.done){if(oi===q.a)c='ok';else if(oi===s.pick)c='bad';}
      else if(s.pick===oi)c='sel';
      h+=`<button class="opt ${c}" data-o="${oi}"><b>${L[k]})</b><span>${esc(q.o[oi])}</span></button>`;
    });
    if(mode==='instant'&&s.done){const ok=s.pick===q.a;h+=`<div class="exp ${ok?'ok':'bad'}"><b>${ok?'Doğru.':'Yanlış. Doğru cevap: '+L[s.perm.indexOf(q.a)]+')'}</b> ${esc(q.e)}</div>`;}
    h+=`</div><div class="row">`;
    if(cur>0)h+=`<button class="btn sec2" id="pv">← Önceki</button>`;
    if(cur<S.length-1)h+=`<button class="btn" id="nx" style="flex:1">Sonraki →</button>`;
    else h+=`<button class="btn" id="fin" style="flex:1">Bitir</button>`;
    h+=`</div>`;
    if(mode==='exam')h+=`<div class="dots">${S.map((z,i)=>`<button data-g="${i}" class="${z.pick!==null?'ans':''} ${i===cur?'cur':''}">${i+1}</button>`).join('')}</div>`;
    V.innerHTML=h;
    V.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const oi=+b.dataset.o;
      if(mode==='instant'){if(s.done)return;s.pick=oi;s.done=true;markW(s.x.id,oi===q.a);}
      else s.pick=oi;
      draw();
    });
    const pv=$('#pv'),nx=$('#nx'),fin=$('#fin');
    if(pv)pv.onclick=()=>{cur--;draw();scrollTo(0,0);};
    if(nx)nx.onclick=()=>{cur++;draw();scrollTo(0,0);};
    if(fin)fin.onclick=function(){const bos=S.filter(z=>z.pick===null).length;if(mode==='exam'&&bos&&!this.dataset.c){this.dataset.c=1;this.textContent=bos+' boş soru var · yine de bitir';return;}finish();};
    V.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{cur=+b.dataset.g;draw();});
  }
  function finish(){
    if(mode==='exam')S.forEach(z=>{if(z.pick!==null)markW(z.x.id,z.pick===z.x.q.a);});
    const dog=S.filter(z=>z.pick===z.x.q.a).length,bos=S.filter(z=>z.pick===null).length;
    const pu={};S.forEach(z=>{const k=z.x.u.id;pu[k]=pu[k]||{u:z.x.u,t:0,d:0};pu[k].t++;if(z.pick===z.x.q.a)pu[k].d++;});
    const wr=S.filter(z=>z.pick!==z.x.q.a);
    V.innerHTML=`<div class="card" style="text-align:center"><div class="meta">${esc(name)}</div><div class="score">${Math.round(dog/S.length*100)}%</div><div>${dog} doğru · ${S.length-dog-bos} yanlış · ${bos} boş</div></div>
    <div class="card"><b>Ünite bazlı başarı</b>${Object.values(pu).sort((a,b)=>a.u.no-b.u.no).map(p=>`<div class="ures"><span>${p.u.no}. ${esc(p.u.title.split(':')[0])}</span><b>${p.d}/${p.t} (${Math.round(p.d/p.t*100)}%)</b></div>`).join('')}</div>
    ${wr.length?`<h2>Yanlış ve boş sorular (${wr.length})</h2>`+wr.map(z=>{const q=z.x.q;return `<div class="card"><span class="tag">Ünite ${z.x.u.no}</span><div class="qtext" style="font-size:15.5px">${esc(q.q)}</div>${z.pick!==null?`<div class="opt bad"><b>✗</b><span>${esc(q.o[z.pick])}</span></div>`:'<div class="meta">Boş bırakıldı</div>'}<div class="opt ok"><b>✓</b><span>${esc(q.o[q.a])}</span></div><div class="exp">${esc(q.e)}</div></div>`;}).join(''):''}
    <div class="row"><a class="btn" href="#deneme">Yeni deneme</a><a class="btn sec2" href="#yanlis">Yanlışlarım</a></div>`;
    scrollTo(0,0);
  }
  draw();scrollTo(0,0);
}
function route(){
  const raw=location.hash.replace(/^#\/?/,'');const m=raw.match(/^(u|t|te)-(u\d+)$/);const h=m?[m[1],m[2]]:[raw];
  if(h[0]==='u')unit(h[1]);
  else if(h[0]==='t'||h[0]==='te'){const u=U.find(x=>x.id===h[1]);if(!u)return home();setNav('konu');quiz(shuf(u.q.map((q,i)=>byId[u.id+'-'+i])),h[0]==='t'?'instant':'exam','Ünite '+u.no+' soruları');}
  else if(h[0]==='tekrar')tekrar();
  else if(h[0]==='deneme')denemeSetup();
  else if(h[0]==='yanlis')yanlis();
  else home();
}
window.addEventListener('hashchange',route);

route();
})();

</script>
</body>
</html>
