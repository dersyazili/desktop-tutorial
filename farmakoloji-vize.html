<script>
U.push({"id":"u4","no":4,"title":"Kemoterapötikler I: Genel ilkeler ve hücre duvarı/zarı etkili antibiyotikler","kisa":"Bakteriyostatik/bakterisid, direnç, spektrum, etki mekanizmaları, yan etkiler, penisilinler, sefalosporinler, karbapenem, monobaktam, glikopeptidler, polimiksinler","s":[{"h":"1. Temel kavramlar","b":"\n<p><b>Kemoterapi:</b> Bedeni işgal eden bakteri, parazit, virüs ve protozoayı konakçıya toksik etki yapmadan yok eden ya da gelişimini önleyen ilaçlarla tedavi.</p>\n<p><b>Antibiyotik:</b> Aktinomiset, fungus, bakteri gibi mikroorganizmaların ürettiği, diğer mikroorganizmaları engelleyen/yok eden madde.</p>\n<table><tr><th>Grup</th><th>Etki</th><th>Örnekler (kitaptaki liste)</th></tr>\n<tr><td><b>Bakteriyostatik</b></td><td>Üremeyi ve gelişimi <b>engeller</b></td><td>Tetrasiklinler, sülfonamidler, kloramfenikol, eritromisin, makrolidler, metronidazol, mikonazol</td></tr>\n<tr><td><b>Bakterisid</b></td><td>Bakteriyi <b>yok eder</b>; perakut/akut enfeksiyonda</td><td>Penisilinler, sefalosporinler, imipenem, aminoglikozidler, vankomisin, amfoterisin B (fungisid), rifampisin, fluorokinolonlar</td></tr></table>\n<div class=\"tip\">Tutarsızlık: Metronidazol burada bakteriyostatik listesinde, ama \"Nitroimidazoller\" bölümünde \"hızlı etkin bakteri öldürücü\" deniyor. Mikonazol de bir antifungaldir. Sınavda kitabın bu listesi sorulabilir.</div>\n<ul><li><b>Kemoterapinin ana ilkesi:</b> Konakçıda eser, etkende azami toksisite. Bu seçicilik insan ve mikroorganizma hücresindeki farklardan doğar. <b>En seçici ilaçlar penisilinlerdir.</b></li>\n<li><b>Doğal direnç:</b> Bakteri ilaçtan baştan etkilenmez. <b>Kazanılmış direnç:</b> İlk başta etkiliyken sonradan etkisiz hale gelir.</li>\n<li><b>Çapraz direnç:</b> Benzer yapılı ilaca da direnç. Oksitetrasikline dirençli bakteri demetilklortetrasiklin, klortetrasiklin ve tetrasikline de dirençlidir.</li>\n<li><b>Antimikrobik spektrum:</b> Etkilenen mikroorganizmaların tümü. <b>Dar:</b> nistatin (yalnız maya mantarı). <b>Geniş:</b> ampisilin, tetrasiklinler.</li>\n<li><b>Antibiyogram:</b> Bakterilerin hangi ilaca hangi yoğunlukta duyarlı olduğunun saptanması. Laboratuvar yetersizse geniş spektrumlu ilaç ya da kombinasyon kullanılır.</li>\n<li><b>Süperenfeksiyon:</b> Kombinasyon veya geniş spektrum barsak florasını baskılar; dirençli mantar ve gram (–) basiller çoğalır. Bu nedenle tedavinin olabildiğince <b>dar spektrumlu</b> olmasına özen gösterilir.</li></ul>"},{"h":"2. Antibakteriyel etki mekanizmaları","b":"\n<table><tr><th>Mekanizma</th><th>Özellik</th><th>İlaçlar</th></tr>\n<tr><td><b>Hücre duvarı sentezini engelleme</b></td><td>Çoğalan bakteriye etkili, <b>öldürücü</b>; gelişmesi bitmişe etkisiz</td><td>Sefalosporinler, penisilinler, novobiosin, basitrasin, aztreonam, vankomisin, imipenem</td></tr>\n<tr><td><b>Sitoplazma zarı geçirgenliğini artırma</b></td><td>Deterjan etki; gelişimini bitirmiş bakteriyi de öldürür</td><td>Amfoterisin B, polimiksinler, nistatin, gramisidin</td></tr>\n<tr><td><b>Protein sentezini engelleme</b></td><td>Ribozoma bağlanır; çoğu bakteriyostatik, geniş spektrumlu</td><td>Linkomisin, tetrasiklinler, kloramfenikol, oleandomisin, aminoglikozidler, eritromisin</td></tr>\n<tr><td><b>DNA / mRNA sentezini bozma</b></td><td>Çoğu sitotoksik; metronidazol, fluorokinolonlar, nalidiksik asit ve rifamisinler antibakteriyel</td><td>Aktinomisinler, mitomisinler, nitroimidazoller, daunorubisin, doksorubisin, nalidiksik asit, rifamisinler, fluorokinolonlar</td></tr>\n<tr><td><b>İntermediyer metabolizmayı bozma</b></td><td>Folik asit sentezini engeller</td><td>Trimetoprim, sülfonamidler, PAS, sulfonlar, etambutol, izoniazid</td></tr></table>"},{"h":"3. Kemoterapötiklerin yan etkileri ve tedavi başarısızlığı","b":"\n<ul><li><b>Alerji:</b> En çok <b>sülfonamidler ve penisilinler</b>; döküntüden anafilaktik şoka kadar.</li>\n<li><b>Nörolojik:</b> Aminoglikozid türevleri ve streptomisin <b>8. kranial sinir</b>i (işitme-denge) bozar.</li>\n<li><b>Psişik:</b> İzoniazid, sikloserin → psikotik tepkiler.</li>\n<li><b>GİS:</b> Sülfonamid, tetrasiklin, ampisilin, sefalosporin, kloramfenikol, izoniazid, PAS → diyare, kusma, bulantı.</li>\n<li><b>Süperenfeksiyon:</b> Ampisilin, tetrasiklin → dil iltihabı, stomatit, anal kaşıntı, B avitaminozu.</li>\n<li><b>Böbrek:</b> Polipeptidler, sülfonamidler, bazı aminoglikozidler.</li>\n<li><b>Karaciğer:</b> İzoniazid, eritromisin türevleri.</li>\n<li><b>Kemik iliği baskılanması:</b> En çok <b>kloramfenikol</b>.</li>\n<li><b>Teratojenik:</b> Kloramfenikol, tetrasiklinler, eritromisin, aminoglikozidler, fluorokinolonlar, estolatlar → gebede kullanılmaz.</li></ul>\n<p><b>Gelişigüzel antibiyotik kullanımının sonuçları:</b> direnç, yan etki sıklığında artış, ekonomik yük.</p>\n<table><tr><th>Başarısızlık nedeni</th><th>Örnekler</th></tr>\n<tr><td>Yanılgı</td><td>Yanlış tanı, ikinci enfeksiyon, intoleransa bağlı ateş, ilacın önceden inaktivasyonu</td></tr>\n<tr><td>Hastaya bağlı</td><td>Uyulmayan tedavi, kusma-ishal, kollaps ve İM enjeksiyon, perfüzyon kazaları, immünodepresyon</td></tr>\n<tr><td>Mikroba bağlı</td><td>Tanı hatası, direnç, süperenfeksiyon, antagonizma, yetersiz bakterisid etki</td></tr></table>\n<p><b>Dikkat edilecekler:</b> erken tanı ve en etkili ilaç; immün yetmezlikte <b>bakterisid ilaç</b>; <b>2–3 günde</b> iyileşme yoksa tanı ve tedavi gözden geçirilir; tek etkende tek ilaç.</p>"},{"h":"4. Penisilinler","b":"\n<p>Hücre duvarındaki <b>peptidoglikan</b> sentezini inhibe eder; <b>bakterisid</b>. Alerji dışında güvenlidir. Yapıda <b>beta-laktam halkası</b> bulunur. Bakterilerin <b>beta-laktamaz</b> enzimi direnç nedenidir.</p>\n<ul><li><b>Penisilin G ve V:</b> doğal preparatlar. Kitapta \"aside ve penisilinaza duyarlı, kısa etkili\" grupta. Penisilin G'nin K⁺ ve Na⁺ tuzları kristalize penisilindir. Depo türevleri: klemizol, benzatin, prokain penisilin G. Normalde kan-beyin engelini zor geçer, <b>menenjitte geçiş artar</b>.</li>\n<li><b>Penisilinaza dirençli penisilinler:</b> yarı sentetik; penisilinaz salgılayan stafilokoklara karşı.</li>\n<li><b>Aminopenisilinler (geniş spektrumlu):</b> ampisilin, metampisilin, amoksisilin; <i>E. coli</i>, salmonella, proteus gibi gram (–) basillere de etkili.</li>\n<li><b>Karbenisilin:</b> yüksek dozda trombosit işlevini bozup kanama yapar. <b>Aminoglikozidle aynı şişe/enjektörde karıştırılmaz.</b> <b>Tikarsilin</b> teratojenik olduğundan gebede kullanılmaz.</li>\n<li><b>Karboksi- ve üreidopenisilinler:</b> <i>Pseudomonas aeruginosa</i>, Proteus, Enterobacter'e etkili; <b>yalnız hastanede İV</b>. Tikarsilin, tazosilin, mezlosilin, temosilin, piperasilin.</li>\n<li><b>Depo penisilinler:</b> sudaki süspansiyon, İM'den yavaş emilir. Prokain-penisilin G (ester); <b>Pronapen</b> (1/4–1/5 serbest penisilin G içerir); <b>Penadur</b> = benzatin penisilin G (2 penisilin G + 1 benzatin).</li></ul>\n<p><b>Beta-laktamaz inhibitörlü kombinasyonlar:</b> Sulbaktam ve klavulanik asit beta-laktamazı dönüşümsüz engeller.</p>\n<table><tr><th>Kombinasyon</th><th>Kullanım / not</th></tr>\n<tr><td><b>Amoksisilin + klavulanik asit (Augmentin)</b></td><td>Akut otitis media, solunum ve üriner enfeksiyonlar. Yüksek doz/uzun tedavide <b>kolestatik hepatit</b></td></tr>\n<tr><td>Tikarsilin + klavulanik asit</td><td>Pulmoner, üriner, intraabdominal, jinekolojik</td></tr>\n<tr><td><b>Ampisilin + sulbaktam (Alfasid, Duocid)</b></td><td>Gram (+), gram (–), anaerob; aspirasyon pnömonisi, diyabetik ayak, selülit, kemik</td></tr>\n<tr><td>Sulbaktam + sefoperazon</td><td>Solunum, idrar yolu, septisemi, menenjit vb.</td></tr>\n<tr><td><b>Piperasilin + tazobaktam</b></td><td>BOS geçişi artar; hastanede dirençli ağır enfeksiyonlar, septisemi</td></tr></table>"},{"h":"5. Penisilin alerjisi ve önlemler","b":"\n<ul><li>Alerji <b>tüm penisilinlerde</b> vardır; birine duyarlı olan hepsine duyarlıdır.</li>\n<li>Antijen: metabolit <b>penisiloik asit</b> veya <b>6-aminopenisilanik asidin</b> proteinlerle oluşturduğu yapı.</li>\n<li>Belirtiler: anjiyonörotik ödem, ürtiker, döküntü. <b>En ciddi yan etki anafilaktik şok.</b></li>\n<li>Penisilin alerjisi olanların bir kısmı sefalosporinlere de alerjiktir.</li></ul>\n<p><b>Uygulama öncesi önlemler:</b></p><ol>\n<li>Daha önce penisilin kullanımı ve alerji <b>sorgulanır</b>.</li>\n<li><b>Hidrokortizon, antihistaminik ve adrenalin</b> hazırda bulunur.</li>\n<li>Enjeksiyon <b>kolun alt bölümüne</b>, gerekirse turnike bağlanabilecek yere yapılır.</li>\n<li>Önce <b>intradermal 10 Ü</b>; tepki yoksa <b>yarım saat</b> arayla doz artırılır; tepki yoksa istenen doz verilir.</li>\n<li>Alerjide <b>glukokortikoid + adrenalin</b>; İV fizyolojik sıvı; asidoz için <b>sodyum bikarbonat</b>; kan basıncı için <b>dopamin ve NA</b>.</li></ol>"},{"h":"6. Sefalosporinler","b":"\n<p>Beta-laktam; hücre duvarını engeller, bakterisid. Geniş spektrumlu, beta-laktamaza dirençli, penisilinden <b>daha az alerjik</b>.</p>\n<table><tr><th>Kuşak</th><th>Özellik</th></tr>\n<tr><td><b>1. kuşak</b></td><td>Gram (+) ve (–). Stafilokoklara güçlü → <b>cerrahi profilaksi</b> (sefazolin İV). <b>Sefadroksil oral en uzun etkili</b>. Oral: sefaleksin, sefradin, sefadroksil</td></tr>\n<tr><td><b>2. kuşak</b></td><td>Aside dayanıksız → parenteral. Beta-laktamaza dirençli. <b>Sefoksitin anaeroblara</b> etkili (pelvis, karın içi). <b>Sefuroksim BOS'a geçer → menenjit</b></td></tr>\n<tr><td><b>3. kuşak</b></td><td>Gram (–)'e güçlü; dirençli enterobakteri ve psödomonas. <b>Sefsulodin</b> psödomonasta çok etkili. Sefotaksim, seftriakson, seftizoksim BOS'a geçer → menenjit. <b>Seftazidim psödomonas</b>, <b>sefoperazon safra yolu</b> enfeksiyonunda öncelikli</td></tr>\n<tr><td><b>4. kuşak</b></td><td><b>Sefepim</b>: gram (–) beta-laktamazlara en dirençli. Enterobakteri, Neisseria, H. influenzae, MRSA; menenjit</td></tr>\n<tr><td><b>5. kuşak</b></td><td>Vankomisin ve metisiline dirençli <i>S. aureus</i> dahil gram (+)</td></tr></table>\n<p><b>Yan etkiler:</b> nörotoksisite; GİS bozukluğu (<b>seftriakson</b> diyare ve safra kesesinde birikme yönünden önde); nefrotoksisite (1. kuşaktan <b>sefalotin</b> ve 3. kuşaklar); 3. kuşakta trombosit bozukluğu ve <b>K vitamini eksikliğine bağlı protrombin zamanı uzaması</b>; seyrek alerji; İV'de ağrı ve flebit; süperenfeksiyon.</p>\n<div class=\"tip\">Sefalosporin ve aminoglikozid kimyasal olarak geçimsizdir; <b>aynı infüzyon sıvısında verilmez</b>.</div>"},{"h":"7. Karbapenemler ve monobaktamlar","b":"\n<ul><li><b>İmipenem:</b> beta-laktamazlara stabil, geniş spektrum; penisiline dirençli gram (+), (–) ve anaeroblar. Endokardit, septisemi, pnömoni, peritonit, piyelonefritte 3. kuşak sefalosporine eşdeğer. Böbrekteki <b>dihidropeptidaz</b> enzimi imipenemi yıkar; <b>silastatin</b> bu enzimi inhibe eder → <b>imipenem/silastatin</b>.</li>\n<li>İmipenem yan etkileri: en sık GİS (psödomembranöz enterokolit dahil), flebit, alerjik cilt reaksiyonu, seyrek <b>konvülsiyon</b>. <b>Penisilinle çapraz alerji</b> var → penisilin alerjisinde kullanılmaz.</li>\n<li><b>Meropenem:</b> daha az toksik, dihidropeptidaza dirençli; üriner enfeksiyon, nötropenik hasta, pnömoni, hastane enfeksiyonu, menenjit.</li>\n<li><b>Aztreonam (monobaktam):</b> beta-laktamlar içinde <b>en dar spektrumlu</b>. <b>Alerjik etkisi yok</b> → beta-laktam alerjisinde rahatlıkla kullanılır. Gram (–)'e (psödomonas, serratia) etkili; gram (+) ve anaeroblara az etkili. Böbrek-idrar yolu, alt solunum yolu, deri, kemik-eklem, menenjit, gonore.</li></ul>"},{"h":"8. Glikopeptidler ve diğer duvar/zar etkili ilaçlar","b":"\n<p><b>Vankomisin:</b> kompleks glikopeptid, <b>dar spektrumlu</b>. Hücre duvarını beta-laktamlardan farklı mekanizmayla inhibe eder. Gram (+) koklar, özellikle <b>metisiline dirençli stafilokok</b> ve clostridiumlara bakterisid. Beta-laktam alerjisinde alternatif.</p>\n<ul><li>Endikasyon: bakteriyel endokardit profilaksisi; <i>Clostridium difficile</i>'ye bağlı <b>psödomembranöz kolit</b>; stafilokoklu enterokolit; menenjitte intratekal; hastane enfeksiyonları.</li>\n<li>Yan etki: <b>ototoksisite</b> (yüksek doz/uzun tedavide kalıcı işitme kaybı), nefrotoksisite, aşırı duyarlılık, tromboflebit. Gebelik ve böbrek bozukluğunda kontrendike.</li>\n<li><b>Gentamisinle kombinasyon ototoksisiteyi artırır.</b></li></ul>\n<p><b>Teikoplanin:</b> vankomisine benzer, <b>etki süresi daha uzun</b>; MRSA, streptokok, enterokok. Aminoglikozid ve imipenemle sinerji.</p>\n<p><b>Fosfomisin:</b> peptidoglikan sentezinin <b>ilk basamağını</b> inhibe eder; bakterisid. Oral emilimi güçtür, <b>trometamol</b> eklenince artar. İdrarda yüksek konsantrasyon → kadınlarda <b>akut sistit</b>.</p>\n<p><b>Sikloserin:</b> nörolojik yan etkiler (baş ağrısı, titreme, disartri, epilepsi, depresyon) nedeniyle kitaba göre artık kullanılmıyor.</p>\n<p><b>Basitrasin + neomisin:</b> lokal; piyoderma, dış kulak yolu, yara, meme başı çatlağı, yanık. <b>Daptomisin:</b> lipopeptid, vankomisin benzeri spektrum, hızlı bakterisid.</p>\n<p><b>Polipeptidler (sitoplazma zarına etkili):</b></p><ul>\n<li><b>Polimiksin B:</b> gram (–) basillere bakterisid; diğerleri etkisizse; <b>psödomonasta İM</b>. Yan etki: nörotoksisite (ağız felci, optik nevrit), konvülsiyon, psişik bozukluk.</li>\n<li><b>Kolistin:</b> polimiksin B'ye benzer; diyare, barsak enfeksiyonu, sindirim yolu cerrahisi. Kolistine dirençli bakteri polimiksin B'ye de dirençlidir (<b>çapraz direnç</b>). Yan etki: miyastenik sendrom, psödomembranöz kolit, nefro/nörotoksisite. Kontrendike: <b>prematüre ve 1 aydan küçük bebek</b>.</li></ul>"}],"q":[{"q":"Bakteri hücresinin üremesini ve gelişimini engelleyen, ancak öldürmeyen ilaçlara ne ad verilir?","o":["Bakterisid","Antiseptik","Bakteriyostatik","Dezenfektan","Fungisid"],"a":2,"e":"Bakteriyostatik tanımı."},{"q":"Kitaptaki listeye göre aşağıdakilerden hangisi bakterisid değildir?","o":["Penisilin","Vankomisin","Rifampisin","Aminoglikozid","Tetrasiklin"],"a":4,"e":"Tetrasiklinler bakteriyostatiktir."},{"q":"Kitaba göre en seçici etkili kemoterapötik grubu hangisidir?","o":["Penisilinler","Aminoglikozidler","Tetrasiklinler","Sülfonamidler","Kinolonlar"],"a":0,"e":"En fazla seçici olan ilaçlar penisilinlerdir."},{"q":"Oksitetrasikline direnç kazanan bakterinin klortetrasikline de dirençli olmasına ne ad verilir?","o":["Doğal direnç","Çapraz direnç","Süperenfeksiyon","Taşifilaksi","Antagonizma"],"a":1,"e":"Benzer yapıdaki ilaca da direnç gelişmesi."},{"q":"Yalnızca maya mantarlarına etkili olduğu için dar spektrum örneği olarak verilen ilaç hangisidir?","o":["Ampisilin","Tetrasiklin","Amfoterisin B","Nistatin","Kloramfenikol"],"a":3,"e":"Dar spektrum örneği nistatin."},{"q":"Bakterilerin hangi ilaca hangi yoğunlukta duyarlı olduğunun tedavi öncesi belirlenmesine ne ad verilir?","o":["Spektrum","Profilaksi","Kültür","Antibiyogram","Biyoyararlanım"],"a":3,"e":"Antibiyogram."},{"q":"Geniş spektrumlu antibiyotik veya kombinasyon kullanımında barsak florası baskılanarak dirençli mantar ve gram (–) basillerin çoğalmasına ne ad verilir?","o":["Çapraz direnç","Kazanılmış direnç","Reenfeksiyon","Kolonizasyon","Süperenfeksiyon"],"a":4,"e":"Süperenfeksiyon; bu nedenle dar spektrum tercih edilir."},{"q":"Hücre duvarı sentezini engelleyen antibiyotikler için hangisi doğrudur?","o":["Çoğalmakta olan bakterilere etkilidir","Gelişmesi bitmiş bakterilere de etkilidir","Bakteriyostatiktir","Ribozoma bağlanır","Folik asit sentezini engeller"],"a":0,"e":"Gelişmesi bitmiş bakterilere etkimezler; etkileri öldürücüdür."},{"q":"Deterjan etkiyle sitoplazma zarının geçirgenliğini artıran ilaçlar hangileridir?","o":["Penisilinler, sefalosporinler","Polimiksinler, amfoterisin B, nistatin","Tetrasiklinler, kloramfenikol","Sülfonamidler, trimetoprim","Kinolonlar, rifampisin"],"a":1,"e":"Zar geçirgenliğini artıranlar: amfoterisin B, polimiksinler, nistatin, gramisidin."},{"q":"Folik asit sentezini engelleyerek intermediyer metabolizmayı bozan ilaçlar arasında hangisi yer alır?","o":["Vankomisin","Eritromisin","Trimetoprim","Polimiksin B","İmipenem"],"a":2,"e":"Trimetoprim, sülfonamidler, PAS, sulfonlar, etambutol, izoniazid."},{"q":"En çok alerjik tepkimeye neden olan kemoterapötikler hangileridir?","o":["Aminoglikozidler ve tetrasiklinler","Makrolidler ve kinolonlar","Sülfonamidler ve penisilinler","Antifungaller ve antiviraller","Polimiksinler ve vankomisin"],"a":2,"e":"Kitap: sülfonamidler ve penisilinler."},{"q":"Aminoglikozidler ve streptomisin hangi kranial sinirin işlevini bozar?","o":["8. kranial sinir (işitme-denge)","2. kranial sinir","5. kranial sinir","7. kranial sinir","10. kranial sinir"],"a":0,"e":"İşitme ve denge işlevleri bozulur."},{"q":"Kemik iliği baskılanmasının en çok görüldüğü antibiyotik hangisidir?","o":["Penisilin","Eritromisin","Sefazolin","Kloramfenikol","Vankomisin"],"a":3,"e":"Kemik iliği baskılanması en çok kloramfenikolde."},{"q":"Antibiyotik tedavisinde kaç gün içinde iyileşme olmazsa tanı ve tedavi kontrol edilmelidir?","o":["7 gün","10–14 gün","1 ay","12 saat","2–3 gün"],"a":4,"e":"Kitap: 2–3 günde iyileşme olmazsa tanı ve tedavi kontrol edilir."},{"q":"Bağışıklık sistemi yetmezliği olan hastalarda hangi tip antibiyotik tercih edilmelidir?","o":["Bakteriyostatik","Bakterisid","Dar spektrumlu bakteriyostatik","Yalnızca topikal","Antiseptik"],"a":1,"e":"İmmün yetmezlikte bakterisid ilaçlar."},{"q":"Penisilinlerin etki mekanizması nedir?","o":["Ribozomda protein sentezini engellemek","DNA jiraz inhibisyonu","Folik asit sentezini engellemek","Sitoplazma zarını bozmak","Hücre duvarında peptidoglikan sentezini inhibe etmek"],"a":4,"e":"Penisilinler bakterisid, peptidoglikan sentezini inhibe eder."},{"q":"Penisilin ve sefalosporinlere direnç gelişmesinde önemli rol oynayan bakteriyel enzim hangisidir?","o":["Transpeptidaz","DNA jiraz","Dihidropeptidaz","Beta-laktamaz","Psödokolinesteraz"],"a":3,"e":"Beta-laktamaz beta-laktam halkasını yıkar."},{"q":"Penisilin G'nin kan-beyin engelini geçişi için doğru ifade hangisidir?","o":["Normalde zordur, menenjitte artar","Her zaman çok kolaydır","Hiç geçmez","Yalnız oral alımda geçer","Yalnız yenidoğanda geçer"],"a":0,"e":"Beyin zarları iltihaplıyken geçiş fazlalaşır."},{"q":"E. coli, salmonella ve proteus gibi gram (–) basillere de etkili geniş spektrumlu penisilinler hangileridir?","o":["Depo penisilinler","Penisilinaza dirençli penisilinler","Aminopenisilinler","Doğal penisilinler","Karbapenemler"],"a":2,"e":"Ampisilin, metampisilin, amoksisilin."},{"q":"Yüksek dozda trombosit işlevini bozarak kanamaya yol açabilen ve aminoglikozidle aynı enjektörde karıştırılmaması gereken penisilin hangisidir?","o":["Amoksisilin","Karbenisilin","Penisilin V","Benzatin penisilin","Ampisilin"],"a":1,"e":"Karbenisilin aminoglikozidle kompleks oluşturup birbirini etkisizleştirebilir."},{"q":"Teratojenik etkisi nedeniyle gebelerde kullanılmaması gerektiği belirtilen penisilin hangisidir?","o":["Amoksisilin","Penisilin G","Ampisilin","Tikarsilin","Pronapen"],"a":3,"e":"Kitap: tikarsilin teratojenik."},{"q":"Pseudomonas aeruginosa üzerine etkili olup yalnızca hastanede İV kullanılan penisilin grubu hangisidir?","o":["Aminopenisilinler","Karboksi- ve üreidopenisilinler","Depo penisilinler","Doğal penisilinler","Penisilinaza dirençli penisilinler"],"a":1,"e":"Tikarsilin, mezlosilin, piperasilin vb."},{"q":"Penadur hangi penisilindir?","o":["Benzatin penisilin G","Prokain penisilin G","Amoksisilin-klavulanat","Ampisilin-sulbaktam","Penisilin V"],"a":0,"e":"Benzatin-penisilin G (Penadur)."},{"q":"İçeriğinde 1/4–1/5 oranında serbest penisilin G bulunan prokain-penisilin karışımı hangisidir?","o":["Penadur","Augmentin","Alfasid","Duocid","Pronapen"],"a":4,"e":"İlaveli prokain-penisilin G (Pronapen)."},{"q":"Augmentin hangi kombinasyondur?","o":["Ampisilin + sulbaktam","Piperasilin + tazobaktam","Amoksisilin + klavulanik asit","Tikarsilin + klavulanik asit","İmipenem + silastatin"],"a":2,"e":"Amoksisilin-klavulanik asit."},{"q":"Amoksisilin-klavulanik asit kombinasyonunun yüksek doz veya uzun tedavide bildirilen yan etkisi hangisidir?","o":["Gri sendrom","Kernikt :"Cerrahi profilakside tercih edilen sefalosporin kuşağı hangisidir?","o":["2. kuşak","3. kuşak","4. kuşak","1. kuşak","5. kuşak"],"a":3,"e":"Stafilokoklara etkinlikleri fazla; sefazolin İV."},{"q":"Oral yoldan en uzun etkili sefalosporin hangisidir?","o":["Sefazolin","Seftriakson","Sefepim","Sefoksitin","Sefadroksil"],"a":4,"e":"Sefadroksil."},{"q":"Anaerob bakterilere etkili olup pelvis ve karın içi enfeksiyonlarında tercih edilen 2. kuşak sefalosporin hangisidir?","o":["Sefaleksin","Seftazidim","Sefepim","Sefadroksil","Sefoksitin"],"a":4,"e":"Sefoksitin."},{"q":"Psödomonas enfeksiyonlarında öncelikli 3. kuşak sefalosporin hangisidir?","o":["Sefoperazon","Seftazidim","Sefazolin","Sefuroksim","Sefaleksin"],"a":1,"e":"Seftazidim psödomonas; sefoperazon safra yolu."},{"q":"Safra yolu enfeksiyonlarında öncelikli olduğu belirtilen sefalosporin hangisidir?","o":["Sefoperazon","Seftazidim","Sefoksitin","Sefazolin","Sefepim"],"a":0,"e":"Sefoperazon."},{"q":"Gram (–) bakterilerin beta-laktamazlarına en dirençli sefalosporin hangisidir?","o":["Sefazolin","Sefuroksim","Sefotaksim","Sefepim (4. kuşak)","Sefadroksil"],"a":3,"e":"Sefepim."},{"q":"Vankomisine ve metisiline dirençli S. aureus'a karşı etkili sefalosporin kuşağı hangisidir?","o":["1. kuşak","2. kuşak","5. kuşak","3. kuşak","4. kuşak"],"a":2,"e":"5. kuşak sefalosporinler."},{"q":"3. kuşak sefalosporinlerin hematolojik yan etkisi hangisidir?","o":["Aplastik anemi","K vitamini eksikliğine bağlı protrombin zamanı uzaması","Polisitemi","Methemoglobinemi","Lösemi"],"a":1,"e":"Trombosit bozukluğu ve PT uzaması."},{"q":"Diyare oluşturma ve safra kesesinde birikme etkisi diğer sefalosporinlerden fazla olan ilaç hangisidir?","o":["Sefazolin","Sefaleksin","Sefepim","Seftriakson","Sefoksitin"],"a":3,"e":"Seftriakson."},{"q":"Sefalosporin ile aminoglikozidin aynı infüzyon sıvısında verilmemesinin nedeni nedir?","o":["Sinerji","Çapraz alerji","Aynı reseptöre bağlanma","Protein bağlanma yarışı","Kimyasal geçimsizlik"],"a":4,"e":"Kimyasal geçimsizlik vardır."},{"q":"İmipenemi böbrekte yıkan enzimi inhibe etmek için birlikte verilen madde hangisidir?","o":["Silastatin","Klavulanik asit","Sulbaktam","Tazobaktam","Probenesid"],"a":0,"e":"Dihidropeptidaz enzimini silastatin inhibe eder."},{"q":"İmipenem ile ilgili hangisi YANLIŞTIR?","o":["Seyrek olarak konvülsiyon yapabilir","Beta-laktamazlara stabildir","Penisilin alerjisi olanlarda güvenle kullanılır","Böbrek dihidropeptidazı ile yıkılır","Geniş spektrumludur"],"a":2,"e":"Penisilinle çapraz alerji olduğu için penisilin alerjisinde kullanılmaz."},{"q":"Beta-laktamlar içinde en dar spektrumlu olan ve alerjik etkisi olmadığı için beta-laktam alerjisinde kullanılabilen ilaç hangisidir?","o":["İmipenem","Meropenem","Aztreonam","Sefepim","Piperasilin"],"a":2,"e":"Aztreonam (monobaktam)."},{"q":"Aztreonamın etki spektrumu için doğru ifade hangisidir?","o":["Gram (+) bakterilere çok etkili","Anaeroblara çok etkili","Mantarlara etkili","Virüslere etkili","Gram (–) bakterilere etkili, gram (+) ve anaeroblara az etkili"],"a":4,"e":"Psödomonas ve serratia dahil gram (–)."},{"q":"Clostridium difficile'ye bağlı psödomembranöz kolit tedavisinde kullanılan glikopeptid hangisidir?","o":["Vankomisin","Gentamisin","Kloramfenikol","Aztreonam","Polimiksin B"],"a":0,"e":"Vankomisin endikasyonu."},{"q":"Vankomisinin en önemli yan etkisi hangisidir?","o":["Gri sendrom","Ototoksisite","Dişlerde renk değişikliği","Kolestatik hepatit","Fotosensitivite"],"a":1,"e":"Yüksek doz/uzun tedavide kalıcı işitme kaybı."},{"q":"Vankomisinin hangi ilaçla kombinasyonu ototoksisiteyi artırır?","o":["Penisilin","Metronidazol","Rifampisin","Gentamisin","Teikoplanin"],"a":3,"e":"Uyarı: gentamisinle kombinasyon."},{"q":"Vankomisine benzeyen ancak etki süresi daha uzun olan glikopeptid hangisidir?","o":["Teikoplanin","Daptomisin","Fosfomisin","Basitrasin","Kolistin"],"a":0,"e":"Teikoplanin."},{"q":"Sindirim yolundan emilimini artırmak için trometamol eklenen ve kadınların akut sistitinde kullanılan antibiyotik hangisidir?","o":["Vankomisin","Sikloserin","Fosfomisin","Aztreonam","Kolistin"],"a":2,"e":"Fosfomisin."},{"q":"Psödomonas enfeksiyonlarında İM yolla uygulanan, nörotoksisite (ağız felci, optik nevrit) yapabilen polipeptid hangisidir?","o":["Vankomisin","Gentamisin","Basitrasin","Daptomisin","Polimiksin B"],"a":4,"e":"Polimiksin B."},{"q":"Kolistin hangi grupta kontrendikedir?","o":["Yaşlılar","Prematüreler ve 1 aydan küçük bebekler","Gebeliğin son trimesteri","Diyabetliler","Hipertansifler"],"a":1,"e":"Kontrendikasyon: kişisel duyarlık, prematüreler, 1 aylıktan küçük bebekler."},{"q":"Kolistine dirençli bakterilerin polimiksin B'ye de dirençli olması neye örnektir?","o":["Doğal direnç","Süperenfeksiyon","Sinerji","Çapraz direnç","Antagonizma"],"a":3,"e":"Çapraz direnç."}]});

</script><script>
U.push({"id":"u5","no":5,"title":"Kemoterapötikler II: Protein/DNA sentezi inhibitörleri ve antitüberküloz ilaçlar","kisa":"Tetrasiklinler, fenikoller, aminoglikozidler, makrolidler, linkozamidler, sülfonamidler, kinolonlar, nitroimidazoller, rifampisin, oftalmik antibiyotikler, tüberküloz ilaçları","s":[{"h":"1. Tetrasiklinler","b":"\n<p>Tetrasiklin, oksitetrasiklin, metasiklin, doksisiklin, minosiklin. <b>Kalsiyumdan zengin sütlü gıdalar ve 2-3 değerlikli metaller şelat oluşturup etkisizleştirir.</b></p>\n<table><tr><th>Grup</th><th>İlaçlar</th><th>Yarı ömür</th><th>Uygulama</th></tr>\n<tr><td>Kısa etkili</td><td>Tetrasiklin, oksitetrasiklin, klortetrasiklin</td><td><b>6–8 saat</b></td><td>Günde 2–4 kez</td></tr>\n<tr><td>Orta etkili</td><td>Metasiklin, demeklosiklin</td><td><b>16 saat</b></td><td>Günde 1 kez</td></tr>\n<tr><td>Uzun etkili</td><td>Doksisiklin, minosiklin</td><td><b>18–24 saat</b></td><td>—</td></tr></table>\n<p><b>Etki:</b> Ribozomda tRNA'nın mRNA'ya bağlanmasını bozar; <b>bakteriyostatik</b>. Memeli ribozomunda da protein sentezini engeller.</p>\n<div class=\"tip\">Kitapta tetrasiklinlerin \"30S ve 50S alt birimine\" bağlandığı yazıyor. Aminoglikozidler 30S'e, kloramfenikol, makrolid ve linkozamidler 50S'e bağlanır.</div>\n<p><b>Spektrum:</b> Gram (+) ve (–), riketsiya, spiroket, klamidya, mikoplazma, lejyonella, leptospira; <b>en geniş spektrumlu antibiyotikler</b>.</p>\n<ul><li><b>1. derece:</b> granuloma inguinale, kolera, riketsiya hastalıkları, konjonktivit, trahom, pelvis içi apseler, bruselloz, veba.</li>\n<li><b>2. derece:</b> sifilizde alternatif; <i>M. pneumoniae</i> atipik pnömonisi, gonore, şarbon, aktinomikoz, tetanoz, tularemi, akne vulgaris.</li></ul>\n<p><b>Yan etkiler:</b> kemik ve <b>dişlerde renk bozukluğu</b> (gebede fetüsün kemik ve süt dişleri etkilenir); KC toksisitesi; süperenfeksiyon; böbrek hasarı; alerji; <b>fotosensitivite</b> (özellikle demetilklortetrasiklin); bebek ve yenidoğanda <b>beyin psödotümörü</b> (kafa içi basınç artışı); <b>minosiklinle vestibüler bozukluk</b>.</p>\n<div class=\"tip\"><b>Gebeler ve 8 yaşından küçük çocuklarda kontrendike.</b></div>"},{"h":"2. Fenikoller","b":"\n<p><b>Kloramfenikol</b> ve <b>tiamfenikol</b>: geniş spektrumlu, bakteriyostatik, dağılımı iyi. Ölümle sonuçlanabilen <b>dönüşümsüz aplastik anemi</b> riski nedeniyle kullanımı sınırlıdır.</p>\n<ul><li><b>Kloramfenikol:</b> Ribozomun <b>50S</b> alt birimine bağlanır. Gram (+), (–), spiroket, riketsiya, klamidya, aktinomiset, mikoplazma.</li>\n<li><b>Kullanım yeri:</b> <b><i>Salmonella typhi</i> (tifo)</b>; pnömokok/meningokok menenjiti, beyin apsesi, paratifo (ofloksasin/siprofloksasinin alternatifi), göz enfeksiyonları, riketsiyoz.</li>\n<li><b>Tiamfenikol:</b> etkisi daha düşük; böbrekle atılır → böbrek yetmezliğinde doz ayarlanır.</li></ul>\n<p><b>Yan etkiler:</b></p><ul>\n<li><b>Kemik iliği baskılanması:</b> (a) <b>dönüşümlü</b>, doza bağlı anemi, retikülosit azalması, trombositopeni, lökopeni; (b) <b>dönüşümsüz aplastik anemi</b>, ölümcül.</li>\n<li><b>Gri sendrom:</b> Prematüre ve yenidoğanda BT ve atılım gelişmediği için kan düzeyi yükselir → akut dolaşım ve solunum baskılanması, kas gevşekliği, hipotermi, <b>deride gri renk</b>.</li>\n<li>Süperenfeksiyon, alerji, optik nörit, baş ağrısı, miyalji, parestezi.</li></ul>"},{"h":"3. Aminoglikozidler","b":"\n<p>Ribozomun <b>30S</b> alt birimine bağlanıp protein sentezini engeller; geniş spektrum. Ağır pulmoner, komplikasyonlu üriner, cilt, osteoartiküler ve gram (–) basillere bağlı <b>hastane enfeksiyonlarında</b> kullanılır. Tedavi başında <b>3–5 gün</b> sinerjistik bir antibiyotikle birlikte verilir.</p>\n<ul><li>Böbrek yetmezliğinde ve <b>7 günden uzun</b> tedavide serum düzeyi izlenir. Nefrotoksik başka ilaçla kombine edilmez. Hasta <b>bol sıvı</b> almalı; böbrek fonksiyon testine göre doz ayarlanır.</li>\n<li><b>Toksik etkiler:</b> <b>nefrotoksik</b>, <b>ototoksik</b> (kalıcı işitme ve denge hasarı), <b>nöromüsküler blok</b>.</li></ul>\n<table><tr><th>İlaç</th><th>Özellik</th></tr>\n<tr><td><b>Streptomisin</b></td><td>TB etkenine de etkili; <b>veba ve tularemide öncelikli</b>. Toksisite ve hızlı direnç nedeniyle kullanımı sınırlı. Endokardit (+ betalaktam), bruselloz (+ tetrasiklin)</td></tr>\n<tr><td><b>Gentamisin</b></td><td>Etki gücü en fazla olan; hastane enfeksiyonları; penisilin/vankomisinle sinerji. <b>Anestezide nöromüsküler blokerle birlikte verilmez.</b> Denge organına toksisitesi fazla; dönüşümlü tübüler nekroz</td></tr>\n<tr><td><b>Amikasin</b></td><td>Kanamisinin yarı sentetik türevi; gücü az ama <b>gentamisine dirençli</b> basillere etkili; TB'ye de etkili</td></tr>\n<tr><td><b>Tobramisin</b></td><td><b>Psödomonasa gentamisinden daha etkili</b>, enterokoklara az; oftalmik preparatı var</td></tr>\n<tr><td><b>Neomisin</b></td><td>Toksik → lokal (cilt, vajina). Oral emilmez → barsak diyareleri, <b>kolon ameliyatı hazırlığı</b></td></tr>\n<tr><td>Netilmisin</td><td>Gentamisine benzer</td></tr>\n<tr><td>Kanamisin</td><td>Eskiden TB ilacı; direnç nedeniyle azaldı; sağırlık yapabilir</td></tr>\n<tr><td>Sisomisin</td><td>Yan etkileri nedeniyle birçok ülkede tedaviden çekildi</td></tr></table>"},{"h":"4. Makrolidler, linkozamidler, fusidik asit","b":"\n<p><b>Eritromisin (makrolid):</b> Ribozomun <b>50S</b> alt birimine bağlanır. Dar spektrumlu, gram (+)'e etkili. Spektrumu penisilin G'ye eşdeğerdir; <b>penisilin alerjisinde alternatif</b>. <i>Mycoplasma pneumoniae</i> ve <b>lejyonella</b> enfeksiyonlarında öncelikli.</p>\n<ul><li>Endikasyonlar: streptokok solunum enfeksiyonları, klamidya, kronik prostatit, kriptosporidium, <b>toksoplazmoz (spiramisin)</b>, endokardit, şarbon, gazlı gangren, tetanoz, aktinomikoz, listeria, <i>M. avium</i> (klaritromisin, azitromisin).</li>\n<li>Yan etki: terapötik endeks geniş. <b>En belirgin yan etki kolestatik hepatit.</b> Karın ağrısı, diyare, psödomembranöz kolit, transaminaz artışı.</li>\n<li>Kontrendikasyon: duyarlılık, <b>gluten (buğday) alerjisi</b>.</li></ul>\n<p><b>Linkozamidler (klindamisin, linkomisin):</b> 50S'e bağlanıp peptidil transferazı engeller. Dar spektrum (gram (+) çoğu, bazı gram (–) anaeroblar). <b>Kemik dokuya iyi geçer</b> → septik artrit, sinüzit, osteomiyelit, mastoidit. Yan etki: <b>psödomembranöz kolit</b> (kanlı-mukuslu ishal, kolik ağrı, lökositoz, ateş).</p>\n<div class=\"tip\">Makrolidler, linkozamidler ve kloramfenikol birlikte kullanılmaz: etki yerleri örtüşür, <b>antagonistik</b> etkileşirler.</div>\n<p><b>Fusidik asit:</b> Düşük dozda bakteriyostatik, yüksek dozda <i>S. aureus</i>'a bakterisid; gram (–)'e etkisiz. Stafilokok enfeksiyonunda aminoglikozid veya beta-laktamla kombine edilir. Etkileşim: kumarin, CYP3A4 ile metabolize olan ilaçlar (parasetamol, digoksin, steroid), statinler, siklosporin.</p>"},{"h":"5. Sülfonamidler ve ko-trimoksazol","b":"\n<p>Bakterilerin <b>folik asit</b> metabolizmasını inhibe eder; üremeyi durdurur, duraklayan bakteriyi vücut savunması yok eder. Özellikle üreme döneminde etkili.</p>\n<ul><li>Spektrum geniş: <i>S. pneumoniae</i>, <i>B. anthracis</i>, beta-hemolitik streptokok, <i>E. coli</i>, <i>H. influenzae</i>, Proteus, Nocardia, Chlamydia, Toxoplasma, Plasmodium.</li>\n<li>Kullanım: idrar ve solunum yolu enfeksiyonları, nokardiyoz, <i>P. falciparum</i> sıtması, toksoplazmoz, <b>ülseratif kolit</b> profilaksisi/tedavisi, konjonktivit, trahom.</li>\n<li><b>Ko-trimoksazol</b> (Bactrim, Septrim) = sülfametoksazol + trimetoprim; sinerji ve daha az direnç.</li></ul>\n<p><b>Yan etkiler:</b> alerji; idrar yollarında çökmeyi önlemek için <b>bol su ile alınmalı</b>; hematolojik bozukluklar; hepatit; <b>yenidoğanda kernikterus</b>.</p>"},{"h":"6. Kinolonlar","b":"\n<p>Bakteri sitoplazmasında <b>DNA jiraz</b> enzimini engelleyip DNA replikasyonunu bozar. Lipofilik, geniş spektrumlu, <b>hızlı bakterisid</b>. Haemophilus, serratia, lejyonella, <i>N. gonorrhoeae</i>, <i>P. aeruginosa</i>'ya etkili. <b>Siprofloksasin psödomonasa en etkili</b> kinolondur.</p>\n<p>Sık kullanılanlar: enrofloksasin, pefloksasin, siprofloksasin, norfloksasin, ofloksasin, enoksasin.</p>\n<p><b>Üstünlükleri:</b> gram (–)'e çok etkili; hızlı öldürücü; <b>2–4 saat antibiyotik sonrası etki</b>; plazmid aracılı direnç gelişmez; diğer antibiyotiklerle çapraz direnç yok; dokulara iyi geçer (doku düzeyi plazmadan yüksek); <b>uzun yarı ömür</b> (günde 1 veya 2 günde 1); proteine bağlanma düşük; iyi emilim.</p>\n<p><b>Endikasyon:</b> prostatit, piyelonefrit, gonore, sindirim sistemi enfeksiyonları, tifo, paratifo, kolera, solunum yolu, osteomiyelit, yumuşak doku, menenjit, endokardit, göz.</p>\n<p><b>Yan etki:</b> GİS tahrişi, hematolojik değişiklik, transaminaz artışı, baş ağrısı, <b>fotosensitivite</b>, artralji, böbrek bozukluğu.</p>\n<div class=\"tip\"><b>Gebeler, epileptikler, çocuklar ve bebeklerde kullanılmaz.</b></div>"},{"h":"7. Nitroimidazoller","b":"\n<p>Anaerob bakterilere etkili, çok lipofilik. Duyarlı protozoon ve bakterinin DNA'sına bağlanıp sentezini engeller; <b>hızlı bakteri öldürücü</b>.</p>\n<p><b>Kullanım:</b> anaerob septik artrit, endokardit, osteomiyelit; <i>B. fragilis</i> menenjiti, beyin apsesi; pelvis ve karın içi enfeksiyonlar; oral-dental hastalıklar; nonspesifik vajinit; deri altı apseler; <b>amibiyaz, giardiyaz, trikomoniyaz</b>; <b>psödomembranöz kolit</b>.</p>\n<ul><li><b>Metronidazol:</b> <i>Trichomonas vaginalis</i>, <i>Entamoeba histolytica</i>, <i>Giardia lamblia</i>. Antiprotozoer etkisi diğer imidazollerden fazla. Gardnerella vajiniti, barsak amibiyazisinin tüm şekilleri; beta-laktam alerjisinde clostridium ve anaerob enfeksiyonları.</li>\n<li><b>Tinidazol:</b> benzer endikasyonlar; trikomoniyaz, KC amibiyazisi, lambliyaz.</li>\n<li><b>Ornidazol:</b> inatçı anaerob enfeksiyonda amoksisilin-klavulanatla çok etkili.</li></ul>\n<p><b>Yan etkiler:</b> Yüksek doz/uzun kullanımda parestezi, periferik nöropati, nötropeni, ensefalopati, epileptiform kriz; <b>dönüşümlüdür</b>. Düşük dozda baş dönmesi, <b>ağızda metalik tat</b>, geçici lökopeni, methemoglobinemi, <b>idrar renginde koyulaşma</b>, flebit.</p>\n<p><b>Kontrendikasyon:</b> hematolojik bozukluk, SSS organik lezyonu, <b>gebeliğin ilk 3 ayı</b>.</p>\n<div class=\"tip\">Nitroimidazolle tedavi sırasında <b>alkol alınırsa disülfiram benzeri etki</b> (yüz-boyunda kızarma, baş ağrısı) görülür.</div>"},{"h":"8. Rifampisin ve oftalmik antibiyotikler","b":"\n<p><b>Rifampisin:</b> <b>RNA polimeraz inhibitörü</b>; DNA'ya bağlı RNA sentezini önler. Gram (+) ve (–) çoğu bakteri ile tüberküloz basiline etkili. TB tedavisinde <b>izoniazidle birlikte her zaman bulunan majör ilaç</b>. Lepra, meningokok ve stafilokok enfeksiyonlarında da kullanılır. İmmünosüpresif etkilidir; KC mikrozomal enzim indüktörüdür.</p>\n<ul><li>Yan etki: ilk ayda <b>sarılık (hiperbilirubinemi)</b>, bulantı, kusma, diyare, lökopeni, baş ağrısı, alerjik cilt reaksiyonu.</li>\n<li><b>PAS ile birlikte verilmez</b> (sindirim kanalında etkileşir). <b>Antikoagülan ve oral kontraseptiflerin etkisini azaltır.</b></li></ul>\n<p><b>Oftalmik antibiyotikler:</b> Sistemik verilenler göze kolay ulaşır; lokal verilenlerin göz içine geçişi zordur. Yağda çözünen <b>kloramfenikol ve tetrasiklin</b> korneayı zor aşar; kortikosteroidle kombine edilerek trahom ve konjonktivitte kullanılır. Ağır enfeksiyonda göz içine doğrudan enjeksiyon yapılır.</p>"},{"h":"9. Antitüberküloz ilaçlar","b":"\n<p><i>M. tuberculosis</i> yavaş gelişir, hücre içinde yerleşir, uzun süre canlı kalır. İlaçlar <b>bakterisid</b> olmalıdır. Direnç ve toksisiteyi önlemek için <b>2, 3 veya 4 ilaç birlikte</b> verilir.</p>\n<table><tr><th>Majör</th><th>Minör</th></tr>\n<tr><td>İzoniazid, rifampisin, etambutol, streptomisin</td><td>Pirazinamid, etionamid, sikloserin, PAS, tioasetazon</td></tr></table>\n<p><b>Standart tedavi:</b> İlk <b>2 ay izoniazid + rifampisin + pirazinamid</b>, sonra <b>4 ay izoniazid + rifampisin</b> (toplam <b>6 ay</b>). İnatçı olguda <b>9 ay</b>.</p>\n<div class=\"tip\">Tutarsızlık: Bölümün girişinde \"tedavi en az 9 ay sürer\", hemen ardından \"toplam 6 ay, inatçı olguda 9 ay\" yazıyor. Pirazinamid \"minör\" sayıldığı halde standart üçlüde yer alıyor.</div>\n<ul><li><b>İzoniazid:</b> yalnız <i>M. tuberculosis</i>'e etkili, dar spektrumlu; <b>tüberkülostatiklerin en güçlüsü</b>. Temaslı, negatif reaksiyonlu aile bireylerinde <b>tek başına koruyucu tedavi</b>. Yan etki: periferik nevrit, optik nevrit, ataksi, konvülsiyon, psikoz (<b>B6 vitamini ile önlenir</b>); <b>hepatotoksisite</b> (rifampisin ve pirazinamidle artar). <b>Alkolle alınmaz</b>; fenitoin etkisini potansiyalize eder.</li>\n<li><b>Rifampisin:</b> oral yoldan çabuk emilir, tüm dokulara dağılır.</li>\n<li><b>Streptomisin:</b> <i>Streptomyces griseus</i>'tan elde edilen aminoglikozid; bruselloz, tularemi, veba, TB.</li>\n<li><b>PAS:</b> bakteriyostatik; yüksek doz/uzun kullanımda <b>guatr</b>; 2 yaş altında kombinasyonla kullanılabilir.</li>\n<li><b>Rifabutin:</b> rifampisin direncinde; trombopeni/nötropeni riski daha fazla; makrolidle <b>üveit</b>.</li>\n<li><b>Etambutol:</b> yalnız TB basiline etkili, sentetik; eritrositlerde birikip depo olur; kombinasyonda 3. ilaç. Böbrek yetmezliğinde doz azaltılır, <b>çocuklara verilmez</b>. Yan etki: <b>optik nevrit</b> (yüksek dozda artar).</li>\n<li><b>Pirazinamid:</b> bakterisid; izoniazid ve rifampisine ek.</li>\n<li><b>Sikloserin:</b> böbrek yetmezliğinde birikir; diğer ilaçlara direnç/alerjide kullanılır; belirgin SSS yan etkisi, konvülsiyon; <b>epileptiklere verilmez</b>.</li></ul>\n<div class=\"tip\">Tutarsızlık: Sikloserin için önceki bölümde \"artık kullanılmıyor\", burada \"direnç/alerjide uygulanır\" deniyor.</div>"}],"q":[{"q":"Tetrasiklinlerin emilimini azaltıp etkisizleştiren besin hangisidir?","o":["Süt ve sütlü gıdalar","Meyve suyu","Ekmek","Su","Sebze"],"a":0,"e":"Kalsiyum ve 2-3 değerlikli metaller şelat oluşturur."},{"q":"Kısa etkili tetrasiklinlerin yarı ömrü ne kadardır?","o":["16 saat","18–24 saat","2 saat","48 saat","6–8 saat"],"a":4,"e":"Kısa etkili: tetrasiklin, oksitetrasiklin, klortetrasiklin; günde 2–4 kez."},{"q":"Uzun etkili tetrasiklinler hangileridir?","o":["Tetrasiklin, oksitetrasiklin","Metasiklin, demeklosiklin","Doksisiklin, minosiklin","Klortetrasiklin, tetrasiklin","Kloramfenikol, tiamfenikol"],"a":2,"e":"Yarı ömür 18–24 saat."},{"q":"Tetrasiklinler hangi yaştan küçük çocuklarda kontrendikedir?","o":["2 yaş","8 yaş","12 yaş","16 yaş","1 yaş"],"a":1,"e":"Gebe ve 8 yaşından küçük çocuklarda kontrendike."},{"q":"Tetrasiklinlerin gebelikte kullanılmamasının başlıca nedeni nedir?","o":["Gri sendrom","Kernikterus","Ototoksisite","Fetüsün kemik ve süt dişlerinde deformasyon","Nöral tüp defekti"],"a":3,"e":"Kemik ve dişlerde renk ve yapı bozukluğu."},{"q":"Özellikle demetilklortetrasiklin kullananlarda görülen yan etki hangisidir?","o":["Gri sendrom","Ototoksisite","Güneş ışığında deri tepkimeleri (fotosensitivite)","Kolestatik hepatit","Optik nevrit"],"a":2,"e":"Fotosensibilizasyon."},{"q":"Minosiklin tedavisi sırasında görülebilen özel yan etki hangisidir?","o":["Gri sendrom","Guatr","Kernikterus","Vestibüler bozukluk","Üveit"],"a":3,"e":"Kitapta minosiklin için vestibüler bozukluk belirtilmiştir."},{"q":"Bebek ve yenidoğanda tetrasikline bağlı kafa içi basınç artışıyla seyreden tablo hangisidir?","o":["Gri sendrom","Beyin psödotümörü","Kernikterus","Reye sendromu","Menenjit"],"a":1,"e":"Beyin psödotümörü."},{"q":"Aşağıdakilerden hangisi tetrasiklinlerin 1. derece kullanıldığı hastalıklardan biridir?","o":["Tifo","Menenjit","Tüberküloz","Psödomembranöz kolit","Riketsiya hastalıkları"],"a":4,"e":"Riketsiya, kolera, trahom, bruselloz, veba 1. derece."},{"q":"Sifiliz tedavisinde alternatif ilaç olarak gösterilen grup hangisidir?","o":["Tetrasiklinler","Aminoglikozidler","Kinolonlar","Nitroimidazoller","Polimiksinler"],"a":0,"e":"2. derece hastalıklar arasında."},{"q":"Kloramfenikolün en sık kullanıldığı enfeksiyon hangisidir?","o":["Salmonella typhi (tifo)","Tüberküloz","Sistit","Gonore","Akne U.push({"id":"u6","no":6,"title":"Kemoterapötikler III: Antifungal, antiparaziter ve antiviral ilaçlar","kisa":"Antifungaller, antiamibikler, antimalaryaller, antihelmintikler, ektoparazit ilaçları, antiviraller","s":[{"h":"1. Antifungal ilaçlar","b":"\n<p>Mukoza ve deride yerel ve sistemik mantar enfeksiyonlarında kullanılır. <b>Antibakteriyellerden daha toksiktir.</b> Tedavi haftalar, hatta aylar sürer; <b>nüks ihtimali yüksektir</b>.</p>\n<p><b>Yerleşime göre mantar enfeksiyonları:</b> yüzeyel cilt-mukoza (pitriyazis versikolor, dermatofitoz, kandidoz); cilt altı ve osteoartiküler (sporotrikoz, kromoblastomikoz); derin/viseral (aspergilloz, kandidoz, sporotrikoz, blastomikoz).</p>\n<p><b>Toksik etkiler:</b> nefrotoksisite (uzun süre <b>amfoterisin B</b>), hepatit (<b>ketokonazol</b>), İV verilişte flebit (mikonazol nitrat, amfoterisin B), GİS bozukluğu, hematolojik bozukluk.</p>\n<table><tr><th>İlaç</th><th>Özellik</th><th>Yan etki / not</th></tr>\n<tr><td><b>Amfoterisin B</b></td><td>Geniş spektrumlu, <b>fungisid</b>; antibakteriyel etkisi yok. Ağız, sindirim yolu mukozası ve özellikle <b>derin doku mantarları</b></td><td>Titreme, ateş, kusma, konvülsiyon, anafilaksi, tromboflebit, sarılık, <b>böbrek bozukluğu</b>. KE: böbrek bozukluğu</td></tr>\n<tr><td><b>Nistatin</b></td><td>Sindirim yolu mantarları (kandida, aspergillus, blastomyces, trichophyton); cilt-mukoza solüsyon/pomat; <b>vajinal pomat ve ovül</b></td><td>—</td></tr>\n<tr><td><b>Griseofulvin</b></td><td>Dar spektrum; dermatofitler (microsporum, trichophyton). Keratine afinitesi yüksek → <b>tırnak ve kıl</b>; tırnakta <b>4 ay</b></td><td>Baş dönmesi, baş ağrısı, fotosensitivite. KE: <b>gebeliğin ilk trimesteri, porfiri, alkol</b>. Enzim indüktörü → kontraseptif ve K antivitamini etkisini azaltır</td></tr>\n<tr><td><b>Flusitozin</b></td><td>Dar spektrum: kandida, kriptokok</td><td>Lökopeni, trombopeni, transaminaz artışı, ülseratif kolit; böbrek yetmezliği ve amfoterisin B ile risk artar</td></tr>\n<tr><td><b>Terbinafin</b></td><td>Onikomikoz, dermatofit, aspergillus; mayalara az; lokal/sistemik, pahalı</td><td>Tat alma bozukluğu, KC enzim artışı</td></tr>\n<tr><td><b>Ketokonazol, mikonazol, flukonazol, itrakonazol</b></td><td>Kandida ve dermatofitler başta, geniş spektrum</td><td><b>Testosteron ve kortizol düzeyinde düşme</b>, transaminaz artışı, hepatit</td></tr></table>"},{"h":"2. Antiamibik ilaçlar","b":"\n<p><i>Entamoeba histolytica</i> kolon mukozasında kolit yapar: <b>ağrılı, kanlı, mukuslu ishal</b> = amebiyaz (amipli dizanteri). Amip portal dolaşımla KC'ye gelip önce hepatit, sonra <b>KC apsesi</b> yapabilir.</p>\n<ul><li><b>Difetarson:</b> amip ve nematodlara (oksiyür) etkili; toksik. Yan etki: baş ağrısı, bulantı, hepatit, medüller aplazi.</li>\n<li><b>Emetin:</b> amibin hareketli formuna etkili; KC apsesi, amibik hepatit, akut amibik kolit. KVS, GİS ve çizgili kasa toksik; yerini <b>dihidroemetin</b>e bırakmıştır.</li>\n<li><b>Furazolin:</b> alkolle vazomotor reaksiyon.</li>\n<li><b>Paromomisin:</b> amebosid antibiyotik, <b>tenyaya da etkili</b>.</li>\n<li><b>5-Nitroimidazoller</b> (metronidazol, ornidazol, tinidazol): amip, trikomonas, clostridium.</li>\n<li><b>Klorokin fosfat:</b> sıtmada da kullanılır. Amibiyazde kullanılan antibiyotikler: paromomisin sülfat, tetrasiklin, oksitetrasiklin.</li></ul>"},{"h":"3. Antimalaryal ilaçlar","b":"\n<p>Sıtma (malarya): <i>Plasmodium</i> türlerinin yaptığı, <b>nöbetler halinde ateşle</b> seyreden hastalık; <b>Anofel</b> sivrisineği ve kan nakliyle bulaşır. Türkiye'de tedavi <b>Sıtma Savaş Bölge Başkanlıkları</b>nca yaptırılır.</p>\n<table><tr><th>İlaç</th><th>Özellik</th></tr>\n<tr><td><b>Kinin</b></td><td><b>Kınakına</b> bitkisinden. Yan etki: alerji, kusma, <b>kulak çınlaması</b>, baş dönmesi, yüksek dozda renk görme bozukluğu, halüsinasyon, miyokard depresyonu. KE: <b>kardiyak ileti bozukluğu</b></td></tr>\n<tr><td><b>Klorokin</b></td><td>Oral hızlı emilim, çabuk etki. Yan etki: bulantı, iştahsızlık, baş ağrısı, geçici görme bozukluğu, kaşıntı</td></tr>\n<tr><td><b>Pirimetamin</b></td><td><b>Sülfadoksin ile kombine (Fansidar)</b>; profilaktik ve tedavi edici. <b>Düşük yaptığı için gebede kullanılmaz</b>; kemik iliği depresyonu</td></tr>\n<tr><td>Proguanil</td><td>Oral alımdan <b>3 saat sonra</b> etki; toksisitesi az</td></tr>\n<tr><td>Meflokin</td><td>Klorokine benzer</td></tr>\n<tr><td><b>Artemisinin</b></td><td><i>Artemisia annua</i> bitkisinden</td></tr></table>"},{"h":"4. Antihelmintik ilaçlar","b":"\n<p>Helmintler GİS lümeni, kan damarları, lenfatikler ve dokulara yerleşir; yumurtalı içecek ve yiyeceklerle ağızdan bulaşır. İlaçlar helminti <b>öldürür</b> ya da <b>felç edip</b> barsaktan atar. Üç grup: <b>sestodlar (tenya)</b>, <b>nematodlar</b> (askaris, oksiyür, ankilostoma), <b>trematodlar</b>.</p>\n<ul><li><b>Sestodlar:</b> tenisid ilaçlar (dikorfen, mepakrin, paromomisin). <b>Niklosamid:</b> barsaktan emilmez; <b>sabah aç karna, 1 saat ara ile 2 kez 1 g</b>; sonuç alınamazsa <b>3 hafta sonra</b> tekrar.</li>\n<li><b>Nematodlar:</b>\n<ul><li><b>Piperazin:</b> askaris (solucan) ve oksiyür (kıl kurdu); parazitleri <b>felç edip</b> attırır. Yan etki: bulantı, ishal, baş dönmesi, görme bozukluğu, kas zayıflığı.</li>\n<li><b>Pirvinyum pamoat:</b> oksiyür. <b>Pirantel pamoat:</b> oksiyür, askaris, ankilostoma. <b>Befenyum:</b> askaris, ankilostoma, trikosefal.</li>\n<li><b>Tiabendazol:</b> çoğu nematod; türevleri <b>flubendazol, mebendazol, albendazol</b>.</li>\n<li><b>Levamizol:</b> askaris, ankilostoma; <b>immünomodülatör</b> etkisi de var.</li>\n<li><b>Doku nematodları:</b> <b>dietilkarbamazin</b> (mikrofilaryalar: <i>Wuchereria bancrofti</i>, Loa loa), <b>suramin</b> (onkoserk).</li></ul></li>\n<li><b>Trematodlar (şistozomiyaz):</b> nitrotiazol türevleri (<b>bir hafta 25 mg/kg/gün</b>); <b>prazikuantel</b>, metrifonat, oksaminik.</li></ul>"},{"h":"5. Ektoparazitlere karşı ilaçlar","b":"\n<p>Deri veya stratum korneuma yerleşen böcekler dermatit yapar; belirgin bulgu <b>kaşıntı</b>dır. İnsanda iki önemli ektoparazit: <b>uyuz etkeni (<i>Sarcoptes scabiei</i>)</b> ve <b>bit (<i>Pediculus</i>)</b>.</p>\n<ul><li>İlaçlar lipofilik olduğundan kitin örtüyü kolay geçer. Uyuz ilacı = <b>skabisid</b>, bit ilacı = <b>pedikülisid</b>.</li>\n<li>Uyuzda hasta önce <b>bol sabun ve keseyle duş</b> almalı. Yatak örtüsü ve giysiler <b>kaynatılıp ütülenmeli</b> ya da etüvlenmeli.</li>\n<li>Pedikülisidler yumurtaya yeterince etkili değildir → <b>8–10 gün sonra 2. kür</b>.</li>\n<li><b>Benzil benzoat:</b> güçlü skabisid; lokal anestezik etkiyle kaşıntıyı azaltır. <b>%25</b>'lik solüsyon sürülür; <b>göze temas ettirilmez</b>. İlk uygulamadan <b>12 saat sonra</b> ikinci kez sürülür, <b>24 saat sonra</b> banyoyla arındırılır, <b>10 gün sonra</b> 2. kür.</li>\n<li><b>Malathion:</b> kolinesterazı dönüşümsüz engeller; pedikülisid, <b>ovisid</b> (yumurta öldürücü).</li>\n<li><b>Karbaril, piretrum ekstresi:</b> pedikülisid.</li>\n<li><b>Kükürtlü merhemler:</b> skabisid; vazelinde <b>%5–10</b>; Wilkinson pomadı (ardıç katranı + kükürt).</li></ul>"},{"h":"6. Antiviral ilaçlar – genel ve antiherpetikler","b":"\n<p>Virüsler konakçı hücreye çok bağımlı olduğundan <b>seçiciliği yüksek ilaç geliştirmek zordur</b>.</p>\n<table><tr><th>İnfeksiyon tipi</th><th>Özellik</th><th>Örnek</th></tr>\n<tr><td><b>Litik</b></td><td>Yeni virüs yapıp hücreyi patlatır; hızlı yayılır</td><td>Nezle, kızamık</td></tr>\n<tr><td><b>Süregelen</b></td><td>Yavaş üreme, hafif hücre hasarı, ara ara litik alevlenme</td><td>HIV (AIDS), kronik hepatit B</td></tr>\n<tr><td><b>Latent</b></td><td>Virüs üremeden kalır, saptanması güç</td><td><b>Antiviraller latent virüse etkisiz</b></td></tr></table>\n<p>Litik infeksiyonda belirtiler çıkmadan virüs çok çoğaldığından <b>teşhis ve tedavi erken</b> yapılmalıdır.</p>\n<ul><li><b>Asiklovir:</b> HSV tip 1-2 ve varisella virüsünün replikasyonunu seçici inhibe eder; nükleozidik inhibitör. Primer olarak HSV; VZV, CMV, EBV'ye de in vitro etkili. Topikal, oral, parenteral. Yan etki <b>oldukça az</b> (baş ağrısı, bulantı, kusma; seyrek alopesi, depresyon, dönüşümlü böbrek bozukluğu). <b>Probenesid</b> böbrek klerensini azaltır.</li>\n<li><b>Valasiklovir:</b> asiklovirin L-valin esteri; vücutta asiklovire dönüşür; <b>zona ağrısını önlemede</b>; biyoyararlanımı daha iyi.</li>\n<li><b>Famsiklovir:</b> herpes zoster ve HSV, tekrarlayan ataklar.</li>\n<li><b>Pensiklovir:</b> trifosfata dönünce etkili; <b>dudak uçuğunda (labial herpes) lokal</b>.</li>\n<li><b>İdoksuridin:</b> timidin analoğu; konakçı hücreye de etkili → <b>yalnız lokal</b>; direnç sık. <b>HSV keratitinin yüzeyel şekilleri</b>. Yan etki: iritasyon, fotofobi, korneada gölgelenme.</li>\n<li><b>Trifluridin:</b> HSV keratitinde <b>%1</b>'lik; dokuya penetrasyonu idoksuridinden fazla → derin enfeksiyonda da (keratokonjonktivit, üveit, keratitis dendritika). Yan etki: keratopati, ödem.</li>\n<li><b>Edoksudin:</b> HSV'ye etkili.</li></ul>"},{"h":"7. Antihepatit B, interferonlar, anti-CMV, antigribal","b":"\n<ul><li><b>Vidarabin fosfat:</b> yetişkinde replikasyonlu kronik hepatit B; HSV'ye de etkili.</li>\n<li><b>İnterferonlar:</b> viral replikasyonu inhibe eden doğal glikoprotein sitokinler; immünomodülatör ve antiproliferatif. <b>IFN-α lökositlerden, IFN-β fibroblastlardan, IFN-γ duyarlı lenfositlerden.</b> Geniş spektrumlu; antikorların aksine tüm virüslere karşı koruyucudur. Asıl etki <b>protein translasyonunun inhibisyonu</b>.</li>\n<li><b>Gansiklovir:</b> deoksiguanozin analoğu; CMV'ye asiklovirden <b>yaklaşık 50 kat</b> güçlü. Trifosfata dönüşmesi gerekir (UL97 kinaz). Böbrekle atılır → böbrek yetmezliğinde doz azaltılır.</li>\n<li><b>Foskarnet:</b> nükleozid olmayan trisodyum fosfonoformat; AIDS'li hastada <b>gansiklovire dirençli CMV retiniti</b>; asiklovire dirençli HSV ve VZV; HIV-1. DNA polimeraz ve ters transkriptazı inhibe eder.</li>\n<li><b>Sidofovir:</b> AIDS'te CMV retiniti için yeni ilaç.</li>\n<li><b>Amantadin:</b> vakuol pH'sını tamponlayıp genetik materyalin sitoplazmaya geçişini engeller. Klinikte yalnız <b>influenza A (özellikle A2)</b>. <b>Parkinson</b> ve ilaca bağlı ekstrapiramidal reaksiyonlarda da kullanılır. Yan etki dozla ilişkili; baş dönmesi, sersemlik, insomni (<b>%5–10</b>). <b>Gebe ve emzirende kontrendike.</b></li>\n<li><b>Rimantadin:</b> amantadin analoğu; influenza A profilaksisi ve tedavisi.</li>\n<li><b>Ribavirin:</b> geniş spektrumlu pürin analoğu; influenza A-B ve <b>RSV</b>.</li></ul>"}],"q":[{"q":"Antifungal ilaçlarla ilgili hangisi YANLIŞTIR?","o":["Antibakteriyel ilaçlardan daha az toksiktirler","Tedavi haftalar, hatta aylar sürer","Nüks ihtimali yüksektir","Amfoterisin B nefrotoksiktir","Ketokonazol hepatit yapabilir"],"a":0,"e":"Antifungaller antibakteriyel preparatlardan daha toksiktir."},{"q":"Uzun süre kullanıldığında nefrotoksik etki gösteren antifungal hangisidir?","o":["Nistatin","Griseofulvin","Terbinafin","Flusitozin","Amfoterisin B"],"a":4,"e":"Amfoterisin B."},{"q":"Antibakteriyel etkisi olmayan, derin doku mantarlarına karşı kullanılan geniş spektrumlu fungisid antibiyotik hangisidir?","o":["Griseofulvin","Amfoterisin B","Nistatin","Flusitozin","Terbinafin"],"a":1,"e":"Amfoterisin B."},{"q":"Ketokonazol kullanımında özellikle izlenmesi gereken yan etki hangisidir?","o":["Ototoksisite","Gri sendrom","Hepatit","Optik nevrit","Kernikterus"],"a":2,"e":"Hepatit ketokonazol kullanımında oluşabilir."},{"q":"Vajinal mantar enfeksiyonunda ovül ve pomat formu kullanılan antifungal hangisidir?","o":["Griseofulvin","Amfoterisin B","Flusitozin","Nistatin","Terbinafin"],"a":3,"e":"Nistatinin jinekolojide pomat ve ovülleri vardır."},{"q":"Keratinize dokulara afinitesi yüksek olduğu için tırnak ve kıl mantarlarında kullanılan dar spektrumlu antifungal hangisidir?","o":["Nistatin","Griseofulvin","Amfoterisin B","Flusitozin","Ketokonazol"],"a":1,"e":"Griseofulvin; tırnakta 4 ay."},{"q":"Tırnak mantarında griseofulvin ne kadar süre uygulanmalıdır?","o":["4 ay","2 hafta","1 ay","1 yıl","10 gün"],"a":0,"e":"Kitapta 4 ay."},{"q":"Griseofulvinin kontrendikasyonları arasında hangisi yer alır?","o":["Hipertansiyon","Diyabet","Gebeliğin ilk trimesteri ve porfiri","Astım","Anemi"],"a":2,"e":"Gebeliğin ilk trimesteri, porfiri, alkol."},{"q":"Enzim indüktörü olduğu için oral kontraseptiflerin etkisini azaltan antifungal hangisidir?","o":["Nistatin","Amfoterisin B","Flusitozin","Griseofulvin","Terbinafin"],"a":3,"e":"Griseofulvin kontraseptif ve K antivitaminlerinin etkisini azaltır."},{"q":"Yalnızca kandida ve kriptokok gibi bazı maya mantarlarına etkili dar spektrumlu antifungal hangisidir?","o":["Terbinafin","Griseofulvin","Ketokonazol","Amfoterisin B","Flusitozin"],"a":4,"e":"Flusitozin."},{"q":"Testosteron ve kortizol düzeylerinde düşmeye yol açabilen antifungal grubu hangisidir?","o":["Polienler (nistatin)","Griseofulvin","Azoller (ketokonazol, flukonazol vb.)","Terbinafin","Flusitozin"],"a":2,"e":"Ketokonazol, mikonazol, flukonazol ve itrakonazol."},{"q":"Ağrılı, kanlı, mukuslu ishal ile seyreden ve KC apsesine yol açabilen protozoer hastalık hangisidir?","o":["Giardiyaz","Sıtma","Trikomoniyaz","Amebiyaz (amipli dizanteri)","Toksoplazmoz"],"a":3,"e":"Entamoeba histolytica."},{"q":"Amipin karaciğere ulaşma yolu hangisidir?","o":["Portal dolaşım","Lenfatik sistem","Safra yolları","Solunum yolu","Sistemik arter"],"a":0,"e":"Mukoza damarları içine geçen amip portal dolaşımla KC'ye gelir."},{"q":"Amibin hareketli formuna etkili olup toksisitesi nedeniyle yerini dihidroemetine bırakan ilaç hangisidir?","o":["Difetarson","Paromomisin","Klorokin","Metronidazol","Emetin"],"a":4,"e":"Emetin KVS, GİS ve çizgili kaslara toksiktir."},{"q":"Amebosid etkisinin yanında tenyaya da etkili olan antibiyotik hangisidir?","o":["Metronidazol","Paromomisin","Klorokin","Emetin","Furazolin"],"a":1,"e":"Paromomisin."},{"q":"Sıtmayı bulaştıran vektör hangisidir?","o":["Kum sineği","Kene","Bit","Anofel sivrisineği","Pire"],"a":3,"e":"Anofel çeşidi sivrisinekler ve kan nakli."},{"q":"Türkiye'de sıtma tedavisini yaptıran kurum hangisidir?","o":["Sıtma Savaş Bölge Başkanlıkları","Aile hekimlikleri","Özel hastaneler","Eczaneler","Belediyeler"],"a":0,"e":"Hastalar oraya başvurarak tedavi olmalıdır."},{"q":"Kınakına bitkisinden elde edilen antimalaryal ilaç hangisidir?","o":["Klorokin","Meflokin","Kinin","Artemisinin","Proguanil"],"a":2,"e":"Kinin."},{"q":"Kininin yan etkileri arasında hangisi yer alır?","o":["Gri sendrom","Kernikterus","Guatr","Fotosensitivite","Kulak çınlaması"],"a":4,"e":"Kulak çınlaması, baş dönmesi, renk görme bozukluğu, halüsinasyon, miyokard depresyonu."},{"q":"Kinin kimlerde kontrendikedir?","o":["Astımlılarda","Kardiyak ileti bozukluğu olanlarda","Diyabetiklerde","Gebelerde","Böbrek taşı olanlarda"],"a":1,"e":"Kardiyak ileti bozukluğu."},{"q":"Fansidar hangi ilaçların kombinasyonudur?","o":["Pirimetamin + sülfadoksin","Klorokin + primakin","Kinin + doksisiklin","Artemisinin + lumefantrin","Trimetoprim + sülfametoksazol"],"a":0,"e":"Pirimetamin genellikle sülfadoksinle kombine edilir."},{"q":"Düşüklere yol açtığı için gebelerde kullanılmaması gereken antimalaryal ilaç hangisidir?","o":["Klorokin","Pirimetamin","Proguanil","Meflokin","Kinin"],"a":1,"e":"Kitapta pirimetamin için belirtilmiştir."},{"q":"Artemisia annua bitkisinden elde edilen antimalaryal hangisidir?","o":["Kinin","Meflokin","Klorokin","Proguanil","Artemisinin"],"a":4,"e":"Artemisinin."},{"q":"Helmintlerin başlıca bulaş yolu nedir?","o":["Solunum","Kan nakli","Yumurtalı içecek ve yiyeceklerin ağızdan alınması","Cinsel temas","Böcek ısırığı"],"a":2,"e":"Oral bulaş."},{"q":"Niklosamid nasıl uygulanır?","o":["Akşam tok karna tek doz","Haftada bir 500 mg","Günde 3 kez 10 gün","Sabah aç karna, 1 saat arayla 2 kez 1 g","İM tek doz"],"a":3,"e":"Sonuç alınamazsa 3 hafta sonra tekrarlanır."},{"q":"Askaris ve oksiyürü felç edip dışarı atılmasını sağlayan antihelmintik hangisidir?","o":["Niklosamid","Prazikuantel","Dietilkarbamazin","Suramin","Piperazin"],"a":4,"e":"Pip i hangisidir?","o":["IFN-β","IFN-γ","IFN-δ","IFN-α","IFN-λ"],"a":3,"e":"IFN-α lökosit, IFN-β fibroblast, IFN-γ lenfosit."},{"q":"İnterferonların asıl antiviral etki mekanizması nedir?","o":["DNA jiraz inhibisyonu","Hücre duvarı sentezini engelleme","Folik asit sentezini engelleme","Ters transkriptaz aktivasyonu","Protein translasyonunun inhibisyonu"],"a":4,"e":"Asıl etki protein translasyonunun inhibisyonudur."},{"q":"CMV'ye asiklovirden yaklaşık 50 kat daha güçlü etkili ilaç hangisidir?","o":["Valasiklovir","Amantadin","Gansiklovir","Ribavirin","İdoksuridin"],"a":2,"e":"Gansiklovir."},{"q":"AIDS hastalarında gansiklovire dirençli CMV retinitinde kullanılan nükleozid olmayan ilaç hangisidir?","o":["Foskarnet","Asiklovir","Ribavirin","Amantadin","Trifluridin"],"a":0,"e":"Foskarnet."},{"q":"Klinikte yalnızca influenza A virüsüne etkili olduğu gösterilen ve Parkinson tedavisinde de kullanılan ilaç hangisidir?","o":["Ribavirin","Amantadin","Asiklovir","Gansiklovir","Vidarabin"],"a":1,"e":"Amantadin."},{"q":"Amantadin kimlerde kontrendikedir?","o":["Yaşlılarda","Diyabetiklerde","Hipertansiflerde","Gebe ve emziren kadınlarda","Çocuklarda"],"a":3,"e":"Kitaptaki kontrendikasyon."},{"q":"Respiratuar sinsityal virüs (RSV) üzerine etkili geniş spektrumlu pürin analoğu hangisidir?","o":["Amantadin","Rimantadin","Ribavirin","Asiklovir","Foskarnet"],"a":2,"e":"Ribavirin."},{"q":"Yetişkinlerde replikasyonlu kronik hepatit B tedavisinde etkili olduğu belirtilen ilaç hangisidir?","o":["Amantadin","Vidarabin fosfat","Trifluridin","Pensiklovir","Rimantadin"],"a":1,"e":"Vidarabin fosfat."}]});
